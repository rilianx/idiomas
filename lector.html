header select{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 6px;max-width:34vw;min-width:0;font-size:14px}

<script src="comun.js"></script>
<script>
'use strict';
/* =====================================================================
   Leamos: lector de libros para aprender idiomas (app hermana de «Hablemos coreano»).
   Lee en voz alta marcando la oración actual, traduce la palabra que tocas, sigue
   cuánto sabes de cada palabra (como Anki) y simplifica el libro a tu nivel.
   Todo vive en el navegador: la clave y el diccionario en localStorage (compartidos con
   «Hablemos» en el mismo sitio), los libros en IndexedDB.
   ===================================================================== */

const APP_VERSION = '2026-11-07 · 18';   // (subir en cada cambio: se ve en la biblioteca y en Ajustes)
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DAY = 864e5;

/* ---------- idiomas y niveles ---------- */
const LANGS = {
  ko: { name: 'coreano', native: '한국어', extra: 'Hanja' },
  en: { name: 'inglés', native: 'English', extra: 'Pronunciación' },
  ja: { name: 'japonés', native: '日本語', extra: 'Lectura' },
  zh: { name: 'chino', native: '中文', extra: 'Pinyin' },
  fr: { name: 'francés', native: 'Français', extra: 'Pronunciación' },
  de: { name: 'alemán', native: 'Deutsch', extra: 'Pronunciación' },
  it: { name: 'italiano', native: 'Italiano', extra: 'Pronunciación' },
  pt: { name: 'portugués', native: 'Português', extra: 'Pronunciación' }
};
const CEFR = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
const lvIdx = c => CEFR.indexOf(c);
const lvLabel = (lang, c) => !c ? '—' : lang === 'ko' ? `${c} · TOPIK ${lvIdx(c) + 1}` : c;
const CJK = l => l === 'ja' || l === 'zh';

/* ---------- ajustes (la clave es la misma de «Hablemos») ---------- */
const HAB = load('hab-set', {});
const DEFAULT_SET = { chatModel: HAB.chatModel || 'claude-haiku-5-5', defModel: HAB.defModel || 'claude-opus-5-5', simpModel: HAB.chatModel || 'claude-haiku-5-5',
  myLevel: { ko: 'A2', en: 'B1' }, rate: 0.9, voices: {}, autoAnalyze: true, autoSpeakWord: true, fs: 20, theme: HAB.theme || '', showTr: false };
const S = Object.assign({}, DEFAULT_SET, load('lec-set', {}));
const saveSet = () => save('lec-set', S);
let USAGE = load('lec-usage', {});
const myLevel = lang => S.myLevel[lang] || 'A2';
function applyLook(){ document.documentElement.style.setProperty('--fs', S.fs + 'px'); if (S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme; }
applyLook();
// si se cambia la clave en «Hablemos» (otra pestaña), se usa la nueva
addEventListener('storage', e => {
  if (e.key === 'hab-keys') Object.assign(KEYS, load('hab-keys', {}));
  if (e.key === dictKey(DLANG)) { const cur = load(e.key, {}); for (const l of DIRTY) if (DICT[l]) cur[l] = DICT[l]; DICT = cur; }
});

/* ---------- diccionario por idioma (el coreano es el mismo de «Hablemos») ---------- */
const dictKey = lang => lang === 'ko' ? 'hab-dict' : 'lec-dict-' + lang;
let DLANG = 'ko', DICT = load(dictKey('ko'), {});
const DIRTY = new Set(); let dictTimer = 0;
function useDict(lang){ if (lang === DLANG) return; flushDict(); DLANG = lang; DICT = load(dictKey(lang), {}); }
function touch(lemma){ DIRTY.add(lemma); clearTimeout(dictTimer); dictTimer = setTimeout(flushDict, 500); }
// se guardan solo las palabras cambiadas, sobre lo que haya guardado la otra app
function flushDict(){
  clearTimeout(dictTimer); if (!DIRTY.size) return;
  const cur = load(dictKey(DLANG), {});
  for (const l of DIRTY) { if (DICT[l]) cur[l] = DICT[l]; else delete cur[l]; }
  DIRTY.clear(); save(dictKey(DLANG), cur);
  for (const [l, e] of Object.entries(cur)) if (!DICT[l]) DICT[l] = e;
}
addEventListener('pagehide', () => { flushDict(); savePosNow(); });
const SKIP_POS = new Set(['puntuación', 'nombre propio', 'número', 'partícula', 'artículo']);
function lemmaOf(tok, lang = BOOK?.lang){
  let l = (tok.lemma || '').trim(); if (!l) return '';
  if (lang !== 'ko' && tok.pos !== 'nombre propio') l = l.toLowerCase();
  return l;
}
function ensureEntry(tok, sentence){
  const l = lemmaOf(tok); if (!l) return null;
  let e = DICT[l];
  if (!e) e = DICT[l] = { lemma: l, pos: tok.pos || 'otro', gloss: tok.gloss || '', status: 'nueva', seen: 0, forms: {}, added: Date.now(), source: 'lector', level: null, detailed: false };
  if (!e.gloss && tok.gloss) e.gloss = tok.gloss;
  e.forms = e.forms || {};
  if (tok.t && tok.t.toLowerCase() !== l.toLowerCase() && !e.forms[tok.t]) e.forms[tok.t] = tok.form || '';
  if (!e.sentence && sentence) e.sentence = sentence.trim();
  touch(l);
  return e;
}

/* ---------- repetición espaciada (como Anki) ----------
   Cada palabra tiene un intervalo. Leer una oración sin pedir la traducción de una palabra es un «bien»: si ya le
   tocaba repaso, el intervalo crece (1 día, luego ×facilidad). Pedir su traducción es un «otra vez»: el intervalo
   vuelve a cero y la facilidad baja. El puntaje (0–100 %) sale del intervalo: 1 día ≈ 17 %, 1 semana ≈ 50 %, 2 meses = 100 %. */
function srsOf(e){
  if (!e.srs) e.srs = { ivl: e.status === 'conocida' ? 21 : 0, ease: 2.5, due: 0, reps: 0, lapses: 0, last: 0, lapsedAt: 0 };
  return e.srs;
}
const scoreOf = e => { if (!e) return 0; const s = e.srs; if (!s) return e.status === 'conocida' ? 75 : 0; return Math.min(100, Math.round(100 * Math.log(1 + s.ivl) / Math.log(61))); };
function srsGood(e){
  const s = srsOf(e), now = Date.now();
  if (now < s.due) return false;
  if (s.ivl === 0) s.ivl = s.lapses ? 10 / 1440 : 1;        // tras un olvido, primero un paso de 10 minutos
  else if (s.ivl < 1) s.ivl = 1;
  else s.ivl = Math.max(s.ivl + 1, s.ivl * s.ease);
  s.reps++; s.last = now; s.due = now + s.ivl * DAY;
  e.heard = (e.heard || 0) + 1; e.seen = (e.seen || 0) + 1; e.last = now;   // (para «Hablemos»)
  if (scoreOf(e) >= 50 && e.status !== 'conocida') { e.status = 'conocida'; e.knownAt = now; }
  touch(e.lemma); return true;
}
function srsAgain(e){
  const s = srsOf(e), now = Date.now();
  if (s.lapsedAt && now - s.lapsedAt < 10 * 60e3) return;    // mirarla varias veces seguidas cuenta como un solo olvido
  if (s.reps || s.ivl) { s.lapses++; s.ease = Math.max(1.3, s.ease - 0.2); }
  s.ivl = 0; s.due = now + 10 * 60e3; s.lapsedAt = now; e.lookups = (e.lookups || 0) + 1;
  touch(e.lemma);
}
function setKnown(e, known){
  const s = srsOf(e), now = Date.now();
  if (known) { s.ivl = Math.max(s.ivl, 30); s.due = now + s.ivl * DAY; e.status = 'conocida'; e.knownAt = now; e.heard = Math.max(e.heard || 0, 5); }
  else { s.ivl = 0; s.due = 0; e.status = 'nueva'; }
  touch(e.lemma);
}
// subrayado: «nueva» (línea continua) bajo 30 %, «aprendiendo» (punteada) hasta 70 %
function wordClass(tok){
  if (!tok.lemma || SKIP_POS.has(tok.pos)) return '';
  const e = DICT[lemmaOf(tok)];
  if (!e) return tok.cefr && lvIdx(tok.cefr) >= lvIdx(myLevel(BOOK.lang)) ? 'new' : '';
  if (!e.srs && e.status === 'conocida') return '';
  const sc = scoreOf(e);
  return sc < 30 ? 'new' : sc < 70 ? 'learn' : '';
}


/* ---------- libros en IndexedDB ----------
   books: datos del libro y posición · text: cada capítulo · simp: capítulos simplificados · ana: análisis de cada párrafo
   expl: explicaciones guardadas (para no volver a pagarlas) */
let DBP = null;
function db(){
  if (!DBP) DBP = new Promise((ok, ko) => {
    // v2: expl guarda las explicaciones del modelo caro (palabra en su oración y trozos seleccionados)
    const r = indexedDB.open('leamos', 2);
    r.onupgradeneeded = () => {
      const d = r.result, has = n => d.objectStoreNames.contains(n);
      if (!has('books')) d.createObjectStore('books', { keyPath: 'id' });
      for (const s of ['text', 'simp', 'ana', 'expl']) if (!has(s)) d.createObjectStore(s, { keyPath: 'k' });
    };
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  });
  return DBP;
}
const req = r => new Promise((ok, ko) => { r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
async function idb(store, mode, fn){ const d = await db(); return req(fn(d.transaction(store, mode).objectStore(store))); }
const dbGet = (s, k) => idb(s, 'readonly', o => o.get(k));
const dbPut = (s, v) => idb(s, 'readwrite', o => o.put(v));
const dbAll = s => idb(s, 'readonly', o => o.getAll());
const dbPrefix = (s, p) => idb(s, 'readonly', o => o.getAll(IDBKeyRange.bound(p, p + '￿')));
const dbDelPrefix = (s, p) => idb(s, 'readwrite', o => o.delete(IDBKeyRange.bound(p, p + '￿')));
const dbDel = (s, k) => idb(s, 'readwrite', o => o.delete(k));
// muchos registros en una sola transacción (importar un libro)
async function dbPutMany(store, list){
  if (!list?.length) return;
  const d = await db();
  return new Promise((ok, ko) => { const tx = d.transaction(store, 'readwrite'), o = tx.objectStore(store); for (const r of list) o.put(r); tx.oncomplete = () => ok(); tx.onerror = () => ko(tx.error); });
}

/* ---------- abrir un EPUB (es un zip: se descomprime con lo que trae el navegador) ---------- */
async function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('no parece un EPUB (no es un zip)');
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const files = {};
  for (let i = 0; i < n && dv.getUint32(p, true) === 0x02014b50; i++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    files[td.decode(u8.subarray(p + 46, p + 46 + nl))] = { method, csize, off };
    p += 46 + nl + el + cl;
  }
  const lower = {}; for (const k of Object.keys(files)) lower[k.toLowerCase()] = k;
  return {
    async text(name){
      const f = files[name] || files[lower[name.toLowerCase()]]; if (!f) throw new Error('falta ' + name + ' en el EPUB');
      const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
      const data = u8.subarray(start, start + f.csize);
      if (f.method === 0) return td.decode(data);
      if (f.method !== 8) throw new Error('compresión no soportada');
      if (!('DecompressionStream' in window)) throw new Error('este navegador no puede descomprimir EPUB (actualízalo)');
      const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
      return td.decode(out);
    }
  };
}
function parseXML(s, type = 'application/xml'){
  let d = new DOMParser().parseFromString(s, type);
  if (d.getElementsByTagName('parsererror').length) d = new DOMParser().parseFromString(s, 'text/html');
  return d;
}
function joinPath(base, href){
  const parts = (base + decodeURIComponent(href.split('#')[0])).split('/'), out = [];
  for (const x of parts) { if (x === '..') out.pop(); else if (x !== '.' && x !== '') out.push(x); }
  return out.join('/');
}
const dirOf = p => p.includes('/') ? p.replace(/[^/]*$/, '') : '';
const BLOCK = new Set(['p','h1','h2','h3','h4','h5','h6','li','blockquote','dd','dt','pre','div','td','th','figcaption','section','article','tr','ul','ol','table','tbody','aside','header','footer','nav','figure','hr','main']);
// los párrafos de un capítulo: cada bloque de texto que no contiene otros bloques
function blocksOf(doc){
  const body = doc.body || doc.getElementsByTagName('body')[0] || doc.documentElement;
  for (const t of ['rt', 'rp', 'script', 'style']) [...body.getElementsByTagName(t)].forEach(x => x.remove());
  [...body.getElementsByTagName('br')].forEach(x => x.replaceWith('\n'));
  const out = [];
  const push = (text, h) => {
    for (const piece of text.split(/\n\s*\n/)) {
      const t = piece.replace(/\s+/g, ' ').trim();
      if (t && /[\p{L}\p{N}]/u.test(t)) out.push({ t, h });
    }
  };
  const walk = el => {
    let buf = '';
    for (const c of el.childNodes) {
      const isBlock = c.nodeType === 1 && BLOCK.has((c.localName || '').toLowerCase());
      if (isBlock) { if (buf.trim()) push(buf, false); buf = ''; walk(c); }
      else if (c.nodeType === 1 || c.nodeType === 3) buf += c.textContent;
    }
    if (buf.trim()) push(buf, /^h[1-6]$/i.test(el.localName || ''));
  };
  walk(body);
  return out;
}
// los párrafos muy largos se parten (en oraciones) para que el análisis sea rápido
function splitLong(blocks, lang){
  const out = [];
  for (const b of blocks) {
    if (b.t.length <= 900) { out.push(b); continue; }
    let cur = '';
    for (const s of splitSents(b.t, lang)) { if (cur && (cur + s).length > 700) { out.push({ t: cur.trim(), h: false }); cur = ''; } cur += s; }
    if (cur.trim()) out.push({ t: cur.trim(), h: false });
  }
  return out;
}
function guessLang(text){
  if (/[가-힣]/.test(text)) return 'ko';
  if (/[぀-ヿ]/.test(text)) return 'ja';
  if (/[一-鿿]/.test(text)) return 'zh';
  if (/\b(le|la|les|des|est|une|que|dans)\b/i.test(text) && /[éèàç]/.test(text)) return 'fr';
  if (/\b(der|die|das|und|nicht|ist)\b/i.test(text)) return 'de';
  return 'en';
}
async function parseEpub(file){
  const z = await unzip(await file.arrayBuffer());
  const opfPath = parseXML(await z.text('META-INF/container.xml')).getElementsByTagName('rootfile')[0]?.getAttribute('full-path');
  if (!opfPath) throw new Error('el EPUB no dice dónde está su índice');
  const opf = parseXML(await z.text(opfPath)), base = dirOf(opfPath);
  const meta = tag => opf.getElementsByTagNameNS('*', tag)[0]?.textContent.trim() || '';
  const items = {};
  for (const it of opf.getElementsByTagNameNS('*', 'item')) items[it.getAttribute('id')] = { href: joinPath(base, it.getAttribute('href') || ''), type: it.getAttribute('media-type') || '', props: it.getAttribute('properties') || '' };
  const spineEl = opf.getElementsByTagNameNS('*', 'spine')[0];
  const spine = [...opf.getElementsByTagNameNS('*', 'itemref')].map(r => items[r.getAttribute('idref')]).filter(x => x && /html|xml/.test(x.type));
  // títulos del índice (EPUB 3: nav; EPUB 2: toc.ncx)
  const toc = {};
  try {
    const nav = Object.values(items).find(x => /\bnav\b/.test(x.props));
    if (nav) {
      const d = parseXML(await z.text(nav.href), 'application/xhtml+xml');
      for (const a of d.getElementsByTagName('a')) { const h = a.getAttribute('href'); if (h) { const k = joinPath(dirOf(nav.href), h); if (!toc[k]) toc[k] = a.textContent.replace(/\s+/g, ' ').trim(); } }
    } else {
      const ncx = items[spineEl?.getAttribute('toc')] || Object.values(items).find(x => /ncx/.test(x.type));
      if (ncx) {
        const d = parseXML(await z.text(ncx.href));
        for (const np of d.getElementsByTagNameNS('*', 'navPoint')) {

// texto pegado o .txt: párrafos separados por líneas en blanco; capítulos si hay líneas como «Capítulo 3», «Chapter 3» o «제3장»
function parseText(text, title){
  text = text.replace(/^\uFEFF/, '');
  const lines = text.replace(/\r/g, '').split(/\n\s*\n|\n(?=\s*(?:(?:chapter|cap[ií]tulo|part|parte)\s+\S|제\s*\d+\s*[장화부]))/i).map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const lang = guessLang(text.slice(0, 3000));
  const isHead = s => s.length < 80 && (/^(chapter|cap[ií]tulo|part|parte)\s+([\dIVXLC]+|one|two|three|uno|dos|tres)\b/i.test(s) || /^제\s*\d+\s*[장화부]/.test(s) || /^(\d+|[IVXLC]+)\.?$/.test(s));
  const chapters = []; let cur = null;
  for (const t of lines) {
    if (isHead(t) || !cur || cur.blocks.length >= 80) { cur = { title: isHead(t) ? t : chapters.length ? `Parte ${chapters.length + 1}` : 'Inicio', blocks: [] }; chapters.push(cur); if (isHead(t)) { cur.blocks.push({ t, h: true }); continue; } }
    cur.blocks.push({ t, h: false });
  }
  chapters.forEach(c => c.blocks = splitLong(c.blocks, lang));
  // un índice al principio («CHAPTER I», «CHAPTER II»…) deja capítulos con solo el título: se quitan
  const full = chapters.filter(c => c.blocks.some(b => !b.h));
  if (full.length) chapters.splice(0, chapters.length, ...full);

}

function cleanGutenberg(chapters){
  const all = chapters.flatMap((c, ci) => c.blocks.map((b, bi) => ({ ci, bi, t: b.t })));
  const st = all.findIndex(x => /\*{3}\s*START OF (THE|THIS) PROJECT GUTENBERG/i.test(x.t));
  const en = all.findIndex(x => /\*{3}\s*END OF (THE|THIS) PROJECT GUTENBERG/i.test(x.t));
  if (st < 0 && en < 0) return chapters;
  const keep = new Set(all.filter((x, i) => (st < 0 || i > st) && (en < 0 || i < en)).map(x => x.ci + ':' + x.bi));
  const out = chapters.map((c, ci) => ({ ...c, blocks: c.blocks.filter((b, bi) => keep.has(ci + ':' + bi)) })).filter(c => c.blocks.length);
  return out.length ? out : chapters;
}

function splitSents(t, lang){
  const END = '.!?。！？…', CLOSE = '"\'”’»」』)]）', out = []; let start = 0;
  for (let i = 0; i < t.length; i++) {
    if (!END.includes(t[i])) continue;
    let j = i + 1; while (j < t.length && (END.includes(t[j]) || CLOSE.includes(t[j]))) j++;
    if (j < t.length && !/\s/.test(t[j]) && !'。！？'.includes(t[i])) { i = j - 1; continue; }
    if (t[i] === '.' && lang !== 'ko' && /(?:\b(?:Mr|Mrs|Ms|Dr|St|Sr|Jr|Prof|vs|etc|Mme|Mlle|Sra|Srta)|\b\p{Lu})$/u.test(t.slice(start, i))) { i = j - 1; continue; }
    while (j < t.length && /\s/.test(t[j])) j++;
    out.push(t.slice(start, j)); start = j; i = j - 1;
  }
  if (start < t.length) out.push(t.slice(start));
  // lo que no tiene letras se pega a la oración anterior
  const res = [];
  for (const s of out) { if (res.length && !/[\p{L}\p{N}]/u.test(s)) res[res.length - 1] += s; else res.push(s); }
  return res.length ? res : [t];
}

function partialSentences(raw){

    let o = '';
    for (let k = j + 1; k < raw.length; k++) {
      const ch = raw[k];
      if (ch === '"') return [o, k + 1];
      if (ch === '\\') { const n = raw[k + 1]; if (n === undefined) return null; if (n === 'u') { const h = raw.substr(k + 2, 4); if (h.length < 4) return null; o += String.fromCharCode(parseInt(h, 16)); k += 5; } else { o += { n: '\n', t: '\t' }[n] ?? n; k++; } continue; }

    let j = raw.indexOf('[', i); if (j < 0) break;
    const sent = { t: [] }; j++;
    for (;;) {

}

/* ---------- analizar párrafos (modelo barato), con una cola ---------- */
const INFLIGHT = new Map(), QUEUE = [], PARTIAL = new Map(); let running = 0;
function ensureAna(p, urgent = false){
  if (!CH || CH.missing || p < 0 || p >= CH.paras.length) return Promise.resolve(null);
  const k = anaKey(p);
  if (ANA.has(k)) return Promise.resolve(ANA.get(k));
  const old = INFLIGHT.get(k);
  if (old) { if (urgent && !old.started) { QUEUE.splice(QUEUE.indexOf(old), 1); startJob(old); } return old.promise; }
  let resolve; const promise = new Promise(r => resolve = r);
  const job = { k, p, text: CH.paras[p], sents: CH.sents[p].map(x => x.trim()), prev: CH.paras[p - 1] || '', book: BOOK, ver: CH.ver, ch: CH.ch, resolve, promise };
  INFLIGHT.set(k, job); markBusy(p, true);
  // lo que pide el lector (una palabra tocada) parte de inmediato, aunque ya haya 3 en curso
  if (urgent) startJob(job); else { QUEUE.push(job); pump(); }
  return promise;
}
function startJob(job){
  job.started = true; running++;
  analyze(job).then(rec => job.resolve(rec), e => { console.warn('análisis:', e.message); job.resolve(null); if (e instanceof NoKey || /clave|saldo|permiso/.test(e.message)) toast('No se pudo traducir: ' + errText(e)); })
    .finally(() => { running--; INFLIGHT.delete(job.k); PARTIAL.delete(job.k); onAnalyzed(job); pump(); });
}
function pump(){ while (running < 3 && QUEUE.length) startJob(QUEUE.shift()); }
const buildSents = (job, list) => job.sents.map((text, i) => ({ text, es: list[i]?.es, tokens: (list[i]?.t || []).map(parseTok).filter(Boolean) }));
// si la API dice «demasiados pedidos» o «saturado» (pasa al pedir varios a la vez), se reintenta en vez de fallar
async function askRetry(...args){
  const tries = args[4]?.retries ?? 3;
  for (let a = 0; ; a++) {
    try { return await ask(...args); }
    catch (e) {
      if (a >= tries || e instanceof NoKey || !/demasiados|saturado|429|529/.test(e.message)) throw e;
      await new Promise(r => setTimeout(r, Math.min(30000, 1500 * (a + 1) ** 2) + Math.random() * 1500));
    }
  }
}
// el párrafo se pide en grupos de 2 o 3 oraciones, todos a la vez: una palabra del final de un párrafo largo
// no espera a que se escriba todo lo anterior
function sentGroups(sents){
  const groups = []; let cur = [], len = 0;
  sents.forEach((x, i) => { if (cur.length && (len + x.length > 280 || cur.length >= 3)) { groups.push(cur); cur = []; len = 0; } cur.push(i); len += x.length; });
  if (cur.length) groups.push(cur);
  return groups;
}
async function analyze(job){
  const stored = await dbGet('ana', job.k);
  if (stored) { ANA.set(job.k, stored); return stored; }
  const lang = job.book.lang, withEs = !!S.showTr, parts = [];
  let last = 0;
  const update = () => {   // lo que ya llegó de todos los grupos se dibuja (como mucho cada 250 ms)
    if (Date.now() - last < 250) return; last = Date.now();
    PARTIAL.set(job.k, { k: job.k, sents: buildSents(job, parts), partial: true });
    onPartial(job);
  };
  await Promise.all(sentGroups(job.sents).map(async idx => {
    const before = (job.prev.slice(-300) + ' ' + job.sents.slice(0, idx[0]).join(' ')).trim().slice(-500);
    const user = `LIBRO: «${job.book.title}»${job.book.author ? ' de ' + job.book.author : ''}\nNIVEL DEL LECTOR: ${myLevel(lang)}\n` +
      (before ? `TEXTO ANTERIOR (solo contexto): ${before}\n` : '') + `\nORACIONES:\n` + idx.map((i, k) => `${k + 1}. ${job.sents[i]}`).join('\n');
    const onText = raw => { partialSentences(raw).forEach((x, k) => { if (k < idx.length) parts[idx[k]] = x; }); update(); };
    const out = await askRetry(S.chatModel, anaSystem(lang, withEs), user, anaSchema(withEs), { effort: 'low', maxTokens: 6000, ms: 90000, kind: 'read', fast: true, onText });
    idx.forEach((i, k) => { parts[i] = out.sentences?.[k] || { t: [] }; });
    last = 0; update();
  }));
  const rec = { k: job.k, sents: buildSents(job, parts), done: [], seenEs: [] };
  await dbPut('ana', rec); ANA.set(job.k, rec);
  return rec;
}
const sameChapter = job => CH && job.book.id === BOOK?.id && job.ver === CH.ver && job.ch === CH.ch;
function onPartial(job){
  if (!sameChapter(job)) return;
  rerenderPara(job.p);
  // si el lector espera el significado de una palabra de este párrafo y ya llegó, se muestra
  if (TIP_WAIT && TIP_WAIT.p === job.p) {
    const nw = findWord(TIP_WAIT.p, TIP_WAIT.si, TIP_WAIT.off);
    if (nw && TOKS.get(nw)?.tok.lemma) { TIP_WAIT = null; showTip(nw); }
  }
}
function onAnalyzed(job){
  if (!sameChapter(job)) return;
  rerenderPara(job.p);
  if (TIP_WAIT && TIP_WAIT.p === job.p) {
    const w = findWord(TIP_WAIT.p, TIP_WAIT.si, TIP_WAIT.off); TIP_WAIT = null;
    if (w && TOKS.get(w)?.tok.lemma) showTip(w); else if (TIP_EL) { const t = $('tip'); if (t) t.innerHTML = ANA.has(job.k) ? 'sin traducción' : 'no se pudo traducir'; }
  }
  if (job.p === CUR.p) showTr();
}
// la traducción de las oraciones de un párrafo, cuando se activa 文 y el párrafo se analizó sin ella
const TR_INFLIGHT = new Set();
async function ensureTr(p){
  const k = anaKey(p), rec = ANA.get(k);
  if (!rec || TR_INFLIGHT.has(k)) return;
  TR_INFLIGHT.add(k);
  try {
    const out = await ask(S.chatModel, `Traduce al español, de forma natural, cada oración numerada de un libro en ${LANGS[BOOK.lang].name}, en el contexto del párrafo. Devuelve en es una traducción por oración, en el mismo orden y la misma cantidad.`,
      rec.sents.map((x, i) => `${i + 1}. ${x.text}`).join('\n'), TR_SCHEMA, { effort: 'low', maxTokens: 4000, ms: 60000, kind: 'read', fast: true });
    rec.sents.forEach((x, i) => { x.es = out.es?.[i] || ''; });
    await dbPut('ana', rec);
  } catch (e) { rec.sents.forEach(x => { if (x.es === undefined) x.es = ''; }); toast('No se pudo traducir la oración: ' + errText(e)); }
  TR_INFLIGHT.delete(k);
  if (p === CUR.p) showTr();
}
function prefetch(){
  if (!S.autoAnalyze || !CH || CH.missing) return;
  const ahead = PLAY ? 5 : 3;   // leyendo en voz alta, se mira más adelante
  for (let p = CUR.p; p < Math.min(CH.paras.length, CUR.p + ahead); p++) ensureAna(p);
}
// lo que está a la vista (y la pantalla siguiente) también se traduce, aunque la marca no avance:
// se revisa cuando se deja de bajar la página
let visTimer = 0;
function prefetchVisible(){
  clearTimeout(visTimer);
  visTimer = setTimeout(() => {
    silentRead();
    if (!S.autoAnalyze || !CH || CH.missing) return;
    const v = $('view').getBoundingClientRect(); let n = 0;
    for (const el of document.querySelectorAll('#book .para')) {
      const r = el.getBoundingClientRect();
      if (r.bottom < v.top) continue;
      if (r.top > v.bottom + v.height || n >= 12) break;
      ensureAna(+el.dataset.p); n++;
    }
  }, 500);
}

/* ---------- leer sin ayuda (en silencio, bajando la página) ----------
   Se mide cuánto tiempo estuvo cada párrafo a la vista. Cuando sale por arriba (ya lo pasaste) y estuvo el tiempo
   mínimo para leerlo, cuenta como leído: sus palabras que no miraste suben, igual que al avanzar con ▶ o ⏭.
   La marca de la oración actual también te sigue, para que ▶ y la posición guardada queden donde vas. */
const VIS = new Map();   // clave del párrafo → segundos a la vista
const needSecs = p => { const t = CH.paras[p] || ''; const words = CJK(BOOK.lang) ? t.length / 2 : t.split(/\s+/).length; return Math.max(2, words * 0.3); };
setInterval(() => {
  if (!BOOK || !CH || CH.missing || PLAY || PANEL || SHEET || document.hidden || S.silentRead === false) return;
  const v = $('view').getBoundingClientRect();
  for (const el of document.querySelectorAll('#book .para')) {
    const r = el.getBoundingClientRect();
    if (r.bottom < v.top + 30) continue;
    if (r.top > v.bottom - 30) break;
    const k = anaKey(+el.dataset.p); VIS.set(k, (VIS.get(k) || 0) + 1);
  }
}, 1000);
function silentRead(){
  if (!BOOK || !CH || CH.missing || PLAY || S.silentRead === false) return;
  const v = $('view').getBoundingClientRect(); let firstVisible = null;
  for (const el of document.querySelectorAll('#book .para')) {
    const r = el.getBoundingClientRect(), p = +el.dataset.p;
    if (r.bottom >= v.top) { firstVisible = p; break; }
    const rec = ANA.get(anaKey(p));
    if (rec && (VIS.get(anaKey(p)) || 0) >= needSecs(p)) CH.sents[p].forEach((_, si) => creditSentence(p, si));
  }
  // la marca quedó atrás: pasa al primer párrafo a la vista
  if (firstVisible !== null && CUR.p < firstVisible) setCursor(firstVisible, 0, { scroll: '' });
}

/* ---------- dibujar el libro ---------- */
function renderReader(){
  hideTip();
  $('player').hidden = false;
  renderHeader();
  const v = $('view'); v.innerHTML = '';
  const bk = document.createElement('div'); bk.id = 'book'; bk.lang = BOOK.lang;
  const title = BOOK.chapters[CH.ch]?.title || '';
  bk.innerHTML = `<div class="chtitle">${CH.heads.has(0) && !CH.missing ? '' : esc(title)}${CH.ver !== 'o' ? ` <span class="badge lv">${esc(lvLabel(BOOK.lang, CH.ver))} · simplificado</span>` : ''}</div>`;
  if (CH.missing) {
    const ph = document.createElement('div'); ph.className = 'placeholder';
    const job = SIMP_JOBS.get(`${BOOK.id}|${CH.ver}`);
    ph.innerHTML = job ? `<p>Simplificando el libro a ${esc(CH.ver)}… (${job.doneCh}/${job.totalCh} capítulos · ${job.doneParts}/${job.totalParts} partes)</p><p class="small">Este capítulo aparecerá cuando esté listo.</p>` :
      `<p>Este capítulo todavía no está simplificado a ${esc(lvLabel(BOOK.lang, CH.ver))}.</p><div class="row" style="justify-content:center"><button class="btn" id="simpNow">Simplificar este capítulo</button><button class="btn sec" id="seeOrig">Leer el original</button></div>`;
    bk.appendChild(ph);
    v.appendChild(bk);
    if ($('simpNow')) $('simpNow').onclick = () => simplifyBook(BOOK, CH.ver, S.simpModel, [CH.ch]);
    if ($('seeOrig')) $('seeOrig').onclick = () => openChapter('o', CH.ch, CUR.p, 0);
    updateInfo(); return;
  }
  CH.paras.forEach((_, p) => bk.appendChild(paraEl(p)));
  const end = document.createElement('div'); end.className = 'chend';
  end.innerHTML = CH.ch < BOOK.chapters.length - 1 ? `— fin del capítulo —<div class="row" style="justify-content:center"><button class="btn" id="nextCh">Siguiente capítulo →</button></div>` : '— fin del libro —';
  bk.appendChild(end);
  v.appendChild(bk);
  if ($('nextCh')) $('nextCh').onclick = () => openChapter(CH.ver, CH.ch + 1);
  updateInfo();
}
function paraEl(p){
  const el = document.createElement(CH.heads.has(p) ? 'h3' : 'p'); el.className = 'para'; el.dataset.p = p;
  const rec = ANA.get(anaKey(p)) || PARTIAL.get(anaKey(p));
  CH.sents[p].forEach((st, si) => {
    const sp = document.createElement('span'); sp.className = 's'; sp.dataset.s = si;
    if (p === CUR.p && si === CUR.s) sp.classList.add('cur');
    renderSentence(sp, st, rec?.sents?.[si], p, si);
    el.appendChild(sp);
  });
  return el;
}
function rerenderPara(p){
  const old = document.querySelector(`#book .para[data-p="${p}"]`); if (!old) return;
  old.replaceWith(paraEl(p));
}
function markBusy(p, on){ document.querySelector(`#book .para[data-p="${p}"]`)?.classList.toggle('busy', on); }
const TOKS = new WeakMap();
const WORD_RE = /[\p{L}\p{M}\p{N}]+(?:['’\-][\p{L}\p{M}\p{N}]+)*/gu;
function renderSentence(el, text, ana, p, si){
  const add = (tok, off) => {
    const w = document.createElement('span'); w.className = 'w'; w.textContent = tok.t; w.dataset.o = off;
    const c = tok.lemma ? wordClass(tok) : ''; if (c) w.classList.add(c);
    if (tok.lemma && PEEK.has(`${anaKey(p)}#${si}#${lemmaOf(tok)}`)) w.classList.add('peeked');
    if (FROM && FROM.p === p && FROM.si === si && FROM.off === off) w.classList.add('from');
    TOKS.set(w, { tok, p, si }); el.appendChild(w);
  };
  const plain = (s, base) => {
    let last = 0;
    for (const m of s.matchAll(WORD_RE)) {
      if (m.index > last) el.appendChild(document.createTextNode(s.slice(last, m.index)));
      add({ t: m[0], lemma: '', pos: '', gloss: '', form: '' }, base + m.index); last = m.index + m[0].length;
    }
    if (last < s.length) el.appendChild(document.createTextNode(s.slice(last)));
  };
  let cur = 0;
  const low = text.toLowerCase();
  for (const t of ana?.tokens || []) {
    let i = text.indexOf(t.t, cur); if (i < 0) i = low.indexOf(t.t.toLowerCase(), cur);
    if (i < 0) continue;
    if (i > cur) plain(text.slice(cur, i), cur);
    add({ ...t, t: text.slice(i, i + t.t.length) }, i); cur = i + t.t.length;
  }
  if (cur < text.length) plain(text.slice(cur), cur);
}
function sentEl(p, s){ return document.querySelector(`#book .para[data-p="${p}"] .s[data-s="${s}"]`); }

/* ---------- la oración actual ---------- */
function setCursor(p, s, { scroll = 'smooth' } = {}){
  setFrom(null);
  document.querySelectorAll('#book .s.cur').forEach(x => x.classList.remove('cur'));
  document.querySelectorAll('#book .w.speaking').forEach(x => x.classList.remove('speaking'));
  CUR.p = p; CUR.s = s;
  const el = sentEl(p, s);
  if (el) {
    el.classList.add('cur');
    const r = el.getBoundingClientRect(), v = $('view').getBoundingClientRect();
    if (scroll && (r.top < v.top + v.height * 0.15 || r.bottom > v.top + v.height * 0.6)) {
      $('view').scrollBy({ top: r.top - v.top - v.height * 0.3, behavior: scroll === 'instant' ? 'instant' : 'smooth' });
    }
  }
  BOOK.pos = { ver: CH.ver, ch: CH.ch, p, s }; savePos();
  prefetch(); showTr(); updateInfo();
}
let posTimer = 0;
function savePos(){ clearTimeout(posTimer); posTimer = setTimeout(savePosNow, 800); }
function savePosNow(){ clearTimeout(posTimer); if (BOOK) dbPut('books', BOOK); }
// pasar a la siguiente oración: la que se deja cuenta como leída (las palabras que no miraste suben)
async function next(credit = true){
  if (!CH || CH.missing) return false;
  if (credit) creditSentence(CUR.p, CUR.s);
  if (CUR.s + 1 < CH.sents[CUR.p].length) { setCursor(CUR.p, CUR.s + 1); return true; }
  if (CUR.p + 1 < CH.paras.length) { setCursor(CUR.p + 1, 0); return true; }
  if (CH.ch + 1 < BOOK.chapters.length) { await openChapter(CH.ver, CH.ch + 1); return true; }
  return false;
}
function prev(){
  if (!CH) return;
  if (CUR.s > 0) setCursor(CUR.p, CUR.s - 1);
  else if (CUR.p > 0) setCursor(CUR.p - 1, CH.sents[CUR.p - 1].length - 1);
}
function creditSentence(p, s){
  const k = anaKey(p), rec = ANA.get(k);
  if (!rec || rec.done[s] || rec.seenEs[s]) return;
  const st = rec.sents[s]; if (!st) return;
  const seen = new Set(); let changed = false;
  for (const tok of st.tokens) {
    const l = lemmaOf(tok); if (!l || SKIP_POS.has(tok.pos) || seen.has(l)) continue; seen.add(l);
    if (PEEK.has(`${k}#${s}#${l}`)) continue;
    let e = DICT[l];
    // las palabras que no conoces todavía (de tu nivel o más) entran al diccionario la primera vez que las lees
    if (!e) { if (!tok.cefr || lvIdx(tok.cefr) < lvIdx(myLevel(BOOK.lang))) continue; e = ensureEntry(tok, st.text); }
    if (srsGood(e)) changed = true;
  }
  rec.done[s] = true; dbPut('ana', rec);
  if (changed) rerenderPara(p);
}

/* ---------- leer en voz alta ---------- */
const utter = (text, lang, rate = S.rate) => makeUtterance(text, lang, rate, S.voices[lang]);
function speakWord(text){
  if (!('speechSynthesis' in window) || PLAY) return;
  speechSynthesis.cancel(); speechSynthesis.speak(utter(text, BOOK?.lang || DLANG));
}
let PLAY = false, UTT = null, WAKE = null;
// la última palabra tocada (sin estar leyendo): ▶ parte desde ahí
let FROM = null, START_OFF = 0;
function setFrom(p, si, off){
  document.querySelectorAll('#book .w.from').forEach(x => x.classList.remove('from'));
  FROM = p === null ? null : { p, si, off };
  if (FROM) findWord(p, si, off)?.classList.add('from');
}
async function play(){
  if (!('speechSynthesis' in window)) { toast('Este navegador no puede leer en voz alta.'); return; }
  if (!CH || CH.missing) return;
  if (FROM) { const f = FROM; setCursor(f.p, f.si); START_OFF = f.off; }
  if (!voicesFor(BOOK.lang).length) toast(`No encontré una voz en ${LANGS[BOOK.lang].name}; se usará la voz por defecto (puedes instalar una en el sistema).`);
  PLAY = true; updatePlay();
  try { WAKE = await navigator.wakeLock?.request('screen'); } catch (e) {}
  speakCurrent();
}
function stop(){
  PLAY = false; UTT = null; updatePlay();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  WAKE?.release?.().catch(() => {}); WAKE = null;
  document.querySelectorAll('#book .w.speaking').forEach(x => x.classList.remove('speaking'));
}
function speakCurrent(){
  if (!PLAY) return;
  if (!CH || CH.missing) { stop(); return; }
  const off = START_OFF; START_OFF = 0;    // empezar a mitad de la oración (desde la palabra tocada)
  const text = sentText(CUR.p, CUR.s).trim().slice(off);
  if (!/[\p{L}\p{N}]/u.test(text)) { advanceAfter(null); return; }
  const u = utter(text, BOOK.lang);
  u._t = Date.now();
  u.onstart = () => { u._s = Date.now(); };
  u.onend = () => advanceAfter(u);
  u.onerror = ev => { if (ev.error === 'interrupted' || ev.error === 'canceled') return; advanceAfter(u); };
  u.onboundary = ev => {
    if (UTT !== u) return;
    const el = sentEl(CUR.p, CUR.s); if (!el) return;
    let best = null;
    for (const w of el.querySelectorAll('.w')) { if (+w.dataset.o <= ev.charIndex + off) best = w; else break; }
    el.querySelectorAll('.w.speaking').forEach(x => x.classList.remove('speaking'));
    best?.classList.add('speaking');
  };
  if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
  UTT = u; speechSynthesis.speak(u);
}
async function advanceAfter(u){
  if (u && (UTT !== u || u._done)) return;
  if (u) u._done = true;
  if (!PLAY) return;
  const sameP = CUR.s + 1 < (CH.sents[CUR.p] || []).length;
  const ok = await next(true);
  if (!ok) { stop(); toast('Fin del libro 🎉'); return; }
  if (sameP) speakCurrent(); else setTimeout(speakCurrent, 350);   // una pausa breve entre párrafos
}
// algunos navegadores (Android) a veces no avisan cuando terminan de leer
setInterval(() => {
  const u = UTT; if (!PLAY || !u || u._done || speechSynthesis.speaking || speechSynthesis.pending) return;
  if (u._s && Date.now() - u._s > 1000) advanceAfter(u);
  else if (!u._s && Date.now() - u._t > 5000) { if (u._retried) advanceAfter(u); else { u._retried = true; u._t = Date.now(); speechSynthesis.cancel(); speechSynthesis.speak(u); } }
}, 1000);
function updatePlay(){ $('pPlay').textContent = PLAY ? '⏸' : '▶'; }

/* ---------- traducción y párrafo original de la oración actual ---------- */
let SHOW_ORIG = false;
async function showTr(){
  const box = $('trbox');
  if (!CH || CH.missing || (!S.showTr && !SHOW_ORIG)) { box.hidden = true; return; }
  let h = '';
  if (S.showTr) {
    const rec = ANA.get(anaKey(CUR.p));
    if (rec) { rec.seenEs[CUR.s] = true; dbPut('ana', rec); }
    const es = rec?.sents[CUR.s]?.es;
    h += `<div class="lab">Traducción</div><p>${rec && es !== undefined ? esc(es || '—') : '<span class="busy">traduciendo…</span>'}</p>`;
    if (!rec) ensureAna(CUR.p, true); else if (es === undefined) ensureTr(CUR.p);
  }
  if (SHOW_ORIG && CH.ver !== 'o') {
    const o = await dbGet('text', `${BOOK.id}|${CH.ch}`);
    h += `<div class="lab">Párrafo original</div><p lang="${BOOK.lang}">${esc(o?.paras?.[CUR.p] || '—')}</p>`;
  }
  box.innerHTML = h; box.hidden = !h;
}

/* ---------- tocar una palabra: significado; dos veces: explicación detallada ---------- */
let TAP = { el: null, t: 0 }, TIP_EL = null, TIP_WAIT = null, LAST_DBL = 0;
document.addEventListener('click', ev => {
  const w = ev.target.closest?.('#book .w');
  if (!w) { if (!ev.target.closest?.('#selbtn')) hideTip(); return; }
  const sel = getSelection(); if (sel && !sel.isCollapsed && sel.toString().trim().length > 1 && Date.now() - TAP.t > 600) return;
  ev.stopPropagation();
  const now = Date.now();
  if (TAP.el === w && now - TAP.t < 450) { TAP = { el: null, t: 0 }; LAST_DBL = now; getSelection()?.removeAllRanges(); hideTip(); openWord(w); return; }
  TAP = { el: w, t: now };
  showTip(w);
});
function peek(info){
  const { tok, p, si } = info; const l = lemmaOf(tok); if (!l) return;
  const key = `${anaKey(p)}#${si}#${l}`;
  if (!PEEK.has(key)) { PEEK.add(key); const e = ensureEntry(tok, sentText(p, si)); if (e) srsAgain(e); }
}
function findWord(p, si, off){ return document.querySelector(`#book .para[data-p="${p}"] .s[data-s="${si}"] .w[data-o="${off}"]`); }
function showTip(w){
  const info = TOKS.get(w); if (!info) return;
  const { tok, p, si } = info;
  let tip = $('tip'); if (!tip) { tip = document.createElement('div'); tip.id = 'tip'; document.body.appendChild(tip); }
  TIP_EL = w;
  if (!PLAY) setFrom(p, si, +w.dataset.o);
  TIP_WAIT = null;
  if (!tok.lemma) {
    if (ANA.has(anaKey(p))) tip.innerHTML = 'sin traducción';
    else {
      // se muestra apenas llegue esa palabra (onPartial / onAnalyzed), aunque el resto del párrafo siga llegando
      tip.innerHTML = `<span class="busy" style="color:inherit">traduciendo…</span>`;
      TIP_WAIT = { p, si, off: w.dataset.o };

async function explainPhrase(sel, again = false){
  const { text, p, si, p2, si2 } = sel;
  hideTip();
  // las oraciones seleccionadas no suben al pasar (pediste ayuda con ellas)
  const [a, b] = p < p2 || (p === p2 && si <= si2) ? [[p, si], [p2, si2]] : [[p2, si2], [p, si]];
  const whole = [], range = [];
  for (let pp = a[0]; pp <= b[0]; pp++) for (let ss = pp === a[0] ? a[1] : 0; ss <= (pp === b[0] ? b[1] : CH.sents[pp].length - 1); ss++) {
    whole.push(sentText(pp, ss).trim()); range.push([pp, ss]);
    const rec = ANA.get(anaKey(pp)); if (rec) { rec.seenEs[ss] = true; dbPut('ana', rec); }
  }
  SHEET = { kind: 'phrase', text, err: '', x: {}, key: `${anaKey(a[0])}|f|${a[1]}|${text}`, args: sel, range, busyTr: false, busyEx: false };
  showSheet(); refreshSheet();
  const sh = SHEET, saved = !again && await dbGet('expl', sh.key).catch(() => null);
  // el palabra por palabra sale del análisis de los párrafos (si falta, se pide; es el modelo barato)
  for (const pp of new Set(range.map(r => r[0]))) if (!ANA.has(anaKey(pp))) ensureAna(pp, true).then(() => { if (SHEET === sh) refreshSheet(); });
  if (saved) { sh.x = saved.x; sh.saved = saved.date; refreshSheet(); return; }
  sh.busyTr = sh.busyEx = true; refreshSheet();
  const lang = BOOK.lang;
  const user = `LIBRO: «${BOOK.title}»\nNIVEL DEL LECTOR: ${myLevel(lang)}\n` + (prevSentences(a[0], a[1]) ? `ORACIONES ANTERIORES: ${prevSentences(a[0], a[1])}\n` : '') + `ORACIÓN COMPLETA: «${whole.join(' ')}»\nTROZO SELECCIONADO: «${text}»`;
  let last = 0;
  const redraw = (force) => { if (SHEET !== sh) return; if (!force && Date.now() - last < 200) return; last = Date.now(); refreshSheet(); };
  const errs = [];
  await Promise.all([
    // la traducción: rápida, con el modelo barato
    askRetry(S.chatModel, phraseTrSystem(lang), user, PHRASE_TR_SCHEMA, { effort: 'low', maxTokens: 3000, ms: 60000, kind: 'read', fast: true,
      onText: raw => { sh.x.translation = partialString(raw, 'translation'); sh.x.literal = partialString(raw, 'literal'); redraw(); } })
      .then(o => Object.assign(sh.x, o), e => errs.push('traducción: ' + errText(e))).finally(() => { sh.busyTr = false; redraw(true); }),
    // la explicación: el modelo caro, y se va mostrando mientras la escribe
    askRetry(S.defModel, phraseExSystem(lang), user, PHRASE_EX_SCHEMA, { effort: 'low', maxTokens: 12000, ms: 150000, kind: 'explain',
      onText: raw => { sh.x.explanation = partialString(raw, 'explanation'); redraw(); } })
      .then(o => Object.assign(sh.x, o), e => errs.push('explicación: ' + errText(e))).finally(() => { sh.busyEx = false; redraw(true); })
  ]);

  else dbPut('expl', { k: sh.key, x: { translation: sh.x.translation, literal: sh.x.literal, explanation: sh.x.explanation, grammar: sh.x.grammar || [], tip: sh.x.tip || '' }, date: Date.now() });

}
// las palabras del trozo, con lo que ya dice el análisis de cada párrafo
function phraseWords(sh){
  const sel = sh.text.toLowerCase(), out = []; let from = 0;
  for (const [pp, ss] of sh.range) {
    const st = ANA.get(anaKey(pp))?.sents?.[ss]; if (!st) continue;
    for (const t of st.tokens) { const i = sel.indexOf(t.t.toLowerCase(), from); if (i >= 0) { out.push(t); from = i + t.t.length; } }

/* ---------- estimar el nivel del libro ---------- */
async function sampleText(b, chars = 1500){
  const out = [], total = b.chapters.length;
  for (const ch of new Set([0.1, 0.45, 0.8].map(f => Math.min(total - 1, Math.floor(total * f))))) {
    const rec = await dbGet('text', `${b.id}|${ch}`); if (!rec) continue;
    const mid = Math.floor(rec.paras.length * 0.3); let t = '';
    for (let i = mid; i < rec.paras.length && t.length < chars; i++) if (!rec.heads.includes(i)) t += rec.paras[i] + '\n';
    if (t) out.push(t.slice(0, chars + 300));
  }
  return out;
}
async function estimateLevel(b){
  const parts = await sampleText(b);
  const user = `LIBRO: «${b.title}»${b.author ? ' de ' + b.author : ''}\n\n` + parts.map((t, i) => `FRAGMENTO ${i + 1}:\n${t}`).join('\n\n');
  const x = await ask(S.defModel, levelSystem(b.lang), user, LEVEL_SCHEMA, { effort: 'low', maxTokens: 6000, ms: 120000, kind: 'explain' });
  b.level = { ...x, model: S.defModel, date: Date.now() };
  await dbPut('books', b);

}

/* ---------- simplificar el libro a un nivel ---------- */
const SIMP_JOBS = new Map();
function knownWordsHint(lang){
  const d = lang === DLANG ? DICT : load(dictKey(lang), {});
  return Object.values(d).filter(e => scoreOf(e) >= 50 && !SKIP_POS.has(e.pos)).sort((a, b) => (b.last || 0) - (a.last || 0)).slice(0, 250).map(e => e.lemma).join(', ');
}
async function simplifyChunk(b, lvl, model, chunk, known){
  const user = `LIBRO: «${b.title}»${b.author ? ' de ' + b.author : ''}\nNIVEL: ${lvLabel(b.lang, lvl)}\n` + (known ? `PALABRAS QUE EL LECTOR YA CONOCE: ${known}\n` : '') +
    `\nPÁRRAFOS (${chunk.length}):\n` + chunk.map((t, i) => `[${i + 1}] ${t}`).join('\n\n');
  for (let attempt = 0; attempt < 2; attempt++) {
    const out = await askRetry(model, simpSystem(b.lang, lvl), user, SIMP_SCHEMA, { effort: 'low', maxTokens: 20000, ms: 180000, kind: 'simplify', retries: 6 });
    const ps = (out.paras || []).map(s => String(s).trim());
    if (ps.length === chunk.length || attempt === 1) return chunk.map((orig, i) => ps[i] || orig);
  }
}
const SIMP_PAR = () => S.simpPar || 50;   // pedidos simultáneos al simplificar (⚙ Ajustes)
// todos los trozos de todos los capítulos van a una sola fila, con hasta SIMP_PAR pedidos a la vez; los capítulos se
// atienden en el orden pedido (el que estás leyendo primero) y cada uno se guarda apenas terminan sus trozos
async function simplifyBook(b, lvl, model, only = null){
  const key = `${b.id}|${lvl}`;
  if (SIMP_JOBS.has(key)) return;
  b.versions[lvl] = b.versions[lvl] || { model, done: [], date: Date.now() };
  b.versions[lvl].done = b.versions[lvl].done || [];
  const chs = (only || b.chapters.map((_, i) => i)).filter(i => !b.versions[lvl].done[i]);
  if (!chs.length) return;
  const job = { doneCh: 0, totalCh: chs.length, doneParts: 0, totalParts: 0, failed: 0, err: '' };
  SIMP_JOBS.set(key, job);
  await dbPut('books', b); refreshViews();
  const known = knownWordsHint(b.lang), tasks = [], chapters = new Map();
  for (const ch of chs) {
    const rec = await dbGet('text', `${b.id}|${ch}`); if (!rec) continue;
    const chunks = []; let cur = [], len = 0;
    rec.paras.forEach(t => { if (cur.length && (len + t.length > 2500 || cur.length >= 40)) { chunks.push(cur); cur = []; len = 0; } cur.push(t); len += t.length; });
    if (cur.length) chunks.push(cur);
    chapters.set(ch, { rec, results: new Array(chunks.length), left: chunks.length, failed: false });
    chunks.forEach((chunk, i) => tasks.push({ ch, i, chunk }));
  }
  job.totalParts = tasks.length; refreshViews();
  const chapterDone = async ch => {
    const c = chapters.get(ch);
    await dbPut('simp', { k: `${b.id}|${lvl}|${ch}`, paras: c.results.flat(), heads: c.rec.heads });
    const fresh = await dbGet('books', b.id) || b; fresh.versions[lvl] = fresh.versions[lvl] || { model, done: [] }; fresh.versions[lvl].done[ch] = true; await dbPut('books', fresh);
    if (BOOK?.id === b.id) BOOK.versions = fresh.versions;
    Object.assign(b, { versions: fresh.versions });
    job.doneCh++; refreshViews();
    if (BOOK?.id === b.id && CH?.ver === lvl && CH.ch === ch && CH.missing) await openChapter(lvl, ch, CUR.p, 0);
  };
  let next = 0, stopAll = false;
  const worker = async () => {
    while (next < tasks.length && !stopAll) {
      const t = tasks[next++], c = chapters.get(t.ch);
      if (c.failed) continue;
      try { c.results[t.i] = await simplifyChunk(b, lvl, model, t.chunk, known); }
      catch (e) {
        c.failed = true; job.failed++; job.err = errText(e);
        if (e instanceof NoKey || /clave|permiso|saldo/.test(e.message)) stopAll = true;   // no tiene sentido seguir
        continue;
      }
      job.doneParts++;
      if (--c.left === 0) await chapterDone(t.ch); else if (job.doneParts % 5 === 0) refreshViews();
    }
  };
  await Promise.all(Array.from({ length: Math.min(SIMP_PAR(), tasks.length) }, worker));
  if (job.failed) toast(`${job.failed} capítulo${job.failed > 1 ? 's' : ''} no se pudo simplificar (${job.err}). Puedes reintentar con «Completar».`);
  SIMP_JOBS.delete(key); refreshViews();
}

// junta un diccionario importado con el de aquí: de cada palabra queda la versión con actividad más reciente,
// completada con lo que traiga la otra (definición detallada, formas vistas)
function mergeDict(lang, incoming){
  const mine = lang === DLANG ? DICT : load(dictKey(lang), {});
  const act = x => Math.max(x.srs?.last || 0, x.srs?.lapsedAt || 0, x.last || 0, x.knownAt || 0, x.added || 0);
  let n = 0;
  for (const [l, e] of Object.entries(incoming || {})) {
    const cur = mine[l];
    if (!cur) { mine[l] = e; n++; if (lang === DLANG) touch(l); continue; }
    const [base, other] = act(e) > act(cur) ? [e, cur] : [cur, e];
    const m = { ...other, ...base, forms: { ...(other.forms || {}), ...(base.forms || {}) } };
    if (!base.detailed && other.detailed) for (const f of ['meaning', 'explanation', 'hanja', 'irregular', 'conjugations', 'examples', 'detailed']) m[f] = other[f];
    if (JSON.stringify(m) !== JSON.stringify(cur)) { mine[l] = m; n++; if (lang === DLANG) touch(l); }
  }
  if (lang === DLANG) flushDict(); else save(dictKey(lang), mine);
  return n;
}

    const data = JSON.parse(txt);

/* ---------- Project Gutenberg: buscar con Gutendex y descargar el EPUB ----------
   Si el navegador no deja descargar directo (CORS), se intenta a través de un intermediario público:
   los libros son de dominio público y no se envía ninguna clave. */
// los caminos posibles: tu intermediario (⚙ Ajustes), directo y dos intermediarios públicos gratuitos.
// Se prueban todos a la vez y gana el primero que responde bien.
const PATHS = () => [
  ...(S.proxy ? [['tu intermediario', u => S.proxy.replace(/\/+$/, '') + '/?url=' + encodeURIComponent(u)]] : []),
  ['directo', u => u],
  ['codetabs', u => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u)],
  ['allorigins', u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)]
];
// check: valida lo recibido (un intermediario puede contestar 200 con una página de error)
async function fetchOpen(url, { ms = 45000, check = null } = {}){
  const ctls = [], fails = [];
  const tries = PATHS().map(([name, make]) => (async () => {
    const ctl = new AbortController(); ctls.push(ctl);
    const timer = setTimeout(() => ctl.abort(), ms);
    try {
      const r = await fetch(make(url), { signal: ctl.signal });
      if (!r.ok) throw new Error('error ' + r.status);
      const buf = await r.arrayBuffer();
      if (check) check(buf);
      return buf;
    } catch (e) {
      const why = e.name === 'AbortError' ? 'no respondió' : /fetch|network|load failed/i.test(e.message) ? 'bloqueado' : e.message;
      fails.push(name + ': ' + why); throw e;
    } finally { clearTimeout(timer); }
  })());
  try { const buf = await Promise.any(tries); ctls.forEach(c => c.abort()); return buf; }
  catch (e) { throw new Error(fails.join(' · ')); }
}
const isJSON = buf => JSON.parse(new TextDecoder().decode(buf));
const isZip = buf => { const u = new Uint8Array(buf, 0, 2); if (u[0] !== 0x50 || u[1] !== 0x4b) throw new Error('no llegó un EPUB'); };
const isText = buf => { if (/^\s*<(!doctype|html)/i.test(new TextDecoder().decode(buf.slice(0, 200)))) throw new Error('llegó una página web'); };
const GUT = { q: '', lang: '', results: [], next: null, busy: false, err: '', add: {} };

async function gutSearch(more = false){

    const url = more && GUT.next ? GUT.next : `https://gutendex.com/books/?languages=${GUT.lang}` + (GUT.q ? '&search=' + encodeURIComponent(GUT.q) : '');
    const data = isJSON(await fetchOpen(url, { ms: 60000, check: isJSON }));
    GUT.results.push(...(data.results || [])); GUT.next = data.next || null;
  } catch (e) { GUT.err = e.message; }

}
const gutAuthor = b => (b.authors || []).map(a => a.name.replace(/^([^,]+),\s*(.+)$/, '$2 $1')).join(', ');
// las direcciones que da Gutendex (…/ebooks/1342.epub3.images) redirigen al archivo en /cache/, y los intermediarios
// devuelven el redireccionamiento sin seguirlo (el navegador lo bloquea): se piden primero las direcciones finales
function gutUrls(b){
  const id = b.id, f = b.formats || {}, c = `https://www.gutenberg.org/cache/epub/${id}/pg${id}`;
  const epub = f['application/epub+zip'], txt = Object.entries(f).find(([k]) => k.startsWith('text/plain'))?.[1];
  // primero el texto plano: una sola dirección, sin redireccionamiento; el EPUB queda de respaldo
  return [[c + '.txt', 'txt'], [c + '-images-3.epub', 'epub'], [c + '.epub', 'epub'], ...(txt ? [[txt, 'txt']] : []), ...(epub ? [[epub, 'epub']] : [])];
}
async function gutAdd(b){
  GUT.add[b.id] = 'busy'; GUT.addErr = GUT.addErr || {}; drawGut();
  let parsed = null, err = '';

  for (let i = 0; i < urls.length && !parsed; i++) {
    const [url, kind] = urls[i];
    GUT.addStep = GUT.addStep || {}; GUT.addStep[b.id] = `${kind === 'txt' ? 'texto' : 'EPUB'} (intento ${i + 1} de ${urls.length})`; drawGut();
    try {
      const buf = await fetchOpen(url, { ms: 20000, check: kind === 'epub' ? isZip : isText });

    } catch (e) { err = e.message; console.warn('Gutenberg', url, e.message); }
  }
  if (!parsed) { GUT.add[b.id] = 'err'; GUT.addErr[b.id] = err; drawGut(); return; }
  parsed.title = b.title; parsed.author = gutAuthor(b) || parsed.author;
  const l = (b.languages || [])[0]; if (LANGS[l]) parsed.lang = l;
  const meta = await saveNewBook(parsed);

}

      ${st === 'err' ? `<div class="fix">El navegador no pudo descargarlo (${esc(GUT.addErr?.[b.id] || '')}).
        <p style="margin:6px 0">Bájalo tú y ábrelo aquí (el navegador no deja que la página lo haga sola):</p>
        <div class="row" style="margin-top:4px"><a class="btn sec" style="text-decoration:none" href="https://www.gutenberg.org/cache/epub/${b.id}/pg${b.id}-images-3.epub" target="_blank" rel="noopener">1. ⬇ Descargar</a><button class="btn" data-pick>2. 📂 Ya lo bajé: abrirlo</button></div>
        ${S.proxy ? '' : '<p class="small" style="margin:6px 0 0">Para que se agregue solo, crea tu propio intermediario (⚙ Ajustes → Gutenberg).</p>'}</div>` : ''}</div>
      <div style="display:flex;flex-direction:column;gap:6px">${!st && !S.proxy ? `<a class="btn sec" style="text-decoration:none;text-align:center" href="https://www.gutenberg.org/cache/epub/${b.id}/pg${b.id}-images-3.epub" target="_blank" rel="noopener">⬇ Descargar</a><button class="btn" data-pick>📂 Abrirlo</button><button class="chip" data-add>intentar solo</button>` : st === 'busy' ? `<span class="busy">descargando… ${esc(GUT.addStep?.[b.id] || '')}</span>` : st && st !== 'err' ? '<button class="btn" data-open>Leer</button>' : `<button class="btn" data-add>${st === 'err' ? 'Reintentar' : 'Agregar'}</button>`}</div>`;
    d.querySelector('[data-add]')?.addEventListener('click', () => gutAdd(b));
    d.querySelector('[data-pick]')?.addEventListener('click', () => { PICK_FOR = b; $('file').click(); });

    list.appendChild(d);

  if (GUT.busy) list.insertAdjacentHTML('beforeend', '<p class="busy" style="text-align:center">Buscando…</p>');
  else if (GUT.err) list.insertAdjacentHTML('beforeend', `<div class="fix"><b>No se pudo buscar en Gutenberg.</b><div class="small">${esc(GUT.err)}</div>
    <p style="margin:6px 0">${S.proxy ? 'Revisa que la dirección de tu intermediario (⚙ Ajustes) esté bien.' : 'Los intermediarios gratuitos a veces fallan. Para que funcione siempre, crea tu propio intermediario (gratis, 5 minutos): ⚙ Ajustes → Gutenberg.'}</p>
    <a href="https://www.gutenberg.org/ebooks/search/?query=${encodeURIComponent(GUT.q)}" target="_blank" rel="noopener">Buscar en gutenberg.org</a>: descarga el «EPUB3» y ábrelo con 📂 en la biblioteca.</div>`);
  else if (!GUT.results.length) list.insertAdjacentHTML('beforeend', '<p class="small" style="text-align:center">No se encontraron libros.</p>');
  else if (GUT.next) { list.insertAdjacentHTML('beforeend', '<div class="row" style="justify-content:center"><button class="btn sec" id="gMore">Más resultados</button></div>'); $('gMore').onclick = () => gutSearch(true); }
  const go = () => { GUT.q = $('gQ').value.trim(); gutSearch(); };
  $('gGo').onclick = go;
  $('gQ').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('gLang').onchange = e => { GUT.lang = e.target.value; S.lastGutLang = GUT.lang; saveSet(); gutSearch(); };
}

let PANEL = '', PANEL_BOOK = null;
function openPanel(title, kind){ PANEL = kind; $('ptitle').textContent = title; $('panel').hidden = false; $('pbody').scrollTop = 0; }
function closePanel(){ PANEL = ''; PANEL_BOOK = null; $('panel').hidden = true; if (!BOOK) drawLibrary(); else if (CH?.missing) renderReader(); else { renderHeader(); renderReaderKeep(); } }
$('pclose').onclick = closePanel;
function renderReaderKeep(){ const top = $('view').scrollTop; renderReader(); $('view').scrollTop = top; }

// el libro: nivel estimado, versiones simplificadas
async function openBookPanel(id, fresh = false){
  const b = await dbGet('books', id); if (!b) return;
  PANEL_BOOK = b; openPanel(b.title, 'book'); drawBook(id);
  if (fresh && !b.level && (KEYS[provOf(S.defModel)])) runEstimate(b);
}
let ESTIMATING = null;
async function runEstimate(b){
  ESTIMATING = b.id; drawBook(b.id);
  try { await estimateLevel(b); } catch (e) { toast('No se pudo estimar el nivel: ' + errText(e)); }
  ESTIMATING = null; if (BOOK?.id === b.id) BOOK.level = b.level; drawBook(b.id); if (!BOOK) drawLibrary();
}
async function drawBook(id){
  if (PANEL !== 'book') return;
  const b = await dbGet('books', id); if (!b) return; PANEL_BOOK = b;
  const lang = b.lang, my = myLevel(lang), chars = bookChars(b);
  const words = Math.round(chars / (lang === 'ko' ? 3.3 : CJK(lang) ? 1.6 : 5.7));
  const tgt = S.simpTarget && lvIdx(S.simpTarget) >= 0 ? S.simpTarget : my;
  const cost = m => { const c = simpCost(chars, lang, m); return c === null ? 'sin precio' : '~' + money(c); };
  const vers = Object.entries(b.versions || {}).sort((x, y) => lvIdx(x[0]) - lvIdx(y[0]));
  let h = `<div class="box"><div class="meta small">${esc(b.author || '')} · ${b.chapters.length} capítulos · ~${words.toLocaleString('es')} palabras</div>
    <div class="field"><label>Idioma del libro</label><select id="bLang">${Object.entries(LANGS).map(([k, L]) => `<option value="${k}" ${k === lang ? 'selected' : ''}>${L.native} · ${L.name}</option>`).join('')}</select></div>
    <div class="field"><label>Mi nivel en ${esc(LANGS[lang].name)}</label><select id="bMy">${CEFR.map(c => `<option ${c === my ? 'selected' : ''}>${c}</option>`).join('')}</select>
    <div class="small">Se usa para subrayar las palabras que probablemente no conoces y para simplificar.</div></div>
    <div class="row"><button class="btn" id="bRead">Leer${b.pos?.ver && b.pos.ver !== 'o' ? ' (' + esc(b.pos.ver) + ')' : ''}</button>${vers.length ? `<button class="btn sec" id="bReadO">Leer el original</button>` : ''}</div></div>`;
  h += `<div class="box"><h3>Nivel del libro</h3>`;
  if (ESTIMATING === id) h += `<div class="busy">Estimando el nivel con ${esc(mname(S.defModel))}…</div>`;
  else if (b.level) {
    const x = b.level, diff = lvIdx(x.cefr) - lvIdx(my);
    h += `<div class="gloss"><span class="badge lv" style="font-size:16px">${esc(lvLabel(lang, x.cefr))}</span> ${esc(x.range)}</div><div>${esc(x.summary)}</div>
      <div class="sec-t">Vocabulario</div><div>${esc(x.vocabulary)}</div><div class="sec-t">Gramática</div><div>${esc(x.grammar)}</div>
      ${x.advice ? `<div class="form">💡 ${esc(x.advice)}</div>` : ''}
      <div class="small">${diff > 0 ? `Está ${diff} nivel${diff > 1 ? 'es' : ''} sobre el tuyo (${my}): conviene simplificarlo.` : diff < 0 ? `Está bajo tu nivel (${my}).` : `Está en tu nivel (${my}).`}</div>
      <div class="row"><button class="btn sec" id="bEst">Volver a estimar</button></div>`;
  } else h += `<div class="small">Se toman tres fragmentos del libro y el modelo de explicaciones (${esc(mname(S.defModel))}) estima su nivel MCER${lang === 'ko' ? ' (y TOPIK)' : ''}.</div><div class="row"><button class="btn" id="bEst">Estimar nivel</button></div>`;
  h += `</div><div class="box"><h3>Versión simplificada</h3>`;
  for (const [lvl, v] of vers) {
    const d = (v.done || []).filter(Boolean).length, job = SIMP_JOBS.get(`${id}|${lvl}`);
    h += `<div class="prog"><b>${esc(lvLabel(lang, lvl))}</b> · ${d}/${b.chapters.length} capítulos · ${esc(mname(v.model))}${job ? ` · <span class="busy">simplificando: ${job.doneParts}/${job.totalParts} partes, ${SIMP_PAR()} a la vez…</span>` : ''}
      <div class="bar"><i style="width:${job && job.totalParts ? 100 * job.doneParts / job.totalParts : 100 * d / b.chapters.length}%"></i></div>
      <div class="row" style="margin-top:6px"><button class="btn sec" data-readv="${lvl}">Leer ${esc(lvl)}</button>${d < b.chapters.length && !job ? `<button class="btn sec" data-cont="${lvl}">Completar</button>` : ''}<button class="btn sec" data-del="${lvl}">Borrar</button></div></div>`;
  }
  h += `<p class="small">Reescribe cada párrafo con vocabulario y gramática del nivel elegido, sin cambiar la historia. Los párrafos quedan alineados con el original (en la lectura, ¶ muestra el original). Puedes simplificar todo el libro o ir capítulo por capítulo mientras lees.</p>
    <div class="field"><label>Nivel</label><select id="bTgt">${CEFR.map(c => `<option value="${c}" ${c === tgt ? 'selected' : ''}>${esc(lvLabel(lang, c))}</option>`).join('')}</select></div>
    <div class="field"><label>Modelo</label><select id="bModel">${SIMP_MODELS.map(([m, l]) => `<option value="${m}" ${m === S.simpModel ? 'selected' : ''}>${esc(l)} · todo el libro ${cost(m)}</option>`).join('')}</select></div>
    <div class="row"><button class="btn" id="bSimpAll">Simplificar todo el libro</button><button class="btn sec" id="bSimpRead">Simplificar mientras leo</button></div></div>
    <div class="box"><h3>Llevar a otro aparato</h3><p class="small">Un archivo .leamos con el libro, sus versiones simplificadas, las traducciones y explicaciones ya pagadas, tu posición y tu diccionario de ${esc(LANGS[lang].name)}. En el otro aparato: biblioteca → «📥 Importar .leamos».</p>
      <button class="btn sec" id="bExport">📦 Exportar este libro</button></div>
    <div class="box"><button class="btn sec" id="bDelete">🗑 Borrar el libro</button></div>`;
  $('pbody').innerHTML = h;
  $('bLang').onchange = async e => { b.lang = e.target.value; await dbPut('books', b); await dbDelPrefix('ana', b.id + '|'); await dbDelPrefix('expl', b.id + '|'); if (BOOK?.id === id) { BOOK.lang = b.lang; useDict(b.lang); ANA.clear(); } drawBook(id); };
  $('bMy').onchange = e => { S.myLevel[lang] = e.target.value; saveSet(); drawBook(id); };
  $('bRead').onclick = () => { closePanel(); openBook(id); };
  if ($('bReadO')) $('bReadO').onclick = () => { closePanel(); openBook(id, 'o'); };
  if ($('bEst')) $('bEst').onclick = () => runEstimate(b);
  $('bTgt').onchange = e => { S.simpTarget = e.target.value; saveSet(); };
  $('bModel').onchange = e => { S.simpModel = e.target.value; saveSet(); };
  $('bSimpAll').onclick = () => { if (!KEYS[provOf(S.simpModel)]) { toast('Falta la clave de la API (⚙ Ajustes).'); return; } simplifyBook(b, $('bTgt').value, S.simpModel); };
  $('bSimpRead').onclick = async () => { const lvl = $('bTgt').value; b.versions[lvl] = b.versions[lvl] || { model: S.simpModel, done: [], date: Date.now() }; await dbPut('books', b); closePanel(); await openBook(id, lvl); };
  $('pbody').querySelectorAll('[data-readv]').forEach(x => x.onclick = () => { closePanel(); openBook(id, x.dataset.readv); });
  $('pbody').querySelectorAll('[data-cont]').forEach(x => x.onclick = () => simplifyBook(b, x.dataset.cont, b.versions[x.dataset.cont].model || S.simpModel));
  $('pbody').querySelectorAll('[data-del]').forEach(x => x.onclick = async () => {
    if (!confirm(`¿Borrar la versión ${x.dataset.del}?`)) return;
    delete b.versions[x.dataset.del]; await dbPut('books', b); await dbDelPrefix('simp', `${id}|${x.dataset.del}|`); await dbDelPrefix('ana', `${id}|${x.dataset.del}|`); await dbDelPrefix('expl', `${id}|${x.dataset.del}|`);
    if (BOOK?.id === id) { BOOK.versions = b.versions; if (CH.ver === x.dataset.del) await openChapter('o', CH.ch, CUR.p, 0); }
    drawBook(id);
  });
  $('bExport').onclick = () => exportBooks([id], b.title);
  $('bDelete').onclick = async () => {
    if (!confirm(`¿Borrar «${b.title}»? (tus palabras quedan en el diccionario)`)) return;
    if (BOOK?.id === id) closeBook();
    for (const s of ['text', 'simp', 'ana', 'expl']) await dbDelPrefix(s, id + '|');
    await dbDel('books', id); closePanel();
  };
}

// mis palabras (del idioma del libro abierto, o el que se elija)
let WFILTER = 'todas', WQ = '';
function openWords(){ openPanel('Mis palabras', 'words'); drawWords(); }
function drawWords(){
  const lang = DLANG, all = Object.values(DICT).filter(e => e.lemma && !SKIP_POS.has(e.pos));
  const cls = e => { const s = scoreOf(e); return s < 30 ? 'nuevas' : s < 70 ? 'aprendiendo' : 'sabidas'; };
  const counts = { nuevas: 0, aprendiendo: 0, sabidas: 0 }; all.forEach(e => counts[cls(e)]++);
  let list = all.filter(e => WFILTER === 'todas' || cls(e) === WFILTER);
  if (WQ) { const q = WQ.toLowerCase(); list = list.filter(e => e.lemma.toLowerCase().includes(q) || (e.gloss || '').toLowerCase().includes(q) || Object.keys(e.forms || {}).some(f => f.toLowerCase().includes(q))); }
  list.sort((a, b) => scoreOf(a) - scoreOf(b) || (b.last || b.added || 0) - (a.last || a.added || 0));
  $('pbody').innerHTML = `<div class="field"><label>Idioma</label><select id="wLang">${Object.entries(LANGS).map(([k, L]) => `<option value="${k}" ${k === lang ? 'selected' : ''}>${L.native} · ${L.name}</option>`).join('')}</select>
    ${lang === 'ko' ? '<div class="small">El diccionario de coreano es el mismo de «Hablemos».</div>' : ''}</div>
    <div class="stats"><div><b>${all.length}</b>palabras</div><div><b>${counts.nuevas}</b>nuevas</div><div><b>${counts.aprendiendo}</b>aprendiendo</div><div><b>${counts.sabidas}</b>sabidas</div></div>
    <input class="search" id="wQ" placeholder="Buscar…" value="${esc(WQ)}">
    <div class="filters">${['todas', 'nuevas', 'aprendiendo', 'sabidas'].map(f => `<button class="chip ${f === WFILTER ? 'on' : ''}" data-f="${f}">${f}</button>`).join('')}</div>
    <div id="wList"></div>`;
  const wl = $('wList');
  wl.innerHTML = list.slice(0, 400).map((e, i) => `<div class="ent" data-i="${i}"><div class="top"><span class="lem" lang="${lang}">${esc(e.lemma)}</span><span class="g">${esc(e.gloss || '')}</span><span class="small">${scoreOf(e)} %</span></div><div class="bar"><i style="width:${scoreOf(e)}%"></i></div></div>`).join('') + (list.length > 400 ? `<p class="small">… y ${list.length - 400} más (usa el buscador).</p>` : '') + (!list.length ? '<p class="small">Nada por aquí.</p>' : '');
  wl.querySelectorAll('.ent').forEach(el => el.onclick = () => { const e = list[+el.dataset.i]; SHEET = { kind: 'dict', tok: { t: e.lemma, lemma: e.lemma, pos: e.pos, gloss: e.gloss, form: '' } }; showSheet(); refreshSheet(); });
  $('wLang').onchange = e => { if (BOOK && e.target.value !== BOOK.lang) { toast('Mientras lees se muestran las palabras del idioma del libro.'); e.target.value = DLANG; return; } useDict(e.target.value); drawWords(); };
  $('wQ').oninput = e => { WQ = e.target.value; const pos = e.target.selectionStart; drawWords(); $('wQ').focus(); $('wQ').setSelectionRange(pos, pos); };
  $('pbody').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { WFILTER = b.dataset.f; drawWords(); });
}

  for (const k of Object.keys(LANGS)) on('lv_' + k, 'change', e => { S.myLevel[k] = e.target.value; saveSet(); });
  on('vVoice', 'change', e => { S.voices[lang] = e.target.value; saveSet(); });
  on('rRate', 'input', e => { S.rate = +e.target.value; $('rateV').textContent = S.rate; saveSet(); });
  on('cSay', 'change', e => { S.autoSpeakWord = e.target.checked; saveSet(); });
  on('vTest', 'click', () => { speechSynthesis.cancel(); speechSynthesis.speak(utter(lang === 'ko' ? '안녕하세요. 오늘은 무슨 책을 읽을까요?' : lang === 'en' ? 'Hello! What shall we read today?' : LANGS[lang].native, lang)); });
  on('rFs', 'input', e => { S.fs = +e.target.value; $('fsV').textContent = S.fs; applyLook(); saveSet(); });
  on('sTheme', 'change', e => { S.theme = e.target.value; applyLook(); saveSet(); });
  on('gProxy', 'change', e => { let v = e.target.value.trim(); if (v && !/^https?:\/\//.test(v)) v = 'https://' + v; S.proxy = v; e.target.value = v; saveSet(); });
}

/* ---------- botones y teclado ---------- */
$('pPlay').onclick = () => PLAY ? stop() : play();
$('pNext').onclick = () => { const was = PLAY; stop(); next(true).then(() => { if (was) play(); }); };
$('pPrev').onclick = () => { const was = PLAY; stop(); prev(); if (was) play(); };
const RATES = [0.6, 0.75, 0.9, 1, 1.15];
$('pRate').onclick = () => { const i = RATES.findIndex(r => r >= S.rate - 0.001); S.rate = RATES[(i + 1) % RATES.length]; saveSet(); updateInfo(); if (PLAY) { stop(); play(); } };
$('pTr').onclick = () => { S.showTr = !S.showTr; saveSet(); updateInfo(); showTr(); };
$('pOrig').onclick = () => { SHOW_ORIG = !SHOW_ORIG; updateInfo(); showTr(); };
document.addEventListener('keydown', e => {
  if (!BOOK || PANEL || SHEET || /input|textarea|select/i.test(e.target.tagName)) { if (e.key === 'Escape') { if (SHEET) closeSheet(); else if (PANEL) closePanel(); } return; }
  if (e.key === ' ') { e.preventDefault(); $('pPlay').click(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); $('pNext').click(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); $('pPrev').click(); }
  else if (e.key === 't') $('pTr').click();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { savePosNow(); flushDict(); } else if (PLAY) navigator.wakeLock?.request('screen').then(w => WAKE = w).catch(() => {}); });

drawLibrary();
</script>
