<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leamos · lector</title>
<link rel="stylesheet" href="comun.css">
<style>
header select{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 6px;max-width:34vw;min-width:0;font-size:14px}

#view{flex:1;overflow-y:auto;position:relative}
/* biblioteca */
.lib{max-width:760px;margin:0 auto;padding:14px 14px 40px}
.welcome{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.welcome h2{margin:.1em 0 .4em;font-size:20px}
.welcome p{margin:.4em 0;color:var(--muted)}
.book{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.book .cov{width:46px;height:64px;border-radius:6px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.book .info{flex:1;min-width:0}
.book h3{margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book .meta{font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;border-radius:6px;padding:1px 7px;background:var(--new-soft);color:var(--new);margin-right:4px}
.badge.lv{background:var(--accent-soft);color:var(--accent)}

/* lectura */
#book{max-width:700px;margin:0 auto;padding:18px 18px 45vh}
#book .chtitle{font-size:22px;margin:.2em 0 1em;color:var(--muted);font-weight:600}
.para{font-size:var(--fs);line-height:1.95;margin:0 0 .9em}
h3.para{font-size:calc(var(--fs) * 1.15);line-height:1.6;margin:1.2em 0 .7em}
#book[lang=ko] .para{word-break:keep-all}
.s{border-radius:6px;transition:background .2s;padding:3px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.s.cur{background:var(--cur)}
.w{cursor:pointer;border-radius:4px;touch-action:manipulation;transition:background .15s}
.w:hover{background:var(--accent-soft)}
.w.new{text-decoration:underline 2px var(--new);text-underline-offset:5px}
.w.learn{background:rgba(59,130,246,var(--a,.25));border-radius:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .w.learn{background:rgba(96,165,250,var(--a,.25))}}
:root[data-theme="dark"] .w.learn{background:rgba(96,165,250,var(--a,.25))}
.w.speaking{background:var(--accent-soft)}
.w.peeked{text-decoration-color:var(--accent)}
.w.from{outline:2px dashed var(--accent);outline-offset:2px}
.w.won{animation:won 1.8s ease-out}
#hStars{font-weight:600;white-space:nowrap;cursor:pointer}
/* la estrella del contador: grande, arriba a la derecha del texto, con el número dentro */
#starBadge{position:fixed;right:12px;top:calc(66px + env(safe-area-inset-top));z-index:12;width:64px;height:64px;border:none;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
#starBadge svg{position:absolute;inset:0;width:100%;height:100%}
#starBadge polygon{fill:#ffc928;stroke:#e0a400;stroke-width:3;stroke-linejoin:round}
#starBadge .n{position:absolute;left:0;right:0;top:52%;transform:translateY(-50%);text-align:center;font-weight:800;font-size:17px;color:#5a4300;line-height:1}
#starBadge.neg polygon{fill:#ffd9d2;stroke:#d36a55}
#starBadge.bump{animation:bump2 .6s}
#starBadge.drop{animation:drop .7s}
@keyframes bump2{30%{transform:scale(1.3) rotate(-8deg)}60%{transform:scale(.95) rotate(4deg)}}
.fly{position:fixed;z-index:40;pointer-events:none;font-size:24px;line-height:1;will-change:transform}
.fly.minus{color:#d32f2f;font-weight:800;font-size:22px;text-shadow:0 0 6px #fff,0 0 10px #ffcdd2}
#hStars.bump{animation:bump .6s}
#hStars.drop{animation:drop .7s}
@keyframes drop{20%,60%{transform:translateX(-4px);background:#f6d0c8;color:#9a2b18}40%,80%{transform:translateX(4px)}}
@keyframes bump{30%{transform:scale(1.35);background:#ffe9a0}}
@keyframes won{0%{background:#ffd54a;box-shadow:0 0 0 4px #ffd54a88}60%{background:#ffe9a0}100%{background:transparent;box-shadow:none}}
.chend{text-align:center;margin:30px 0;color:var(--muted)}
.placeholder{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);margin:20px 0}

#selbtn{position:fixed;z-index:31;transform:translate(-50%,-100%)}

#trbox{padding:8px 14px;background:var(--card);border-top:1px solid var(--line);font-size:15px;max-height:30dvh;overflow-y:auto}
#trbox .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#trbox p{margin:2px 0 6px}
#player{display:flex;align-items:center;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
#player .big{width:50px;height:50px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:22px;flex:none}
#player .ib{height:42px;min-width:42px}
#player .grow{flex:1;min-width:0;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ficha de palabra / explicación */
#sheet .phrase{font-size:21px;line-height:1.6}

/* paneles */
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.box h3{margin:0 0 6px;font-size:16px}
.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;min-height:180px;resize:vertical}
.ent{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px;cursor:pointer}
.ent .top{display:flex;align-items:center;gap:8px}
.ent .top .lem{font-size:19px;font-weight:600}
.ent .top .g{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .bar{margin-top:5px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:20px}
.prog{font-size:14px;margin:6px 0}
@media (max-width:520px){header h1 small,.ib .lbl,#player .grow{display:none}}
</style>

<body>
<header id="hdr"></header>
<main id="view"></main>
<button id="starBadge" hidden title="Aprendidas hoy (descontando las que bajaron de 100 %) · toca para ver la lista"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,4 62,37 97,38 69,59 80,94 50,73 20,94 31,59 3,38 38,37"/></svg><span class="n">0</span></button>
<div id="trbox" hidden></div>
<footer id="player" hidden>
  <button class="ib" id="pPrev" title="Oración anterior (←)">⏮</button>
  <button class="big" id="pPlay" title="Leer en voz alta (espacio)">▶</button>
  <button class="ib" id="pNext" title="Siguiente oración (→)">⏭</button>
  <button class="ib" id="pRate" title="Velocidad de la voz">1×</button>
  <button class="ib" id="pTr" title="Traducir la oración marcada (T)">文<span class="lbl">Oración</span></button>
  <button class="ib" id="pOrig" title="Ver el párrafo original" hidden>¶<span class="lbl">Original</span></button>
  <span class="grow" id="pInfo"></span>
</footer>
<button class="btn" id="selbtn" hidden>🎓 Explicar</button>
<input type="file" id="file" accept=".epub,.txt,application/epub+zip,text/plain" hidden>
<input type="file" id="fileImp" hidden>
<div id="veil" hidden></div>
<div id="sheet" hidden></div>
<div id="panel" hidden><div class="ph"><h2 id="ptitle"></h2><button class="ib" id="pclose">✕</button></div><div class="pb" id="pbody"></div></div>

<script src="comun.js"></script>
<script>
'use strict';
/* =====================================================================
   Leamos: lector de libros para aprender idiomas (app hermana de «Hablemos coreano»).
   Lee en voz alta marcando la oración actual, traduce la palabra que tocas, sigue
   cuánto sabes de cada palabra (como Anki) y simplifica el libro a tu nivel.
   Todo vive en el navegador: la clave y el diccionario en localStorage (compartidos con
   «Hablemos» en el mismo sitio), los libros en IndexedDB.
   ===================================================================== */

const APP_VERSION = '2026-11-08 · 40';   // (subir en cada cambio: se ve en la biblioteca y en Ajustes)
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DAY = 864e5;

/* ---------- idiomas y niveles ---------- */
const LANGS = {
  ko: { name: 'coreano', native: '한국어', extra: 'Hanja' },
  en: { name: 'inglés', native: 'English', extra: 'Pronunciación' },
  ja: { name: 'japonés', native: '日本語', extra: 'Lectura' },
  zh: { name: 'chino', native: '中文', extra: 'Pinyin' },
  fr: { name: 'francés', native: 'Français', extra: 'Pronunciación' },
  de: { name: 'alemán', native: 'Deutsch', extra: 'Pronunciación' },
  it: { name: 'italiano', native: 'Italiano', extra: 'Pronunciación' },
  pt: { name: 'portugués', native: 'Português', extra: 'Pronunciación' }
};
const CEFR = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
const lvIdx = c => CEFR.indexOf(c);
const lvLabel = (lang, c) => !c ? '—' : lang === 'ko' ? `${c} · TOPIK ${lvIdx(c) + 1}` : c;
const CJK = l => l === 'ja' || l === 'zh';

/* ---------- ajustes (la clave es la misma de «Hablemos») ---------- */
const HAB = load('hab-set', {});
const DEFAULT_SET = { chatModel: HAB.chatModel || 'claude-haiku-5-5', defModel: HAB.defModel || 'claude-opus-5-5', simpModel: HAB.chatModel || 'claude-haiku-5-5',
  myLevel: { ko: 'A2', en: 'B1' }, rate: 0.9, voices: {}, autoAnalyze: true, autoSpeakWord: true, fs: 20, theme: HAB.theme || '', showTr: false };
const S = Object.assign({}, DEFAULT_SET, load('lec-set', {}));
const saveSet = () => save('lec-set', S);
let USAGE = load('lec-usage', {});
const myLevel = lang => S.myLevel[lang] || 'A2';
function applyLook(){ document.documentElement.style.setProperty('--fs', S.fs + 'px'); if (S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme; }
applyLook();
// si se cambia la clave en «Hablemos» (otra pestaña), se usa la nueva
addEventListener('storage', e => {
  if (e.key === 'hab-keys') Object.assign(KEYS, load('hab-keys', {}));
  if (e.key === dictKey(DLANG)) { const cur = load(e.key, {}); for (const l of DIRTY) if (DICT[l]) cur[l] = DICT[l]; DICT = cur; }
});

/* ---------- diccionario por idioma (el coreano es el mismo de «Hablemos») ---------- */
const dictKey = lang => lang === 'ko' ? 'hab-dict' : 'lec-dict-' + lang;
let DLANG = 'ko', DICT = load(dictKey('ko'), {});
const DIRTY = new Set(); let dictTimer = 0;
function useDict(lang){ if (lang === DLANG) return; flushDict(); DLANG = lang; DICT = load(dictKey(lang), {}); }
function touch(lemma){ DIRTY.add(lemma); clearTimeout(dictTimer); dictTimer = setTimeout(flushDict, 500); }
// se guardan solo las palabras cambiadas, sobre lo que haya guardado la otra app
function flushDict(){
  clearTimeout(dictTimer); if (!DIRTY.size) return;
  const cur = load(dictKey(DLANG), {});
  for (const l of DIRTY) { if (DICT[l]) cur[l] = DICT[l]; else delete cur[l]; }
  DIRTY.clear(); save(dictKey(DLANG), cur);
  for (const [l, e] of Object.entries(cur)) if (!DICT[l]) DICT[l] = e;
}
addEventListener('pagehide', () => { flushDict(); savePosNow(); });
const SKIP_POS = new Set(['puntuación', 'nombre propio', 'número', 'partícula', 'artículo']);
function lemmaOf(tok, lang = LANG()){
  let l = (tok.lemma || '').trim(); if (!l) return '';
  if (lang !== 'ko' && tok.pos !== 'nombre propio') l = l.toLowerCase();
  return l;
}
function ensureEntry(tok, sentence){
  const l = lemmaOf(tok); if (!l) return null;
  let e = DICT[l];
  if (!e) e = DICT[l] = { lemma: l, pos: tok.pos || 'otro', gloss: tok.gloss || '', status: 'nueva', seen: 0, forms: {}, added: Date.now(), source: 'lector', level: null, detailed: false };
  if (!e.gloss && tok.gloss) e.gloss = tok.gloss;
  e.forms = e.forms || {};
  if (tok.t && tok.t.toLowerCase() !== l.toLowerCase() && !e.forms[tok.t]) e.forms[tok.t] = tok.form || '';
  if (!e.sentence && sentence) e.sentence = sentence.trim();
  touch(l);
  return e;
}

/* ---------- cuánto sabes de cada palabra (0–100 %) ----------
   - Palabra nueva (nunca consultada) que pasas sin pedir su traducción: queda sabida, 100 %.
   - Palabra que ya habías consultado alguna vez y pasas sin pedir traducción: sube 10 puntos (como mucho una vez por minuto).
   - Pedir la traducción de una palabra: si es nueva queda en 0; si no, baja 30 puntos.
   - Pedir la traducción o la explicación de una frase: sus palabras no suben ni bajan.
   El puntaje se guarda como un intervalo (en días) para que lo entienda también «Hablemos»: 100 % = 60 días. */
function srsOf(e){
  if (!e.srs) e.srs = { ivl: e.status === 'conocida' ? 21 : 0, ease: 2.5, due: 0, reps: 0, lapses: 0, last: 0, lapsedAt: 0 };
  return e.srs;
}
const scoreOf = e => { if (!e) return 0; const s = e.srs; if (!s) return e.status === 'conocida' ? 75 : 0; return Math.min(100, Math.round(100 * Math.log(1 + s.ivl) / Math.log(61))); };
// nueva = nunca consultada y todavía sin aprender (una que ya llegó a 100 % pasándola no es nueva)
const isNewWord = e => !e || (!e.lookups && !e.srs?.lapses && scoreOf(e) < 30);
function setScore(e, sc){
  const s = srsOf(e), now = Date.now(), before = scoreOf(e);
  sc = Math.max(0, Math.min(100, Math.round(sc)));
  s.ivl = sc <= 0 ? 0 : Math.pow(61, sc / 100) - 1; s.due = now + s.ivl * DAY; s.last = now;
  if (sc >= 50 && e.status !== 'conocida') { e.status = 'conocida'; e.knownAt = now; }
  if (sc < 30 && e.status === 'conocida' && e.lookups) e.status = 'nueva';
  e.last = now; touch(e.lemma);
  if (before < 100 && scoreOf(e) >= 100) celebrate(e);
  else if (before >= 100 && scoreOf(e) < 100) unlearned(e);
}
// la pasaste sin pedir su traducción
function srsGood(e){
  const s = srsOf(e), now = Date.now();
  if (isNewWord(e)) { if (scoreOf(e) >= 100) return false; learnNow(e); return true; }
  if (now - (s.passAt || 0) < 60e3) return false;             // (la misma palabra varias veces seguidas cuenta una vez)
  s.passAt = now; s.reps++; e.heard = (e.heard || 0) + 1; e.seen = (e.seen || 0) + 1;
  setScore(e, scoreOf(e) + 10); return true;
}
// nueva y sin consultar: sabida
function learnNow(e){
  const s = srsOf(e); s.reps++;
  e.heard = Math.max((e.heard || 0) + 1, 5); e.seen = (e.seen || 0) + 1;
  setScore(e, 100);
}
// pediste su traducción
function srsAgain(e){
  const s = srsOf(e), now = Date.now();
  if (s.lapsedAt && now - s.lapsedAt < 10 * 60e3) return;    // mirarla varias veces seguidas cuenta como una vez
  const fresh = isNewWord(e);
  s.lapsedAt = now; e.lookups = (e.lookups || 0) + 1;
  if (fresh) setScore(e, 0); else { s.lapses++; setScore(e, scoreOf(e) - 30); }
}
function setKnown(e, known){
  if (known) { e.heard = Math.max(e.heard || 0, 5); setScore(e, 100); }
  else { setScore(e, 0); e.status = 'nueva'; touch(e.lemma); }
}
/* ---------- 🎉 palabras aprendidas (llegan a 100 %) ---------- */
let WON = [], wonTimer = 0;
// por día, el neto: aprendidas menos desaprendidas
const STATS = () => load('lec-stats', {});
const todayNet = () => STATS()[today()] || 0;
const totalWon = () => Object.values(DICT).filter(x => scoreOf(x) >= 100).length;
function bumpDay(d){ const st = STATS(); st[today()] = (st[today()] || 0) + d; save('lec-stats', st); }
// cómo y dónde se aprendió (lo fija quien acredita: avanzar, voz, silencio o «Ya la sé»)
let CREDIT_CTX = null;
const HOW = { voz: 'leyendo en voz alta', avance: 'al avanzar de oración', silencio: 'leyendo en silencio, al llegar arriba', marcada: 'marcada «Ya la sé»', consulta: 'pediste su traducción', desmarcada: 'marcada como nueva' };
// lo que pasó hoy con cada palabra: [{ w, t, d: +1|-1, how, text, sc }]
function logDay(entry){
  const all = load('lec-log', {}), day = today();
  for (const k of Object.keys(all)) if (k < day && Object.keys(all).length > 14) delete all[k];   // se guardan unos días
  (all[day] ||= []).unshift({ ...entry, t: Date.now() }); all[day] = all[day].slice(0, 400);
  save('lec-log', all);
}
function celebrate(e){
  bumpDay(1); STAR_PENDING++;
  const ctx = CREDIT_CTX || { how: 'marcada', text: '' };
  logDay({ w: e.lemma, d: 1, how: ctx.how, text: ctx.text, lang: LANG() });
  WON.push({ w: e.lemma, ...ctx }); clearTimeout(wonTimer); wonTimer = setTimeout(showWon, 400);
}
// el contador ⭐: las aprendidas hoy, descontando las que se desaprendieron (empieza en 0 cada día)
// (lo que todavía va volando no se cuenta: el contador cambia cuando llega cada ⭐ o −1)
let STAR_PENDING = 0;
const starText = () => '⭐ ' + (todayNet() - STAR_PENDING);
function updateStars(anim){
  const b = $('starBadge'), n = todayNet() - STAR_PENDING;
  b.querySelector('.n').textContent = n; b.querySelector('.n').style.fontSize = String(n).length > 2 ? '14px' : '17px'; b.classList.toggle('neg', n < 0);
  for (const st of [$('hStars'), b]) if (st) {
    if (st.id === 'hStars') st.textContent = starText();
    if (anim) { st.classList.remove('bump', 'drop'); void st.offsetWidth; st.classList.add(anim); }
  }
}
// una palabra que estaba al 100 % bajó (pediste su traducción)
function unlearned(e){
  bumpDay(-1); STAR_PENDING--;
  logDay({ w: e.lemma, d: -1, how: CREDIT_CTX?.how || 'consulta', text: e.sentence || '', sc: scoreOf(e), lang: LANG() });
  // un −1 rojo vuela desde la palabra tocada hasta el contador, que descuenta al llegar
  setTimeout(() => {
    const from = (TIP_EL?.isConnected && TIP_EL) || visibleWord(e.lemma) || (SHEET && $('sheet')) || null;
    flyToCounter(from, '−1', 'minus', () => { STAR_PENDING++; updateStars('drop'); });
    toast(`−1 ⭐ «${e.lemma}» bajó a ${scoreOf(e)} % · hoy ${todayNet()}`);
  }, 0);
}
// el contador al que vuelan las estrellas: abajo en el lector, en la cabecera en la biblioteca
const starTarget = () => (!$('starBadge').hidden && $('starBadge')) || $('hStars');
// una palabra de este lema que esté a la vista
function visibleWord(lemma){
  const v = $('view').getBoundingClientRect();
  for (const w of document.querySelectorAll('#book .w')) {
    const t = TOKS.get(w)?.tok; if (!t || lemmaOf(t) !== lemma) continue;
    const r = w.getBoundingClientRect(); if (r.bottom > v.top && r.top < v.bottom) return w;
  }
  return null;
}
// algo (⭐ o −1) vuela en curva desde un elemento hasta el contador; al llegar, onArrive
function flyToCounter(fromEl, text, cls, onArrive, delay = 0){
  const target = starTarget();
  if (!target || !fromEl) { setTimeout(onArrive, delay); return; }
  setTimeout(() => {
    const a = fromEl.getBoundingClientRect(), b = target.getBoundingClientRect();
    const x0 = a.left + a.width / 2, y0 = a.top + a.height / 2, x1 = b.left + b.width / 2, y1 = b.top + b.height / 2;
    const f = document.createElement('span'); f.className = 'fly ' + cls; f.textContent = text;
    f.style.left = x0 + 'px'; f.style.top = y0 + 'px'; document.body.appendChild(f);
    const dx = x1 - x0, dy = y1 - y0;
    const anim = f.animate([
      { transform: 'translate(-50%,-50%) scale(.6)', opacity: 0 },
      { transform: `translate(calc(-50% + ${dx * 0.15}px), calc(-50% + ${-40}px)) scale(1.5)`, opacity: 1, offset: 0.2 },
      { transform: `translate(calc(-50% + ${dx * 0.6}px), calc(-50% + ${dy * 0.45}px)) scale(1.15)`, opacity: 1, offset: 0.6 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.7)`, opacity: 0.9 }
    ], { duration: 950, easing: 'cubic-bezier(.45,0,.55,1)' });
    anim.onfinish = () => { f.remove(); onArrive(); };
  }, delay);
}
// la señal no puede depender de que la palabra esté a la vista (leyendo en silencio ya salió de la pantalla):
// un aviso baja desde arriba con las palabras como fichas, una lluvia de ✨⭐, y el contador ⭐ de la cabecera salta
function showWon(){
  const items = WON; WON = []; if (!items.length) return;
  const list = [...new Set(items.map(x => x.w))], n = items.length;
  // directo a la estrella: cada palabra destella y su ⭐ vuela al contador (los detalles, en la lista de hoy)
  const set = new Set(list);
  document.querySelectorAll('#book .w').forEach(w => { const t = TOKS.get(w)?.tok; if (t && set.has(lemmaOf(t))) { w.classList.add('won'); setTimeout(() => w.classList.remove('won'), 1800); } });
  const flights = list.slice(0, 10);
  flights.forEach((w, i) => {
    const take = i === flights.length - 1 ? n - (flights.length - 1) : 1;   // la última suma las que no volaron
    setTimeout(() => {

function wordClass(tok){

  const e = DICT[lemmaOf(tok)];
  if (!e) return tok.cefr && lvIdx(tok.cefr) >= lvIdx(myLevel(LANG())) ? 'new' : '';

/* ---------- libros en IndexedDB ----------

   expl: explicaciones guardadas (para no volver a pagarlas) */
let DBP = null;
function db(){
  if (!DBP) DBP = new Promise((ok, ko) => {
    // v2: expl guarda las explicaciones del modelo caro (palabra en su oración y trozos seleccionados)
    const r = indexedDB.open('leamos', 3);   // v3: audio (voz de OpenAI ya generada)
    r.onupgradeneeded = () => {
      const d = r.result, has = n => d.objectStoreNames.contains(n);
      if (!has('books')) d.createObjectStore('books', { keyPath: 'id' });
      for (const s of ['text', 'simp', 'ana', 'expl', 'audio']) if (!has(s)) d.createObjectStore(s, { keyPath: 'k' });
    };
    r.onsuccess = () => {
      const d = r.result;
      // al volver de segundo plano (sobre todo en el celular) el sistema puede cerrar la conexión: se olvida y se reabre
      d.onclose = () => { if (DBP) DBP = null; };
      d.onversionchange = () => { d.close(); DBP = null; };
      ok(d);
    };
    r.onerror = () => { DBP = null; ko(r.error); };
  });
  return DBP;
}
const dbLost = e => /InvalidState|UnknownError|TransactionInactive|connection|closing|closed|lost/i.test((e?.name || '') + ' ' + (e?.message || ''));

async function idb(store, mode, fn){
  for (let a = 0; ; a++) {
    try { const d = await db(); return await req(fn(d.transaction(store, mode).objectStore(store))); }
    catch (e) { if (a >= 2 || !dbLost(e)) throw e; DBP = null; await new Promise(r => setTimeout(r, 200)); }   // conexión perdida: se reabre
  }
}
const dbGet = (s, k) => idb(s, 'readonly', o => o.get(k));
const dbPut = (s, v) => idb(s, 'readwrite', o => o.put(v));

// muchos registros en una sola transacción (importar un libro)
async function dbPutMany(store, list){
  if (!list?.length) return;
  for (let a = 0; ; a++) {
    try {
      const d = await db();
      return await new Promise((ok, ko) => { const tx = d.transaction(store, 'readwrite'), o = tx.objectStore(store); for (const r of list) o.put(r); tx.oncomplete = () => ok(); tx.onerror = () => ko(tx.error); tx.onabort = () => ko(tx.error || new Error('transacción abortada')); });

/* ---------- abrir un EPUB (es un zip: se descomprime con lo que trae el navegador) ---------- */
async function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('no parece un EPUB (no es un zip)');
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const files = {};
  for (let i = 0; i < n && dv.getUint32(p, true) === 0x02014b50; i++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    files[td.decode(u8.subarray(p + 46, p + 46 + nl))] = { method, csize, off };
    p += 46 + nl + el + cl;
  }
  const lower = {}; for (const k of Object.keys(files)) lower[k.toLowerCase()] = k;
  return {
    async text(name){
      const f = files[name] || files[lower[name.toLowerCase()]]; if (!f) throw new Error('falta ' + name + ' en el EPUB');
      const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
      const data = u8.subarray(start, start + f.csize);
      if (f.method === 0) return td.decode(data);
      if (f.method !== 8) throw new Error('compresión no soportada');
      if (!('DecompressionStream' in window)) throw new Error('este navegador no puede descomprimir EPUB (actualízalo)');
      const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
      return td.decode(out);
    }
  };
}
function parseXML(s, type = 'application/xml'){

  return d;
}
function joinPath(base, href){

  for (const x of parts) { if (x === '..') out.pop(); else if (x !== '.' && x !== '') out.push(x); }

}

const BLOCK = new Set(['p','h1','h2','h3','h4','h5','h6','li','blockquote','dd','dt','pre','div','td','th','figcaption','section','article','tr','ul','ol','table','tbody','aside','header','footer','nav','figure','hr','main']);

function blocksOf(doc){
  const body = doc.body || doc.getElementsByTagName('body')[0] || doc.documentElement;
  for (const t of ['rt', 'rp', 'script', 'style']) [...body.getElementsByTagName(t)].forEach(x => x.remove());
  [...body.getElementsByTagName('br')].forEach(x => x.replaceWith('\n'));
  const out = [];
  const push = (text, h) => {
    for (const piece of text.split(/\n\s*\n/)) {
      const t = piece.replace(/\s+/g, ' ').trim();
      if (t && /[\p{L}\p{N}]/u.test(t)) out.push({ t, h });
    }
  };
  const walk = el => {
    let buf = '';
    for (const c of el.childNodes) {
      const isBlock = c.nodeType === 1 && BLOCK.has((c.localName || '').toLowerCase());
      if (isBlock) { if (buf.trim()) push(buf, false); buf = ''; walk(c); }
      else if (c.nodeType === 1 || c.nodeType === 3) buf += c.textContent;
    }
    if (buf.trim()) push(buf, /^h[1-6]$/i.test(el.localName || ''));
  };
  walk(body);

}

    let cur = '';
    for (const s of splitSents(b.t, lang)) { if (cur && (cur + s).length > 700) { out.push({ t: cur.trim(), h: false }); cur = ''; } cur += s; }

}
function guessLang(text){

  if (/\b(der|die|das|und|nicht|ist)\b/i.test(text)) return 'de';

// texto pegado o .txt: párrafos separados por líneas en blanco; capítulos si hay líneas como «Capítulo 3», «Chapter 3» o «제3장»
function parseText(text, title){
  text = text.replace(/^\uFEFF/, '');
  const lines = text.replace(/\r/g, '').split(/\n\s*\n|\n(?=\s*(?:(?:chapter|cap[ií]tulo|part|parte)\s+\S|제\s*\d+\s*[장화부]))/i).map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const lang = guessLang(text.slice(0, 3000));
  const isHead = s => s.length < 80 && (/^(chapter|cap[ií]tulo|part|parte)\s+([\dIVXLC]+|one|two|three|uno|dos|tres)\b/i.test(s) || /^제\s*\d+\s*[장화부]/.test(s) || /^(\d+|[IVXLC]+)\.?$/.test(s));
  const chapters = []; let cur = null;
  for (const t of lines) {
    if (isHead(t) || !cur || cur.blocks.length >= 80) { cur = { title: isHead(t) ? t : chapters.length ? `Parte ${chapters.length + 1}` : 'Inicio', blocks: [] }; chapters.push(cur); if (isHead(t)) { cur.blocks.push({ t, h: true }); continue; } }
    cur.blocks.push({ t, h: false });

  chapters.forEach(c => c.blocks = splitLong(c.blocks, lang));

  const full = chapters.filter(c => c.blocks.some(b => !b.h));

// los libros de Project Gutenberg traen la licencia al principio y al final: se deja solo el texto del libro
function cleanGutenberg(chapters){

  const st = all.findIndex(x => /\*{3}\s*START OF (THE|THIS) PROJECT GUTENBERG/i.test(x.t));
  const en = all.findIndex(x => /\*{3}\s*END OF (THE|THIS) PROJECT GUTENBERG/i.test(x.t));
  if (st < 0 && en < 0) return chapters;
  const keep = new Set(all.filter((x, i) => (st < 0 || i > st) && (en < 0 || i < en)).map(x => x.ci + ':' + x.bi));
  const out = chapters.map((c, ci) => ({ ...c, blocks: c.blocks.filter((b, bi) => keep.has(ci + ':' + bi)) })).filter(c => c.blocks.length);

function splitSents(t, lang){
  const END = '.!?。！？…', CLOSE = '"\'”’»」』)]）', out = []; let start = 0;
  for (let i = 0; i < t.length; i++) {
    if (!END.includes(t[i])) continue;
    let j = i + 1; while (j < t.length && (END.includes(t[j]) || CLOSE.includes(t[j]))) j++;
    if (j < t.length && !/\s/.test(t[j]) && !'。！？'.includes(t[i])) { i = j - 1; continue; }
    if (t[i] === '.' && lang !== 'ko' && /(?:\b(?:Mr|Mrs|Ms|Dr|St|Sr|Jr|Prof|vs|etc|Mme|Mlle|Sra|Srta)|\b\p{Lu})$/u.test(t.slice(start, i))) { i = j - 1; continue; }
    while (j < t.length && /\s/.test(t[j])) j++;
    out.push(t.slice(start, j)); start = j; i = j - 1;
  }
  if (start < t.length) out.push(t.slice(start));
  // lo que no tiene letras se pega a la oración anterior
  const res = [];
  for (const s of out) { if (res.length && !/[\p{L}\p{N}]/u.test(s)) res[res.length - 1] += s; else res.push(s); }
  return res.length ? res : [t];
}

function partialSentences(raw){
  const out = []; let i = 0;
  const str = j => {   // lee un texto JSON que empieza en raw[j] === '"'; devuelve [texto, fin] o null si está incompleto
    let o = '';
    for (let k = j + 1; k < raw.length; k++) {
      const ch = raw[k];
      if (ch === '"') return [o, k + 1];
      if (ch === '\\') { const n = raw[k + 1]; if (n === undefined) return null; if (n === 'u') { const h = raw.substr(k + 2, 4); if (h.length < 4) return null; o += String.fromCharCode(parseInt(h, 16)); k += 5; } else { o += { n: '\n', t: '\t' }[n] ?? n; k++; } continue; }

    }
    return null;

    let j = raw.indexOf('[', i); if (j < 0) break;
    const sent = { t: [] }; j++;

      while (j < raw.length && /[\s,]/.test(raw[j])) j++;

function lemmaRule(lang){
  if (lang === 'ko') return '- lemma: la forma de diccionario. Verbos y adjetivos terminan en -다 (먹었어요 → 먹다, 추워요 → 춥다, 공부했다 → 공부하다). Un sustantivo con partícula o con la cópula: el sustantivo (학교에 → 학교, 학생이었다 → 학생). Expresiones fijas tal cual.';
  if (lang === 'ja') return '- lemma: la forma de diccionario (verbos y adjetivos en forma básica: 食べました → 食べる), escrita como en el diccionario.';
  if (lang === 'zh') return '- lemma: la palabra tal cual (en chino no hay conjugación).';
  return '- lemma: la forma de diccionario: verbos en infinitivo' + (lang === 'en' ? ' (sin "to")' : '') + ', sustantivos en singular, adjetivos en su forma básica (masculino singular), en minúsculas salvo nombres propios. Si la palabra es parte de una expresión o verbo con partícula (p. ej. "give up", "look forward to"), usa la expresión completa como lemma en cada palabra que la forma.';
}

// lo que se permite en cada nivel (lecturas graduadas)
function levelRules(lang, lvl){
  const i = lvIdx(lvl), ko = lang === 'ko';

      'Gramática hasta TOPIK 2: lo de TOPIK 1 más -는/-(으)ㄴ/-(으)ㄹ como modificador simple, -(으)면, -기 때문에, -(으)니까, -는데/-(으)ㄴ데, -(으)ㄴ 후에, -기 전에, -(으)ㄹ 때, -아야/어야 하다, -게 되다, -는 것, -(으)ㄴ 적이 있다, -고 있다.',
      'Gramática hasta TOPIK 3: puedes usar conectores y terminaciones intermedias frecuentes (-도록, -(으)ㄴ/는 것 같다, -다가, -(으)려고, -는 동안, -(으)ㄹ까 봐…) con moderación.',

/* ---------- versiones: «A2» (simplificada, mismo idioma) o «ko:A2» (traducida y adaptada a otro idioma) ---------- */
const verLang = (b, ver) => (ver && ver !== 'o' && (b?.versions?.[ver]?.lang || (ver.includes(':') ? ver.split(':')[0] : ''))) || b?.lang;

const LANG = () => (BOOK && CH ? verLang(BOOK, CH.ver) : BOOK?.lang) || DLANG;

/* ---------- estado de la lectura ---------- */

async function openBook(id, ver){
  hideTip(); stop();
  const b = await dbGet('books', id); if (!b) return;
  BOOK = b; useDict(b.lang);
  b.last = Date.now(); dbPut('books', b);
  await openChapter(ver || b.pos?.ver || 'o', b.pos?.ch || 0, b.pos?.p || 0, b.pos?.s || 0);
}
async function openChapter(ver, ch, p = 0, s = 0){
  if (!BOOK.versions[ver]) ver = 'o';
  ch = Math.max(0, Math.min(BOOK.chapters.length - 1, ch));
  let rec = ver === 'o' ? await dbGet('text', `${BOOK.id}|${ch}`) : await dbGet('simp', `${BOOK.id}|${ver}|${ch}`);
  const missing = !rec;
  if (missing) rec = await dbGet('text', `${BOOK.id}|${ch}`);
  CH = { ver, ch, paras: rec?.paras || [], heads: new Set(rec?.heads || []), missing };
  useDict(verLang(BOOK, ver));
  CH.sents = CH.paras.map(t => splitSents(t, verLang(BOOK, ver)));
  CUR.p = Math.min(p, Math.max(0, CH.paras.length - 1)); CUR.s = Math.min(s, (CH.sents[CUR.p] || ['']).length - 1);
  if (!missing) for (const r of await dbPrefix('ana', `${BOOK.id}|${ver}|${ch}|`)) ANA.set(r.k, r);
  // en una versión simplificada, se simplifican solos este capítulo y el siguiente
  if (ver !== 'o') {
    const v = BOOK.versions[ver], need = [ch, ch + 1].filter(i => i < BOOK.chapters.length && !v.done?.[i]);
    if (need.length && KEYS[provOf(v.model || S.simpModel)]) simplifyBook(BOOK, ver, v.model || S.simpModel, need);
  }
  renderReader();
  setCursor(CUR.p, CUR.s, { scroll: 'instant' });
  prefetchVisible();
}

/* ---------- analizar párrafos (modelo barato), con una cola ---------- */
const INFLIGHT = new Map(), QUEUE = [], PARTIAL = new Map(); let running = 0;
function ensureAna(p, urgent = false){
  if (!CH || CH.missing || p < 0 || p >= CH.paras.length) return Promise.resolve(null);
  const k = anaKey(p);
  if (ANA.has(k)) return Promise.resolve(ANA.get(k));
  const old = INFLIGHT.get(k);
  if (old) { if (urgent && !old.started) { QUEUE.splice(QUEUE.indexOf(old), 1); startJob(old); } return old.promise; }
  let resolve; const promise = new Promise(r => resolve = r);
  const job = { k, p, text: CH.paras[p], sents: CH.sents[p].map(x => x.trim()), prev: CH.paras[p - 1] || '', book: BOOK, lang: LANG(), ver: CH.ver, ch: CH.ch, resolve, promise };
  INFLIGHT.set(k, job); markBusy(p, true);
  // lo que pide el lector (una palabra tocada) parte de inmediato, aunque ya haya 3 en curso
  if (urgent) startJob(job); else { QUEUE.push(job); pump(); }
  return promise;
}
function startJob(job){
  job.started = true; running++;
  analyze(job).then(rec => job.resolve(rec), e => { console.warn('análisis:', e.message); job.resolve(null); if (!netCut(e) && (e instanceof NoKey || /clave|saldo|permiso/.test(e.message))) toast('No se pudo traducir: ' + errText(e)); })
    .finally(() => { running--; INFLIGHT.delete(job.k); PARTIAL.delete(job.k); onAnalyzed(job); pump(); });
}
function pump(){ while (running < 3 && QUEUE.length) startJob(QUEUE.shift()); }
const buildSents = (job, list) => job.sents.map((text, i) => ({ text, es: list[i]?.es, tokens: (list[i]?.t || []).map(parseTok).filter(Boolean) }));
// si la API dice «demasiados pedidos» o «saturado» (pasa al pedir varios a la vez), se reintenta en vez de fallar
// la conexión se cortó (p. ej. la página pasó a segundo plano en el celular)
const netCut = e => /sin conexión|se cortó|tardó demasiado|network|load failed|failed to fetch|aborted|cancel/i.test(e?.message || '');
const waitVisible = () => document.hidden ? new Promise(r => { const f = () => { if (!document.hidden) { document.removeEventListener('visibilitychange', f); r(); } }; document.addEventListener('visibilitychange', f); }) : null;
async function askRetry(...args){
  const tries = args[4]?.retries ?? 3;
  for (let a = 0; ; a++) {
    try { return await ask(...args); }
    catch (e) {
      if (a >= tries || e instanceof NoKey) throw e;
      if (netCut(e)) { await waitVisible(); await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); continue; }   // se reintenta al volver
      if (!/demasiados|saturado|429|529/.test(e.message)) throw e;
      await new Promise(r => setTimeout(r, Math.min(30000, 1500 * (a + 1) ** 2) + Math.random() * 1500));
    }
  }
}
// el párrafo se pide en grupos de 2 o 3 oraciones, todos a la vez: una palabra del final de un párrafo largo
// no espera a que se escriba todo lo anterior
function sentGroups(sents){
  const groups = []; let cur = [], len = 0;
  sents.forEach((x, i) => { if (cur.length && (len + x.length > 280 || cur.length >= 3)) { groups.push(cur); cur = []; len = 0; } cur.push(i); len += x.length; });
  if (cur.length) groups.push(cur);
  return groups;
}
async function analyze(job){
  const stored = await dbGet('ana', job.k);
  if (stored) { ANA.set(job.k, stored); return stored; }
  const lang = job.lang, withEs = !!S.showTr, parts = [];
  let last = 0;
  const update = () => {   // lo que ya llegó de todos los grupos se dibuja (como mucho cada 250 ms)
    if (Date.now() - last < 250) return; last = Date.now();
    PARTIAL.set(job.k, { k: job.k, sents: buildSents(job, parts), partial: true });
    onPartial(job);
  };
  await Promise.all(sentGroups(job.sents).map(async idx => {
    const before = (job.prev.slice(-300) + ' ' + job.sents.slice(0, idx[0]).join(' ')).trim().slice(-500);
    const user = `LIBRO: «${job.book.title}»${job.book.author ? ' de ' + job.book.author : ''}\nNIVEL DEL LECTOR: ${myLevel(lang)}\n` +

/* ---------- leer sin ayuda (en silencio, bajando la página) ----------
   Se mide cuánto tiempo estuvo cada párrafo a la vista. Cada palabra cuenta cuando llega a la primera línea visible
   (justo antes de desaparecer) o ya la pasó, si su párrafo estuvo el tiempo mínimo a la vista: las que no miraste
   suben, igual que al avanzar con ▶ o ⏭.

const VIS = new Map();   // clave del párrafo → segundos a la vista
const needSecs = p => { const t = CH.paras[p] || ''; const words = CJK(LANG()) ? t.length / 2 : t.split(/\s+/).length; return Math.max(1, words * 0.15); };
setInterval(() => {
  if (!BOOK || !CH || CH.missing || PLAY || PANEL || SHEET || document.hidden || S.silentRead === false) return;
  const v = $('view').getBoundingClientRect();
  for (const el of document.querySelectorAll('#book .para')) {
    const r = el.getBoundingClientRect();
    if (r.bottom < v.top + 30) continue;
    if (r.top > v.bottom - 30) break;
    const k = anaKey(+el.dataset.p); VIS.set(k, (VIS.get(k) || 0) + 1);
    markSeen(el, v);
  }
}, 1000);
// desde cuándo está a la vista cada palabra (para que la primera línea cuente solo si la tuviste delante un momento)
const WSEEN = new Map();
function markSeen(el, v){
  const now = Date.now();
  for (const w of el.querySelectorAll('.w')) {
    const r = w.getBoundingClientRect();
    if (r.bottom < v.top || r.top > v.bottom) continue;
    const info = TOKS.get(w); if (!info) continue;
    const key = `${anaKey(info.p)}#${info.si}#${w.dataset.o}`;
    if (!WSEEN.has(key)) WSEEN.set(key, now);

}
// leyendo en silencio, cada palabra cuenta cuando llega a la primera línea visible (justo antes de desaparecer)
// o cuando ya la pasó, siempre que su párrafo haya estado un momento a la vista
const SILENT_DONE = new Set();   // palabras ya contadas en esta lectura: clave#oración#posición
function silentRead(){
  if (!BOOK || !CH || CH.missing || PLAY || S.silentRead === false) return;
  const v = $('view').getBoundingClientRect(); let firstVisible = null;
  const first = document.querySelector('#book .para');
  const lineH = first ? parseFloat(getComputedStyle(first).lineHeight) || S.fs * 1.95 : S.fs * 1.95;
  const top = v.top - lineH * 0.6, zone = v.top + lineH * 0.9;   // la primera línea visible (aunque esté cortada arriba)
  const now = Date.now(); let touched = false;
  for (const el of document.querySelectorAll('#book .para')) {
    const r = el.getBoundingClientRect(), p = +el.dataset.p;
    if (r.bottom < top) continue;
    if (r.top >= zone) { if (firstVisible === null) firstVisible = p; break; }
    if (firstVisible === null && r.bottom >= v.top) firstVisible = p;
    const k = anaKey(p); if (!ANA.get(k)) continue;
    for (const w of el.querySelectorAll('.w')) {
      const wr = w.getBoundingClientRect();
      if (wr.top >= zone) break;            // de aquí en adelante, todavía más abajo
      if (wr.top < top) continue;            // ya pasó de largo sin estar en la primera línea: no cuenta
      const info = TOKS.get(w); if (!info?.tok.lemma) continue;
      const key = `${k}#${info.si}#${w.dataset.o}`;
      if (SILENT_DONE.has(key)) continue;
      const seen = WSEEN.get(key); if (!seen || now - seen < 1000) continue;   // tiene que haber estado a la vista un momento
      SILENT_DONE.add(key);
      if (creditWord(info.p, info.si, info.tok)) touched = true;
    }
  }
  if (touched) rerenderVisible();
  // la marca quedó atrás: pasa al primer párrafo a la vista
  if (firstVisible !== null && CUR.p < firstVisible) setCursor(firstVisible, 0, { scroll: '' });
}
// una palabra que pasaste leyendo en silencio (las mismas reglas que al pasar una oración)
function creditWord(p, si, tok){
  const k = anaKey(p), rec = ANA.get(k), st = rec?.sents?.[si];
  if (!st || rec.seenEs[si]) return false;                  // pediste la traducción de esa frase: no cambia
  const l = lemmaOf(tok); if (!l || SKIP_POS.has(tok.pos) || PEEK.has(`${k}#${si}#${l}`)) return false;
  let e = DICT[l];
  if (!e) { if (!tok.cefr || lvIdx(tok.cefr) < lvIdx(myLevel(LANG()))) return false; e = ensureEntry(tok, st.text); }
  CREDIT_CTX = { how: 'silencio', text: st.text };
  const changed = srsGood(e);

  return changed;
}

function paraEl(p){

const TOKS = new WeakMap();
const WORD_RE = /[\p{L}\p{M}\p{N}]+(?:['’\-][\p{L}\p{M}\p{N}]+)*/gu;
function renderSentence(el, text, ana, p, si){
  const add = (tok, off) => {
    const w = document.createElement('span'); w.className = 'w'; w.textContent = tok.t; w.dataset.o = off;
    const c = tok.lemma ? wordClass(tok) : ''; if (c) w.classList.add(c);
    if (c === 'learn') w.style.setProperty('--a', learnAlpha(tok));
    if (tok.lemma && PEEK.has(`${anaKey(p)}#${si}#${lemmaOf(tok)}`)) w.classList.add('peeked');
    if (FROM && FROM.p === p && FROM.si === si && FROM.off === off) w.classList.add('from');
    TOKS.set(w, { tok, p, si }); el.appendChild(w);

  const plain = (s, base) => {
    let last = 0;
    for (const m of s.matchAll(WORD_RE)) {
      if (m.index > last) el.appendChild(document.createTextNode(s.slice(last, m.index)));
      add({ t: m[0], lemma: '', pos: '', gloss: '', form: '' }, base + m.index); last = m.index + m[0].length;
    }
    if (last < s.length) el.appendChild(document.createTextNode(s.slice(last)));
  };

  const low = text.toLowerCase();
  for (const t of ana?.tokens || []) {
    let i = text.indexOf(t.t, cur); if (i < 0) i = low.indexOf(t.t.toLowerCase(), cur);
    if (i < 0) continue;
    if (i > cur) plain(text.slice(cur, i), cur);

}
function sentEl(p, s){ return document.querySelector(`#book .para[data-p="${p}"] .s[data-s="${s}"]`); }

/* ---------- la oración actual ---------- */
function setCursor(p, s, { scroll = 'smooth' } = {}){

  document.querySelectorAll('#book .w.speaking').forEach(x => x.classList.remove('speaking'));

// pasar a la siguiente oración: la que se deja cuenta como leída (las palabras que no miraste suben)
async function next(credit = true){
  if (!CH || CH.missing) return false;

  if (CUR.s + 1 < CH.sents[CUR.p].length) { setCursor(CUR.p, CUR.s + 1); return true; }
  if (CUR.p + 1 < CH.paras.length) { setCursor(CUR.p + 1, 0); return true; }

function creditSentence(p, s, how = 'avance'){
  const k = anaKey(p), rec = ANA.get(k);
  if (!rec || rec.done[s] || rec.seenEs[s]) return;
  const st = rec.sents[s]; if (!st) return;
  CREDIT_CTX = { how, text: st.text };
  const seen = new Set(); let changed = false;
  for (const tok of st.tokens) {

    if (PEEK.has(`${k}#${s}#${l}`)) continue;

    if (!e) { if (!tok.cefr || lvIdx(tok.cefr) < lvIdx(myLevel(LANG()))) continue; e = ensureEntry(tok, st.text); }

/* ---------- leer en voz alta: la voz del navegador (gratis) o la de OpenAI (natural) ---------- */
const utter = (text, lang, rate = S.rate) => makeUtterance(text, lang, rate, S.voices[lang]);
let CLOUD_OFF = false;   // (la clave de OpenAI falló: en esta sesión se usa la voz del navegador)
const cloudOn = () => !CLOUD_OFF && ((S.ttsProv === 'openai' && !!KEYS.openai) || (S.ttsProv === 'edge' && !!S.proxy));
const edgeVoice = (lang = LANG()) => (S.edgeVoices || {})[lang] || EDGE_VOICES[lang]?.[0]?.[0] || 'en-US-AriaNeural';
const ttsModel = () => S.ttsModel || 'gpt-4o-mini-tts', ttsVoice = () => S.ttsVoice || 'marin';
const AUDIO = new Audio(), WORD_AUDIO = new Audio();
AUDIO.preservesPitch = WORD_AUDIO.preservesPitch = true;
const AUDIO_URLS = new Map(), AUDIO_INFLIGHT = new Map(), AUDIO_WORDS = new Map();
// las palabras que informa Edge ([ms, texto]) → [ms, posición en el texto]
function wordChars(text, words){
  const out = []; let from = 0;
  for (const [ms, w] of words) { const i = w ? text.indexOf(w, from) : -1; if (i >= 0) { out.push([ms, i]); from = i + w.length; } }
  return out;
}
function recordVoice(chars){
  const pr = TTS_PRICE_PER_MCHAR[ttsModel()] || 16;
  const day = USAGE[today()] || (USAGE[today()] = {});
  const k = day.voice || (day.voice = { n: 0, tin: 0, tout: 0, cost: 0, unpriced: 0 });
  k.n++; k.tin += chars; k.cost += chars * pr / 1e6; save('lec-usage', USAGE);
}
// el audio de un texto: de la memoria, de lo guardado o pedido a OpenAI (y se guarda para no volver a pagarlo)
async function cloudAudio(text, lang = LANG()){
  const edge = S.ttsProv === 'edge';
  const key = edge ? `edge|${edgeVoice(lang)}|${textHash(text)}` : `${ttsModel()}|${ttsVoice()}|${textHash(text)}`;
  if (AUDIO_URLS.has(key)) return AUDIO_URLS.get(key);
  if (AUDIO_INFLIGHT.has(key)) return AUDIO_INFLIGHT.get(key);
  const pr = (async () => {
    let rec = await dbGet('audio', key).catch(() => null);
    if (!rec || rec.text !== text) {
      let blob = null, words = null;
      for (let a = 0; a < 3 && !blob; a++) {
        try {
          if (edge) ({ blob, words } = await edgeSpeech(text, edgeVoice(lang), S.proxy));
          else blob = await openaiSpeech(text, { model: ttsModel(), voice: ttsVoice(), instructions: S.ttsInstr ?? TTS_DEFAULT_INSTR });
        }
        catch (e) { if (a === 2 || e instanceof NoKey || !(netCut(e) || /demasiados|saturado|tardó/.test(e.message))) throw e; await waitVisible(); await new Promise(r => setTimeout(r, 1500 * (a + 1))); }
      }
      if (!edge) recordVoice(text.length);
      rec = { k: key, text, blob, words: words ? wordChars(text, words) : null, date: Date.now() };
      dbPut('audio', rec).catch(() => {});
    }
    const url = URL.createObjectURL(rec.blob);
    if (rec.words) AUDIO_WORDS.set(url, rec.words);
    AUDIO_URLS.set(key, url); return url;
  })();
  AUDIO_INFLIGHT.set(key, pr);
  try { return await pr; } finally { AUDIO_INFLIGHT.delete(key); }
}
// decir algo suelto (una palabra tocada, un ejemplo de la ficha)
async function sayText(text, lang = LANG(), rate = S.rate){
  if (!text) return;
  if (cloudOn()) {
    try { const url = await cloudAudio(text, lang); WORD_AUDIO.src = url; WORD_AUDIO.playbackRate = rate; await WORD_AUDIO.play(); return; }
    catch (e) { console.warn('voz OpenAI:', e.message); }
  }
  if ('speechSynthesis' in window) { speechSynthesis.cancel(); speechSynthesis.speak(utter(text, lang, rate)); }
}

let PLAY = false, UTT = null, WAKE = null;

function speakCurrent(){
  if (!PLAY) return;
  if (!CH || CH.missing) { stop(); return; }
  const off = START_OFF; START_OFF = 0;    // empezar a mitad de la oración (desde la palabra tocada)
  const text = sentText(CUR.p, CUR.s).trim().slice(off);
  if (!/[\p{L}\p{N}]/u.test(text)) { advanceAfter(null); return; }
  if (cloudOn()) return speakCloud(text, off);
  const u = utter(text, LANG());
  u._t = Date.now();
  u.onstart = () => { u._s = Date.now(); };
  u.onend = () => advanceAfter(u);
  u.onerror = ev => { if (ev.error === 'interrupted' || ev.error === 'canceled') return; advanceAfter(u); };
  u.onboundary = ev => { if (UTT === u) markSpoken(ev.charIndex + off); };
  if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
  UTT = u; speechSynthesis.speak(u);
}
// con la voz de OpenAI: el audio de la oración (ya guardado o pedido) y, mientras suena, se pide el de la siguiente
async function speakCloud(text, off){
  const u = { cloud: true, _t: Date.now() }; UTT = u;
  let url;
  try { url = await cloudAudio(text); }
  catch (e) {
    if (UTT !== u) return;
    if (e instanceof NoKey || /clave|permiso|saldo|intermediario|actualiza/.test(e.message)) CLOUD_OFF = true;
    toast((S.ttsProv === 'edge' ? 'Voz de Edge: ' : 'Voz de OpenAI: ') + errText(e) + '. Se usa la del navegador' + (CLOUD_OFF ? ' (hasta recargar la página o revisar la clave en ⚙ Ajustes).' : '.'));
    const b = utter(text, LANG()); b.onend = () => advanceAfter(u); b.onerror = () => advanceAfter(u);
    if ('speechSynthesis' in window) speechSynthesis.speak(b); else advanceAfter(u);
    return;
  }
  if (UTT !== u || !PLAY) return;
  const nt = nextSentText(); if (nt) cloudAudio(nt).catch(() => {});
  AUDIO.src = url; AUDIO.playbackRate = S.rate;
  AUDIO.onended = () => advanceAfter(u);
  AUDIO.onerror = () => advanceAfter(u);
  // OpenAI no dice dónde va cada palabra: se aproxima por el avance del audio
  const marks = AUDIO_WORDS.get(url);
  AUDIO.ontimeupdate = () => {
    if (UTT !== u || !AUDIO.duration) return;
    if (marks?.length) { const t = AUDIO.currentTime * 1000; let c = 0; for (const [ms, i] of marks) { if (ms <= t + 60) c = i; else break; } markSpoken(off + c); }
    else markSpoken(off + Math.floor(text.length * AUDIO.currentTime / AUDIO.duration));
  };
  AUDIO.play().catch(e => { if (UTT === u) { toast('No se pudo reproducir el audio: ' + e.message); stop(); } });
}
async function advanceAfter(u){
  if (u && (UTT !== u || u._done)) return;
  if (u) u._done = true;
  if (!PLAY) return;
  const sameP = CUR.s + 1 < (CH.sents[CUR.p] || []).length;
  const ok = await next(true);
  if (!ok) { stop(); toast('Fin del libro 🎉'); return; }
  if (sameP) speakCurrent(); else setTimeout(speakCurrent, 350);   // una pausa breve entre párrafos
}
// algunos navegadores (Android) a veces no avisan cuando terminan de leer (solo la voz del navegador)
setInterval(() => {
  const u = UTT; if (!PLAY || !u || u.cloud || u._done || speechSynthesis.speaking || speechSynthesis.pending) return;
  if (u._s && Date.now() - u._s > 1000) advanceAfter(u);
  else if (!u._s && Date.now() - u._t > 5000) { if (u._retried) advanceAfter(u); else { u._retried = true; u._t = Date.now(); speechSynthesis.cancel(); speechSynthesis.speak(u); } }
}, 1000);
function updatePlay(){ $('pPlay').textContent = PLAY ? '⏸' : '▶'; }

/* ---------- traducción y párrafo original de la oración actual ---------- */
let SHOW_ORIG = false;
// la oración cuya traducción se pidió con 文 (se oculta al pasar a otra oración, salvo «siempre» en Ajustes)
let TR_ONCE = null;
async function showTr(){
  const box = $('trbox');
  const once = TR_ONCE && TR_ONCE.p === CUR.p && TR_ONCE.s === CUR.s && TR_ONCE.ch === CH?.ch;
  if (!CH || CH.missing || (!S.showTr && !once && !SHOW_ORIG)) { box.hidden = true; updateInfo(); return; }
  let h = '';
  if (S.showTr || once) {
    const rec = ANA.get(anaKey(CUR.p));
    if (rec) { rec.seenEs[CUR.s] = true; dbPut('ana', rec); }   // pediste la traducción: esa oración no suma
    const es = trGet(CUR.p, CUR.s);
    h += `<div class="lab">Traducción de la oración</div><p>${es !== undefined ? esc(es || '—') : '<span class="busy">traduciendo…</span>'}</p>
      <div class="row" style="margin:2px 0 6px"><button class="chip" id="trExplain">🎓 Explicar esta oración en detalle</button></div>`;
    if (es === undefined) ensureTr(CUR.p, CUR.s);
  }
  if (SHOW_ORIG && CH.ver !== 'o') {
    const o = await dbGet('text', `${BOOK.id}|${CH.ch}`);
    h += `<div class="lab">Párrafo original</div><p lang="${BOOK.lang}">${esc(o?.paras?.[CUR.p] || '—')}</p>`;
  }
  box.innerHTML = h; box.hidden = !h; updateInfo();
  // la explicación detallada de la oración (la misma que al seleccionar un trozo; queda guardada)
  const ex = $('trExplain');
  if (ex) ex.onclick = () => { const p = CUR.p, si = CUR.s; explainPhrase({ text: sentText(p, si).trim(), p, si, p2: p, si2: si }); };
}

/* ---------- tocar una palabra: significado; dos veces: explicación detallada ---------- */
let TAP = { el: null, t: 0 }, TIP_EL = null, TIP_WAIT = null, LAST_DBL = 0;
document.addEventListener('click', ev => {
  const w = ev.target.closest?.('#book .w');
  if (!w) { if (!ev.target.closest?.('#selbtn')) hideTip(); return; }
  const sel = getSelection(); if (sel && !sel.isCollapsed && sel.toString().trim().length > 1 && Date.now() - TAP.t > 600) return;
  ev.stopPropagation();
  const now = Date.now(), info = TOKS.get(w); if (!info) return;
  TAP = { el: w, t: now };
  const key = `${info.p}#${info.si}#${w.dataset.o}`;
  // 1.er toque: solo marca la oración (y la palabra como punto de partida de ▶); no traduce ni cuenta como consulta
  if (!PLAY && (CUR.p !== info.p || CUR.s !== info.si)) {
    hideTip(); setCursor(info.p, info.si, { scroll: '' }); setFrom(info.p, info.si, +w.dataset.o); return;
  }
  // 3.er toque (la misma palabra con su traducción a la vista): la ficha con la explicación detallada
  if (TIP_KEY === key && !$('tip')?.hidden) { LAST_DBL = now; getSelection()?.removeAllRanges(); hideTip(); openWord(w); return; }
  // 2.º toque: la traducción de la palabra
  showTip(w);
});
let TIP_KEY = null;   // la palabra cuya traducción está a la vista
function peek(info){
  const { tok, p, si } = info; const l = lemmaOf(tok); if (!l) return;
  const key = `${anaKey(p)}#${si}#${l}`;
  if (!PEEK.has(key)) { PEEK.add(key); const e = ensureEntry(tok, sentText(p, si)); if (e) srsAgain(e); }
}
function findWord(p, si, off){ return document.querySelector(`#book .para[data-p="${p}"] .s[data-s="${si}"] .w[data-o="${off}"]`); }
function showTip(w){
  const info = TOKS.get(w); if (!info) return;
  const { tok, p, si } = info;
  let tip = $('tip'); if (!tip) { tip = document.createElement('div'); tip.id = 'tip'; document.body.appendChild(tip); }
  TIP_EL = w;
  // (sin estar leyendo) la oración de la palabra pasa a ser la marcada; ▶ parte desde la palabra
  TIP_KEY = `${p}#${si}#${w.dataset.o}`;
  if (!PLAY) setFrom(p, si, +w.dataset.o);
  TIP_WAIT = null;
  if (!tok.lemma) {
    if (ANA.has(anaKey(p))) tip.innerHTML = 'sin traducción';
    else {
      // se muestra apenas llegue esa palabra (onPartial / onAnalyzed), aunque el resto del párrafo siga llegando
      tip.innerHTML = `<span class="busy" style="color:inherit">traduciendo…</span>`;
      TIP_WAIT = { p, si, off: w.dataset.o };
      ensureAna(p, true);
    }
  } else {
    peek(info);
    w.classList.add('peeked');
    const l = lemmaOf(tok), e = DICT[l];
    const romo = LANG() === 'ko' ? `<small>${esc(romanize(tok.t))}</small>` : '';
    tip.innerHTML = `<b>${esc(tok.gloss || e?.gloss || '—')}</b>${l && l !== tok.t.toLowerCase() && l !== tok.t ? ` · <span lang="${LANG()}">${esc(l)}</span>` : ''}${tok.form ? `<small>${esc(tok.form)}</small>` : ''}${romo}<small>toca otra vez para la explicación${PLAY ? '' : ' · ▶ lee desde aquí'}</small>`;
    if (S.autoSpeakWord) speakWord(tok.t);
  }
  placeTip(tip, w);
}
function hideTip(){ TIP_EL = null; TIP_WAIT = null; TIP_KEY = null; const t = $('tip'); if (t) t.hidden = true; }
let silentTick = 0;
$('view').addEventListener('scroll', () => {
  hideTip(); hideSelBtn(); prefetchVisible();
  if (!silentTick) silentTick = setTimeout(() => { silentTick = 0; silentRead(); }, 150);
}, { passive: true });

/* ---------- ficha de la palabra ---------- */
let SHEET = null;
function prevSentences(p, s, n = 3){
  const out = [];
  for (let pp = p, ss = s - 1; out.length < n && pp >= 0;) {
    if (ss < 0) { pp--; if (pp < 0) break; ss = CH.sents[pp].length - 1; continue; }
    out.unshift(CH.sents[pp][ss].trim()); ss--;
  }
  return out.join(' ');
}
async function openWord(w){
  const info = TOKS.get(w); if (!info) return;
  let { tok, p, si } = info;
  peek(info);
  SHEET = { kind: 'word', tok, p, si, off: w.dataset.o, busy: false, err: '', ctx: '' };
  showSheet(); refreshSheet();
  if (!tok.lemma) {   // primero el análisis del párrafo (rápido), después la explicación
    SHEET.busy = 'ana'; refreshSheet();
    const rec = await ensureAna(p, true); if (SHEET?.off !== w.dataset.o) return;
    const nw = findWord(p, si, SHEET.off), t2 = nw && TOKS.get(nw)?.tok;
    if (t2?.lemma) { SHEET.tok = tok = t2; peek({ tok: t2, p, si }); }
    SHEET.busy = false;
    if (!rec) { SHEET.err = 'No se pudo analizar el párrafo.'; refreshSheet(); return; }
  }
  if (S.autoSpeakWord) speakWord(tok.t);
  const sh = SHEET, saved = await dbGet('expl', wordKey(sh)).catch(() => null);
  if (SHEET !== sh) return;
  if (saved) { sh.ctx = saved.ctx; sh.points = saved.points; sh.saved = saved.date; }
  const e = DICT[lemmaOf(tok)];
  // la explicación detallada: se pide sola si la palabra no la tiene (ni hay una guardada para esta oración)
  if (!e?.detailed && !saved) explainWord(); else refreshSheet();
}
const wordKey = sh => `${anaKey(sh.p)}|w|${sh.si}|${sh.off}`;
async function explainWord(){
  const sh = SHEET; if (!sh) return;
  sh.busy = 'def'; sh.err = ''; refreshSheet();
  try {
    const lang = LANG(), sent = sentText(sh.p, sh.si).trim();
    const user = `LIBRO: «${BOOK.title}»\nNIVEL DEL LECTOR: ${myLevel(lang)}\n` + (prevSentences(sh.p, sh.si) ? `ORACIONES ANTERIORES: ${prevSentences(sh.p, sh.si)}\n` : '') +
      gramKnown(lang) + `ORACIÓN: «${sent}»\nPALABRA: «${sh.tok.t}»` + (sh.tok.lemma ? ` (forma de diccionario probable: ${sh.tok.lemma})` : '');
    const x = await askRetry(S.defModel, defSystem(lang), user, ENTRY, { effort: 'low', maxTokens: 12000, ms: 150000, kind: 'explain' });
    const l = lemmaOf({ lemma: x.lemma || sh.tok.lemma, pos: x.pos }) || lemmaOf(sh.tok);
    const e = DICT[l] || ensureEntry({ ...sh.tok, lemma: l, pos: x.pos, gloss: x.gloss }, sent);
    Object.assign(e, { pos: x.pos || e.pos, gloss: e.gloss || x.gloss, meaning: x.meaning, explanation: x.explanation, hanja: x.hanja, irregular: x.irregular,
      conjugations: x.conjugations || [], examples: (x.examples || []).map(ex => ({ ko: ex.text, es: ex.es })), detailed: true });
    touch(l);
    const pts = registerPoints(x.points, { key: wordKey(sh), kind: 'word', word: sh.tok.t, lemma: l, text: sent, ctx: x.in_context || '', ...refPlace(sh.p, sh.si) }, lang);
    if (x.in_context) dbPut('expl', { k: wordKey(sh), ctx: x.in_context, lemma: l, points: pts, date: Date.now() });
    if (SHEET === sh) { sh.ctx = x.in_context || ''; sh.points = pts; sh.saved = 0; if (l !== lemmaOf(sh.tok)) sh.tok = { ...sh.tok, lemma: l, pos: x.pos || sh.tok.pos }; }
  } catch (err) { if (SHEET === sh) sh.err = 'No se pudo explicar: ' + errText(err); }
  if (SHEET === sh) { sh.busy = false; refreshSheet(); }
}
function showSheet(){ $('veil').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0; }
function closeSheet(){ SHEET = null; $('veil').hidden = true; $('sheet').hidden = true; if (CH && !CH.missing) document.querySelectorAll('#book .para').forEach(el => { const p = +el.dataset.p; if (Math.abs(p - CUR.p) < 40) rerenderPara(p); }); }
$('veil').onclick = closeSheet;
function srsHTML(e){
  if (!e) return '';
  const sc = scoreOf(e), s = e.srs;
  const due = s?.due ? (s.due <= Date.now() ? 'le toca repaso: la próxima vez que la leas sin mirarla, sube' : 'próximo repaso ' + new Date(s.due).toLocaleDateString('es', { day: 'numeric', month: 'short' })) : '';
  return `<div class="small" style="margin-top:8px">Dominio: <b>${sc} %</b>${e.status === 'conocida' ? ' · ya la sabes' : ''}${s ? ` · leída sin mirar ${s.reps} ${s.reps === 1 ? 'vez' : 'veces'}, consultada ${e.lookups || 0}` : ''}${due ? ' · ' + due : ''}</div><div class="bar"><i style="width:${sc}%"></i></div>`;
}
function refreshSheet(){
  if (!SHEET) return;
  const sh = $('sheet'), lang = LANG();
  let h = '';

    if (lang === 'ko') h += `<div class="rom">${esc(romanize(tok.t))}</div>`;
    if (l && l !== tok.t && l !== tok.t.toLowerCase()) h += `<div style="margin-top:6px">Forma de diccionario: <b lang="${lang}" style="font-size:20px">${esc(l)}</b> <button class="spk" data-say="${esc(l)}">🔊</button></div>`;
    const pos = tok.pos || e?.pos, gloss = tok.gloss || e?.gloss;
    if (pos || gloss) h += `<div class="gloss">${pos ? `<span class="pos">${esc(pos)}</span>` : ''}${esc(gloss || '')}${tok.cefr && tok.cefr !== '-' ? ` <span class="badge lv">${esc(tok.cefr)}</span>` : ''}</div>`;
    if (tok.form) h += `<div class="form">${esc(tok.form)}</div>`;
    h += srsHTML(e);
    SHEET._chips = SHEET.points?.length ? gramSection(SHEET.points.map(p => { const e = loadGram(lang)[p.id || gramId(p.pattern)]; return { pattern: p.pattern, point: p.pattern, title: p.title, desc: e?.desc || '' }; }), lang) : '';
    if (SHEET.ctx) h += `<div class="sec-t">En esta oración${SHEET.saved ? ' <span style="text-transform:none;letter-spacing:0">· guardada</span>' : ''}</div><div class="form">${esc(SHEET.ctx)}</div>`;
    if (e) h += entryHTML(e, { lang, extra: LANGS[lang]?.extra || 'Nota', sentence: true, maxForms: 12 });
    if (SHEET._chips) h += SHEET._chips;
    if (SHEET.busy === 'ana') h += `<div class="busy" style="margin-top:8px">Analizando el párrafo…</div>`;
    if (SHEET.busy === 'def') h += `<div class="busy" style="margin-top:8px">El profesor (${esc(mname(S.defModel))}) está explicando…</div>`;
    if (SHEET.err) h += `<div class="fix">${esc(SHEET.err)}</div>`;
    h += `<div class="row">`;
    if (SHEET.kind === 'word') h += `<button class="btn" id="sExplain" ${SHEET.busy ? 'disabled' : ''}>${SHEET.ctx ? 'Explicar de nuevo' : 'Explicar en esta oración'}</button>`;
    if (e) h += `<button class="btn sec" id="sKnown">${scoreOf(e) >= 70 ? 'Marcar como nueva' : 'Ya la sé ✓'}</button>`;
    if (SHEET.kind === 'word') h += `<button class="btn sec" id="sFrom">▶ Leer desde aquí</button>`;
    if (SHEET.ref) h += `<button class="btn sec" id="sGoRef">📖 Ir a la oración</button>`;
    h += `<button class="btn sec" id="sClose">Cerrar</button></div>`;
  } else if (SHEET.kind === 'gutpick') {
    const b = SHEET.b;
    h += `<div class="gloss"><b>Descargando «${esc(b.title)}»…</b></div>
      <p>Cuando termine de bajar, toca <b>Abrir</b> y elige el archivo (suele aparecer primero, en «Recientes» o «Descargas»). Se agrega con el título, el autor y el idioma de Gutenberg.</p>
      <div class="row"><button class="btn" id="sPick">📂 Abrir el libro descargado</button><button class="btn sec" id="sClose">Cancelar</button></div>
      <p class="small" style="margin-top:10px">¿No empezó la descarga? <a href="${gutEpub(b)}" target="_blank" rel="noopener">Descárgalo de nuevo</a> o búscalo en <a href="https://www.gutenberg.org/ebooks/${b.id}" target="_blank" rel="noopener">gutenberg.org</a>.</p>`;
  } else if (SHEET.kind === 'phrase') {
    const x = SHEET.x || {}, words = x.words?.length ? x.words : phraseWords(SHEET);
    h += `<div class="phrase" lang="${lang}">${esc(SHEET.text)} <button class="spk" data-say="${esc(SHEET.text)}">🔊</button></div>`;
    if (SHEET.err) h += `<div class="fix">${esc(SHEET.err)}</div>`;
    h += x.translation ? `<div class="gloss"><b>${esc(x.translation)}</b></div>${x.literal ? `<div class="small">Literal: ${esc(x.literal)}</div>` : ''}` : SHEET.busyTr ? '<div class="busy" style="margin-top:8px">Traduciendo…</div>' : '';
    if (x.explanation || SHEET.busyEx) h += `<div class="sec-t">Explicación</div>${paras(x.explanation || '')}${SHEET.busyEx ? `<div class="busy">El profesor (${esc(mname(S.defModel))}) está explicando…</div>` : ''}`;
    // (explicaciones guardadas de la versión anterior: los puntos venían aparte en x.points)
    h += gramSection((x.grammar || []).map((g, i) => g.pattern ? g : { ...g, ...(x.points?.[i] || {}), point: g.point, explanation: g.explanation }), lang);
    if (x.tip) h += `<div class="form">💡 ${esc(x.tip)}</div>`;
    if (words.length) h += `<details style="margin-top:8px"><summary class="sec-t" style="cursor:pointer;display:list-item">Palabra por palabra</summary><div class="conj">${words.map(w => `<span lang="${lang}" data-say="${esc(w.t)}" style="cursor:pointer">${esc(w.t)}</span><span><b>${esc(w.gloss)}</b>${w.lemma && w.lemma.toLowerCase() !== w.t.toLowerCase() ? ` <span lang="${lang}">(${esc(w.lemma)})</span>` : ''}${w.form || w.explanation ? ' · ' + esc(w.form || w.explanation) : ''}</span>`).join('')}</div></details>`;
    if (SHEET.saved) h += `<div class="small" style="margin-top:8px">Explicación guardada (no se volvió a pedir).</div>`;
    h += `<div class="row">${!SHEET.busyTr && !SHEET.busyEx && SHEET.args ? '<button class="btn sec" id="sAgain">Explicar de nuevo</button>' : ''}${SHEET.ref ? '<button class="btn sec" id="sGoRef">📖 Ir a la oración</button>' : ''}<button class="btn sec" id="sClose">Cerrar</button></div>`;
  }
  sh.innerHTML = h;
  sh.querySelectorAll('[data-say]').forEach(b => b.onclick = () => sayText(b.dataset.say, lang, Math.min(S.rate, 0.9)));
  $('sClose').onclick = closeSheet;
  if ($('sExplain')) $('sExplain').onclick = explainWord;
  sh.querySelectorAll('[data-gram]').forEach(b => b.onclick = ev => { ev.preventDefault(); const id = b.dataset.gram, l = lang; closeSheet(); openGram(l, id); });
  if ($('sGoRef')) $('sGoRef').onclick = () => { const r = SHEET.ref; closeSheet(); goToRef(r); };
  if ($('sPick')) $('sPick').onclick = () => { PICK_FOR = SHEET.b; closeSheet(); $('file').click(); };
  if ($('sAgain')) $('sAgain').onclick = () => explainPhrase(SHEET.args, true);
  if ($('sKnown')) $('sKnown').onclick = () => { const e = DICT[lemmaOf(SHEET.tok, lang)]; setKnown(e, scoreOf(e) < 70); refreshSheet(); if (PANEL === 'words') drawWords(); };
  if ($('sFrom')) $('sFrom').onclick = () => { const { p, si, off } = SHEET; closeSheet(); stop(); setFrom(p, si, +off); play(); };
}

/* ---------- sección de gramática ----------
   Se va armando sola: cada explicación de una palabra o un trozo nombra sus puntos gramaticales; si un punto no
   existe, se crea solo con su nombre y una descripción (sin contenido). Cada punto guarda dónde apareció (las
   explicaciones), y su explicación completa se pide solo si el lector la quiere. Por idioma, en localStorage. */
const gramKey = lang => 'lec-gram-' + lang;
const loadGram = lang => load(gramKey(lang), {});
const gramId = p => String(p || '').toLowerCase().replace(/\s+/g, '').replace(/[‐-―]/g, '-').trim();
function saveGramEntry(lang, e){ const g = loadGram(lang); g[e.id] = e; save(gramKey(lang), g); }
// lo que se manda al modelo para que reutilice los nombres
const gramKnown = lang => { const g = Object.values(loadGram(lang)); return g.length ? `SECCIONES DE GRAMÁTICA YA CREADAS: ${g.slice(-150).map(e => e.pattern).join(' · ')}\n` : ''; };
function registerPoints(points, ref, lang = LANG()){
  const out = [];
  for (const p of points || []) {
    const id = gramId(p.pattern); if (!id) continue;
    const g = loadGram(lang);
    const e = g[id] || { id, pattern: p.pattern.trim(), title: p.title || '', desc: p.desc || '', level: p.level || '', added: Date.now(), refs: [] };
    if (!e.desc && p.desc) e.desc = p.desc;
    if (!e.title && p.title) e.title = p.title;
    if (ref && !e.refs.some(r => r.key === ref.key)) e.refs.unshift({ ...ref, date: Date.now() });
    e.refs = e.refs.slice(0, 60); e.last = Date.now();
    saveGramEntry(lang, e); out.push({ id, pattern: e.pattern, title: e.title });
  }
  return out;
}
// dónde está la oración (para volver a ella desde la gramática)
const refPlace = (p, s) => ({ bookId: BOOK.id, bookTitle: BOOK.title, ver: CH.ver, ch: CH.ch, p, s });
// la sección «Gramática» de una explicación: cada punto es un enlace a su entrada en 📐
function gramSection(items, lang){
  if (!items?.length) return '';
  return `<div class="sec-t">Gramática</div>` + items.map(g => {
    const id = g.pattern ? gramId(g.pattern) : '', head = g.point || g.pattern;
    const sub = g.pattern && g.pattern !== head ? `${g.pattern}${g.title ? ' · ' + g.title : ''}` : (g.title || '');
    return `<div class="gram">${id ? `<a href="#" data-gram="${esc(id)}" style="color:inherit"><b lang="${lang}">📐 ${esc(head)}</b></a>` : `<b lang="${lang}">${esc(head)}</b>`}${sub ? ` <span class="small">${esc(sub)}</span>` : ''}<div>${esc(g.explanation || g.desc || '')}</div></div>`;
  }).join('');
