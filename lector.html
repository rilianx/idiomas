async function explainPhrase(sel, again = false){
  const { text, p, si, p2, si2 } = sel;
  hideTip();
  // las oraciones seleccionadas no suben al pasar (pediste ayuda con ellas)
  const [a, b] = p < p2 || (p === p2 && si <= si2) ? [[p, si], [p2, si2]] : [[p2, si2], [p, si]];
  const whole = [], range = [];
  for (let pp = a[0]; pp <= b[0]; pp++) for (let ss = pp === a[0] ? a[1] : 0; ss <= (pp === b[0] ? b[1] : CH.sents[pp].length - 1); ss++) {
    whole.push(sentText(pp, ss).trim()); range.push([pp, ss]);
    const rec = ANA.get(anaKey(pp)); if (rec) { rec.seenEs[ss] = true; dbPut('ana', rec); }
  }
  SHEET = { kind: 'phrase', text, err: '', x: {}, key: `${anaKey(a[0])}|f|${a[1]}|${text}`, args: sel, range, busyTr: false, busyEx: false };
  showSheet(); refreshSheet();
  const sh = SHEET, saved = !again && await dbGet('expl', sh.key).catch(() => null);
  // el palabra por palabra sale del análisis de los párrafos (si falta, se pide; es el modelo barato)
  for (const pp of new Set(range.map(r => r[0]))) if (!ANA.has(anaKey(pp))) ensureAna(pp, true).then(() => { if (SHEET === sh) refreshSheet(); });
  if (saved) { sh.x = saved.x; sh.saved = saved.date; refreshSheet(); return; }
  sh.busyTr = sh.busyEx = true; refreshSheet();
  const lang = LANG();
  const user = `LIBRO: «${BOOK.title}»\nNIVEL DEL LECTOR: ${myLevel(lang)}\n` + (prevSentences(a[0], a[1]) ? `ORACIONES ANTERIORES: ${prevSentences(a[0], a[1])}\n` : '') + gramKnown(lang) + `ORACIÓN COMPLETA: «${whole.join(' ')}»\nTROZO SELECCIONADO: «${text}»`;
  let last = 0;
  const redraw = (force) => { if (SHEET !== sh) return; if (!force && Date.now() - last < 200) return; last = Date.now(); refreshSheet(); };
  const errs = [];
  await Promise.all([
    // la traducción: rápida, con el modelo barato
    askRetry(S.chatModel, phraseTrSystem(lang), user, PHRASE_TR_SCHEMA, { effort: 'low', maxTokens: 3000, ms: 60000, kind: 'read', fast: true,
      onText: raw => { sh.x.translation = partialString(raw, 'translation'); sh.x.literal = partialString(raw, 'literal'); redraw(); } })
      .then(o => Object.assign(sh.x, o), e => errs.push('traducción: ' + errText(e))).finally(() => { sh.busyTr = false; redraw(true); }),
    // la explicación: el modelo caro, y se va mostrando mientras la escribe
    askRetry(S.defModel, phraseExSystem(lang), user, PHRASE_EX_SCHEMA, { effort: 'low', maxTokens: 12000, ms: 150000, kind: 'explain',
      onText: raw => { sh.x.explanation = partialString(raw, 'explanation'); redraw(); } })
      .then(o => Object.assign(sh.x, o), e => errs.push('explicación: ' + errText(e))).finally(() => { sh.busyEx = false; redraw(true); })
  ]);
  if (!errs.some(e => e.startsWith('explicación'))) registerPoints((sh.x.grammar || []).filter(g => g.pattern), { key: sh.key, kind: 'phrase', text, es: sh.x.translation || '', ...refPlace(a[0], a[1]) }, lang);
  if (errs.length) sh.err = 'No se pudo: ' + errs.join(' · ');
  else dbPut('expl', { k: sh.key, x: { translation: sh.x.translation, literal: sh.x.literal, explanation: sh.x.explanation, grammar: sh.x.grammar || [], tip: sh.x.tip || '' }, date: Date.now() });
  redraw(true);
}
// las palabras del trozo, con lo que ya dice el análisis de cada párrafo
function phraseWords(sh){
  const sel = sh.text.toLowerCase(), out = []; let from = 0;
  for (const [pp, ss] of sh.range) {
    const st = ANA.get(anaKey(pp))?.sents?.[ss]; if (!st) continue;
    for (const t of st.tokens) { const i = sel.indexOf(t.t.toLowerCase(), from); if (i >= 0) { out.push(t); from = i + t.t.length; } }
  }
  return out;
}

/* ---------- estimar el nivel del libro ---------- */
async function sampleText(b, chars = 1500){
  const out = [], total = b.chapters.length;
  for (const ch of new Set([0.1, 0.45, 0.8].map(f => Math.min(total - 1, Math.floor(total * f))))) {
    const rec = await dbGet('text', `${b.id}|${ch}`); if (!rec) continue;
    const mid = Math.floor(rec.paras.length * 0.3); let t = '';
    for (let i = mid; i < rec.paras.length && t.length < chars; i++) if (!rec.heads.includes(i)) t += rec.paras[i] + '\n';
    if (t) out.push(t.slice(0, chars + 300));
  }
  return out;
}
async function estimateLevel(b){
  const parts = await sampleText(b);
  const user = `LIBRO: «${b.title}»${b.author ? ' de ' + b.author : ''}\n\n` + parts.map((t, i) => `FRAGMENTO ${i + 1}:\n${t}`).join('\n\n');
  const x = await askRetry(S.defModel, levelSystem(b.lang), user, LEVEL_SCHEMA, { effort: 'low', maxTokens: 6000, ms: 120000, kind: 'explain' });
  b.level = { ...x, model: S.defModel, date: Date.now() };
  await dbPut('books', b);
  return b.level;
}

/* ---------- simplificar el libro a un nivel ---------- */
const SIMP_JOBS = new Map();
function knownWordsHint(lang){
  const d = lang === DLANG ? DICT : load(dictKey(lang), {});
  return Object.values(d).filter(e => scoreOf(e) >= 50 && !SKIP_POS.has(e.pos)).sort((a, b) => (b.last || 0) - (a.last || 0)).slice(0, 250).map(e => e.lemma).join(', ');
}
const glossText = terms => (terms || []).map(t => `${t.src} → ${t.dst}${t.note ? ' (' + t.note + ')' : ''}`).join('; ');
async function simplifyChunk(b, ver, model, chunk, known, terms, stats){
  const lang = verLang(b, ver), lvl = verLvl(ver), sys = simpSystem(b.lang, lang, lvl);
  const head = `LIBRO: «${b.title}»${b.author ? ' de ' + b.author : ''}\nIDIOMA DE LA VERSIÓN: ${LANGS[lang].name}\nNIVEL: ${lvLabel(lang, lvl)}\n` +
    (terms?.length ? `NOMBRES Y TÉRMINOS (usa exactamente esta forma): ${glossText(terms)}\n` : '') + (known ? `PALABRAS QUE EL LECTOR YA CONOCE: ${known}\n` : '');
  const user = head + `\nPÁRRAFOS (${chunk.length}):\n` + chunk.map((t, i) => `[${i + 1}] ${t}`).join('\n\n');
  let ps = null;
  for (let attempt = 0; attempt < 2 && !ps; attempt++) {
    const out = await askRetry(model, sys, user, SIMP_SCHEMA, { effort: 'low', maxTokens: 20000, ms: 180000, kind: 'simplify', retries: 6 });
    const got = (out.paras || []).map(x => String(x).trim());
    if (got.length === chunk.length || attempt === 1) ps = chunk.map((orig, i) => got[i] ?? orig);
  }
  // revisión del nivel (modelo barato) y, si hay algo difícil, se reescriben solo esos párrafos (hasta 2 vueltas)
  if (S.simpCheck === false || lvIdx(lvl) >= 4) return ps;
  for (let round = 0; round < 2; round++) {
    const chk = await askRetry(CHECK_MODEL(), checkSystem(lang, lvl), (terms?.length ? `TÉRMINOS PERMITIDOS: ${terms.map(t => t.dst).join(', ')}\n\n` : '') + 'PÁRRAFOS:\n' + ps.map((t, i) => `[${i + 1}] ${t}`).join('\n\n'),
      CHECK_SCHEMA, { effort: 'low', maxTokens: 4000, ms: 90000, kind: 'simplify', fast: true, retries: 6 }).catch(() => null);
    const probs = (chk?.problems || []).filter(p => p.para >= 1 && p.para <= ps.length && (p.words?.length || p.grammar?.length));
    if (!probs.length) break;
    stats.checked = (stats.checked || 0) + probs.length;
    const fixUser = head + `\nEstos párrafos ya simplificados todavía tienen palabras o formas sobre el nivel ${lvLabel(lang, lvl)}. Reescríbelos para que TODO quede en el nivel: reemplaza lo marcado por palabras y estructuras más simples (o quita ese detalle si no es importante), sin cambiar los hechos.\n\nPÁRRAFOS (${probs.length}):\n` +
      probs.map((p, k) => `[${k + 1}] ${ps[p.para - 1]}\n   (difícil: ${[...(p.words || []), ...(p.grammar || [])].join(', ')})`).join('\n\n');
    const fixed = await askRetry(model, sys, fixUser, SIMP_SCHEMA, { effort: 'low', maxTokens: 12000, ms: 180000, kind: 'simplify', retries: 6 }).catch(() => null);
    const fp = (fixed?.paras || []).map(x => String(x).trim());
    if (fp.length !== probs.length) break;
    probs.forEach((p, k) => { if (fp[k]) ps[p.para - 1] = fp[k]; });
    stats.fixed = (stats.fixed || 0) + probs.length;
  }
  return ps;
}
// antes de empezar: los nombres propios y términos clave del libro, con una sola forma para toda la versión
async function bookGlossary(b, ver, model){
  const lang = verLang(b, ver), lvl = verLvl(ver);
  let sample = '';
  for (let ch = 0; ch < b.chapters.length && sample.length < 9000; ch++) { const r = await dbGet('text', `${b.id}|${ch}`); if (r) sample += r.paras.join('\n') + '\n'; }
  // nombres candidatos (en alfabeto latino: palabras con mayúscula que se repiten)
  const freq = {};
  for (let ch = 0; ch < b.chapters.length; ch++) { const r = await dbGet('text', `${b.id}|${ch}`); for (const p of r?.paras || []) for (const m of p.matchAll(/(?<![.!?]\s)(?<!^)\b\p{Lu}[\p{Ll}]{2,}(?:\s\p{Lu}[\p{Ll}]+)*/gu)) freq[m[0]] = (freq[m[0]] || 0) + 1; }
  const cands = Object.entries(freq).filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).slice(0, 80).map(([w]) => w);
  const out = await askRetry(model, [
    `Preparas una versión de un libro en ${LANGS[lang].name}, nivel ${lvLabel(lang, lvl)}${b.lang !== lang ? `, traducida del ${LANGS[b.lang].name}` : ''}. Para que todos los fragmentos usen las mismas formas, haz la lista de NOMBRES Y TÉRMINOS del libro:`,
    `- Los nombres propios de personas y lugares (src: como aparece en el original; dst: la forma que se usará siempre en ${LANGS[lang].name}${lang === 'ko' ? ', con la transcripción coreana más habitual' : ''}).`,
    '- Hasta 10 palabras clave de la historia que se repiten y no se pueden evitar aunque estén sobre el nivel (p. ej. «orfanato»): src, dst, y en note una explicación muy simple de su significado.',
    'Sé consistente y no inventes nombres que no aparecen.'
  ].join('\n'), `LIBRO: «${b.title}»${b.author ? ' de ' + b.author : ''}\n${cands.length ? 'NOMBRES CANDIDATOS: ' + cands.join(', ') + '\n' : ''}\nCOMIENZO DEL LIBRO:\n${sample.slice(0, 9000)}`,
    GLOSS_SCHEMA, { effort: 'low', maxTokens: 6000, ms: 120000, kind: 'simplify', retries: 6 });
  return (out.terms || []).filter(t => t.src && t.dst).slice(0, 120);
}
const SIMP_PAR = () => S.simpPar || 50;   // pedidos simultáneos al simplificar (⚙ Ajustes)
// todos los trozos de todos los capítulos van a una sola fila, con hasta SIMP_PAR pedidos a la vez; los capítulos se
// atienden en el orden pedido (el que estás leyendo primero) y cada uno se guarda apenas terminan sus trozos
async function simplifyBook(b, lvl, model, only = null){
  const key = `${b.id}|${lvl}`;
  if (SIMP_JOBS.has(key)) return;
  b.versions[lvl] = b.versions[lvl] || { model, lang: verLang(b, lvl), done: [], date: Date.now() };
  b.versions[lvl].done = b.versions[lvl].done || [];
  const chs = (only || b.chapters.map((_, i) => i)).filter(i => !b.versions[lvl].done[i]);
  if (!chs.length) return;
  const job = { doneCh: 0, totalCh: chs.length, doneParts: 0, totalParts: 0, failed: 0, err: '' };
  SIMP_JOBS.set(key, job);
  await dbPut('books', b); refreshViews();
  const known = knownWordsHint(verLang(b, lvl)), tasks = [], chapters = new Map();
  // nombres y términos fijos (una vez por versión; se guardan con ella)
  if (!b.versions[lvl].glossary) {
    job.phase = 'nombres';  refreshViews();
    try { b.versions[lvl].glossary = await bookGlossary(b, lvl, model); await dbPut('books', b); } catch (e) { console.warn('glosario:', e.message); b.versions[lvl].glossary = []; }
    job.phase = '';
  }
  const terms = b.versions[lvl].glossary;
  for (const ch of chs) {
    const rec = await dbGet('text', `${b.id}|${ch}`); if (!rec) continue;
    const chunks = []; let cur = [], len = 0;
    rec.paras.forEach(t => { if (cur.length && (len + t.length > 2500 || cur.length >= 40)) { chunks.push(cur); cur = []; len = 0; } cur.push(t); len += t.length; });
    if (cur.length) chunks.push(cur);
    chapters.set(ch, { rec, results: new Array(chunks.length), left: chunks.length, failed: false });
    chunks.forEach((chunk, i) => tasks.push({ ch, i, chunk }));
  }
  job.totalParts = tasks.length; refreshViews();
  const chapterDone = async ch => {
    const c = chapters.get(ch);
    await dbPut('simp', { k: `${b.id}|${lvl}|${ch}`, paras: c.results.flat(), heads: c.rec.heads });
    const fresh = await dbGet('books', b.id) || b; fresh.versions[lvl] = fresh.versions[lvl] || { model, done: [] }; fresh.versions[lvl].done[ch] = true; await dbPut('books', fresh);
    if (BOOK?.id === b.id) BOOK.versions = fresh.versions;
    Object.assign(b, { versions: fresh.versions });
    job.doneCh++; refreshViews();
    if (BOOK?.id === b.id && CH?.ver === lvl && CH.ch === ch && CH.missing) await openChapter(lvl, ch, CUR.p, 0);
  };
  let next = 0, stopAll = false;
  const worker = async () => {
    while (next < tasks.length && !stopAll) {
      const t = tasks[next++], c = chapters.get(t.ch);
      if (c.failed) continue;
      try { c.results[t.i] = await simplifyChunk(b, lvl, model, t.chunk, known, terms, job); }
      catch (e) {
        c.failed = true; job.failed++; job.err = errText(e);
        if (e instanceof NoKey || /clave|permiso|saldo/.test(e.message)) stopAll = true;   // no tiene sentido seguir
        continue;
      }
      job.doneParts++;
      if (--c.left === 0) await chapterDone(t.ch); else if (job.doneParts % 5 === 0) refreshViews();
    }
  };
  await Promise.all(Array.from({ length: Math.min(SIMP_PAR(), tasks.length) }, worker));
  if (job.fixed) console.info(`simplificación: ${job.fixed} párrafos reescritos por estar sobre el nivel`);
  if (job.failed) toast(`${job.failed} capítulo${job.failed > 1 ? 's' : ''} no se pudo simplificar (${job.err}). Puedes reintentar con «Completar».`);
  SIMP_JOBS.delete(key); refreshViews();
}

let PICK_FOR = null;
async function importFile(f, gut = null){
  if (/\.(leamos|json)$/i.test(f.name)) return importBackup(f);
  toast('Abriendo «' + f.name + '»…');
  try {
    const parsed = /\.txt$/i.test(f.name) || f.type === 'text/plain' ? parseText(await f.text(), f.name.replace(/\.txt$/i, '')) : await parseEpub(f);
    if (gut) { parsed.title = gut.title; parsed.author = gutAuthor(gut) || parsed.author; const l = (gut.languages || [])[0]; if (LANGS[l]) parsed.lang = l; }
    const b = await saveNewBook(parsed);
    if (gut) GUT.add[gut.id] = b.id;
    toast(`Listo: ${b.chapters.length} capítulos.`);
    openBookPanel(b.id, true);
  } catch (err) { console.error(err); toast('No se pudo abrir: ' + err.message); }
}
$('file').onchange = e => { const f = e.target.files[0], gut = PICK_FOR; e.target.value = ''; PICK_FOR = null; if (f) importFile(f, gut); };
// arrastrar un EPUB o .txt a la página
addEventListener('dragover', e => { if ([...(e.dataTransfer?.items || [])].some(i => i.kind === 'file')) e.preventDefault(); });
addEventListener('drop', e => {
  const f = e.dataTransfer?.files?.[0]; if (!f) return;
  e.preventDefault();
  if (!/\.(epub|txt|leamos|json)$/i.test(f.name)) { toast('Solo archivos EPUB, .txt o .leamos.'); return; }

  importFile(f);
});
/* ---------- exportar e importar (llevar libros a otro aparato) ----------
   Un archivo .leamos (JSON comprimido con gzip) con cada libro completo: texto, versiones simplificadas, traducciones,
   explicaciones guardadas y posición; y el diccionario de sus idiomas, con el avance de cada palabra. */
const safeName = t => String(t).replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 80) || 'libro';
function downloadBlob(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
async function exportBooks(ids, name){
  toast('Preparando el archivo…'); flushDict();
  try {
    const books = [];
    for (const id of ids) {
      const meta = await dbGet('books', id); if (!meta) continue;
      const p = id + '|', bk = { meta };
      for (const st of ['text', 'simp', 'ana', 'expl']) bk[st] = await dbPrefix(st, p);
      books.push(bk);
    }
    const dicts = {};
    for (const l of new Set(books.flatMap(b => [b.meta.lang, ...Object.keys(b.meta.versions || {}).map(v => verLang(b.meta, v))]))) dicts[l] = load(dictKey(l), {});
    const grams = {}; for (const l of Object.keys(dicts)) grams[l] = loadGram(l);
    let blob = new Blob([JSON.stringify({ app: 'leamos', format: 1, version: APP_VERSION, date: Date.now(), books, dicts, grams })], { type: 'application/json' });
    if ('CompressionStream' in window) blob = await new Response(blob.stream().pipeThrough(new CompressionStream('gzip'))).blob();
    downloadBlob(blob, safeName(name) + '.leamos');
    toast(`Listo: ${books.length} libro${books.length === 1 ? '' : 's'} (${(blob.size / 1e6).toFixed(1).replace('.', ',')} MB). Ábrelo en el otro aparato con «📥 Importar .leamos».`);
  } catch (e) { console.error(e); toast('No se pudo exportar: ' + e.message); }
}
// junta un diccionario importado con el de aquí: de cada palabra queda la versión con actividad más reciente,
// completada con lo que traiga la otra (definición detallada, formas vistas)
function mergeDict(lang, incoming){
  const mine = lang === DLANG ? DICT : load(dictKey(lang), {});
  const act = x => Math.max(x.srs?.last || 0, x.srs?.lapsedAt || 0, x.last || 0, x.knownAt || 0, x.added || 0);
  let n = 0;
  for (const [l, e] of Object.entries(incoming || {})) {
    const cur = mine[l];
    if (!cur) { mine[l] = e; n++; if (lang === DLANG) touch(l); continue; }
    const [base, other] = act(e) > act(cur) ? [e, cur] : [cur, e];
    const m = { ...other, ...base, forms: { ...(other.forms || {}), ...(base.forms || {}) } };
    if (!base.detailed && other.detailed) for (const f of ['meaning', 'explanation', 'hanja', 'irregular', 'conjugations', 'examples', 'detailed']) m[f] = other[f];
    if (JSON.stringify(m) !== JSON.stringify(cur)) { mine[l] = m; n++; if (lang === DLANG) touch(l); }
  }
  if (lang === DLANG) flushDict(); else save(dictKey(lang), mine);
  return n;
}
async function importBackup(f){
  toast('Importando «' + f.name + '»…');
  try {
    const buf = await f.arrayBuffer(), u = new Uint8Array(buf, 0, 2);
    const txt = u[0] === 0x1f && u[1] === 0x8b ? await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text() : new TextDecoder().decode(buf);
    const data = JSON.parse(txt);
    if (data.app !== 'leamos') throw new Error('no es un archivo de Leamos');
    const STORES = ['text', 'simp', 'ana', 'expl'];
    let n = 0, last = null;
    for (const bk of data.books || []) {
      let id = bk.meta.id;
      if (await dbGet('books', id)) {
        if (confirm(`«${bk.meta.title}» ya está en tu biblioteca. ¿Reemplazarlo por el del archivo?\n(Cancelar: agregarlo como copia)`)) {
          if (BOOK?.id === id) closeBook();
          for (const st of STORES) await dbDelPrefix(st, id + '|');
        } else {
          const nid = uid();
          for (const st of STORES) bk[st] = (bk[st] || []).map(r => ({ ...r, k: nid + r.k.slice(id.length) }));
          bk.meta = { ...bk.meta, id: nid, title: bk.meta.title + ' (copia)' }; id = nid;
        }
      }
      for (const st of STORES) await dbPutMany(st, bk[st]);
      await dbPut('books', bk.meta); n++; last = id;
    }
    let words = 0;
    for (const [lang, d] of Object.entries(data.dicts || {})) words += mergeDict(lang, d);
    // la gramática se junta punto por punto (apariciones de los dos lados; la explicación completa, si falta)
    for (const [lang, gi] of Object.entries(data.grams || {})) {
      const g = loadGram(lang);
      for (const [id, e] of Object.entries(gi || {})) {
        if (!g[id]) { g[id] = e; continue; }
        const keys = new Set(g[id].refs.map(r => r.key));
        g[id].refs = [...g[id].refs, ...(e.refs || []).filter(r => !keys.has(r.key))].slice(0, 60);
        if (!g[id].lesson && e.lesson) g[id].lesson = e.lesson;
      }
      save(gramKey(lang), g);
    }
    toast(`Importado: ${n} libro${n === 1 ? '' : 's'}${words ? ` y ${words} palabra${words === 1 ? '' : 's'} del diccionario` : ''}.`);
    if (!BOOK) drawLibrary();
  } catch (e) { console.error(e); toast('No se pudo importar: ' + e.message); }
}
$('fileImp').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); };

/* ---------- Project Gutenberg: buscar con Gutendex y descargar el EPUB ----------
   Si el navegador no deja descargar directo (CORS), se intenta a través de un intermediario público:
   los libros son de dominio público y no se envía ninguna clave. */
// los caminos posibles: tu intermediario (⚙ Ajustes), directo y dos intermediarios públicos gratuitos.
// Se prueban todos a la vez y gana el primero que responde bien.
const PATHS = () => [
  ...(S.proxy ? [['tu intermediario', u => S.proxy.replace(/\/+$/, '') + '/?url=' + encodeURIComponent(u)]] : []),
  ['directo', u => u],
  ['codetabs', u => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u)],
  ['allorigins', u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)]
];
// check: valida lo recibido (un intermediario puede contestar 200 con una página de error)
async function fetchOpen(url, { ms = 45000, check = null } = {}){
  const ctls = [], fails = [];
  const tries = PATHS().map(([name, make]) => (async () => {
    const ctl = new AbortController(); ctls.push(ctl);
    const timer = setTimeout(() => ctl.abort(), ms);
    try {
      const r = await fetch(make(url), { signal: ctl.signal });
      if (!r.ok) throw new Error('error ' + r.status);
      const buf = await r.arrayBuffer();
      if (check) check(buf);
      return buf;
    } catch (e) {
      const why = e.name === 'AbortError' ? 'no respondió' : /fetch|network|load failed/i.test(e.message) ? 'bloqueado' : e.message;
      fails.push(name + ': ' + why); throw e;
    } finally { clearTimeout(timer); }
  })());
  try { const buf = await Promise.any(tries); ctls.forEach(c => c.abort()); return buf; }
  catch (e) { throw new Error(fails.join(' · ')); }
}
const isJSON = buf => JSON.parse(new TextDecoder().decode(buf));
const isZip = buf => { const u = new Uint8Array(buf, 0, 2); if (u[0] !== 0x50 || u[1] !== 0x4b) throw new Error('no llegó un EPUB'); };
const isText = buf => { if (/^\s*<(!doctype|html)/i.test(new TextDecoder().decode(buf.slice(0, 200)))) throw new Error('llegó una página web'); };
const GUT = { q: '', lang: '', results: [], next: null, busy: false, err: '', add: {} };
function openGutenberg(){
  if (!GUT.lang) GUT.lang = BOOK?.lang || (S.lastGutLang || 'en');
  openPanel('Libros de Project Gutenberg', 'gut'); drawGut();
  if (!GUT.results.length && !GUT.busy) gutSearch();
}
async function gutSearch(more = false){
  GUT.busy = true; GUT.err = ''; if (!more) { GUT.results = []; GUT.next = null; } drawGut();
  try {
    const url = more && GUT.next ? GUT.next : `https://gutendex.com/books/?languages=${GUT.lang}` + (GUT.q ? '&search=' + encodeURIComponent(GUT.q) : '');
    const data = isJSON(await fetchOpen(url, { ms: 60000, check: isJSON }));
    GUT.results.push(...(data.results || [])); GUT.next = data.next || null;
  } catch (e) { GUT.err = e.message; }
  GUT.busy = false; drawGut();
}
const gutAuthor = b => (b.authors || []).map(a => a.name.replace(/^([^,]+),\s*(.+)$/, '$2 $1')).join(', ');
// las direcciones que da Gutendex (…/ebooks/1342.epub3.images) redirigen al archivo en /cache/, y los intermediarios
// devuelven el redireccionamiento sin seguirlo (el navegador lo bloquea): se piden primero las direcciones finales
function gutUrls(b){
  const id = b.id, f = b.formats || {}, c = `https://www.gutenberg.org/cache/epub/${id}/pg${id}`;
  const epub = f['application/epub+zip'], txt = Object.entries(f).find(([k]) => k.startsWith('text/plain'))?.[1];
  // primero el texto plano: una sola dirección, sin redireccionamiento; el EPUB queda de respaldo
  return [[c + '.txt', 'txt'], [c + '-images-3.epub', 'epub'], [c + '.epub', 'epub'], ...(txt ? [[txt, 'txt']] : []), ...(epub ? [[epub, 'epub']] : [])];
}
async function gutAdd(b){
  GUT.add[b.id] = 'busy'; GUT.addErr = GUT.addErr || {}; drawGut();
  let parsed = null, err = '';
  const urls = gutUrls(b);
  for (let i = 0; i < urls.length && !parsed; i++) {
    const [url, kind] = urls[i];
    GUT.addStep = GUT.addStep || {}; GUT.addStep[b.id] = `${kind === 'txt' ? 'texto' : 'EPUB'} (intento ${i + 1} de ${urls.length})`; drawGut();
    try {
      const buf = await fetchOpen(url, { ms: 20000, check: kind === 'epub' ? isZip : isText });
      parsed = kind === 'epub' ? await parseEpub(new File([buf], b.title + '.epub')) : parseText(new TextDecoder().decode(buf), b.title);
    } catch (e) { err = e.message; console.warn('Gutenberg', url, e.message); }
  }
  if (!parsed) { GUT.add[b.id] = 'err'; GUT.addErr[b.id] = err; drawGut(); return; }
  parsed.title = b.title; parsed.author = gutAuthor(b) || parsed.author;
  const l = (b.languages || [])[0]; if (LANGS[l]) parsed.lang = l;
  const meta = await saveNewBook(parsed);
  GUT.add[b.id] = meta.id; toast(`«${b.title}» está en tu biblioteca.`);
  if (PANEL === 'gut') drawGut();
}
const gutEpub = b => `https://www.gutenberg.org/cache/epub/${b.id}/pg${b.id}-images-3.epub`;

      ${st === 'err' ? `<div class="fix">El navegador no pudo descargarlo (${esc(GUT.addErr?.[b.id] || '')}).
        <p style="margin:6px 0">Bájalo tú y ábrelo aquí (el navegador no deja que la página lo haga sola):</p>
        <div class="row" style="margin-top:4px"><a class="btn sec" style="text-decoration:none" href="${gutEpub(b)}" target="_blank" rel="noopener" data-dl>1. ⬇ Descargar</a><button class="btn" data-pick>2. 📂 Ya lo bajé: abrirlo</button></div>
        ${S.proxy ? '' : '<p class="small" style="margin:6px 0 0">Para que se agregue solo, crea tu propio intermediario (⚙ Ajustes → Gutenberg).</p>'}</div>` : ''}</div>
      <div style="display:flex;flex-direction:column;gap:6px">${!st && !S.proxy ? `<a class="btn" style="text-decoration:none;text-align:center" href="${gutEpub(b)}" target="_blank" rel="noopener" data-dl>⬇ Descargar y abrir</a><button class="chip" data-add>intentar solo</button>` : st === 'busy' ? `<span class="busy">descargando… ${esc(GUT.addStep?.[b.id] || '')}</span>` : st && st !== 'err' ? '<button class="btn" data-open>Leer</button>' : `<button class="btn" data-add>${st === 'err' ? 'Reintentar' : 'Agregar'}</button>`}</div>`;
    d.querySelector('[data-add]')?.addEventListener('click', () => gutAdd(b));
    d.querySelector('[data-pick]')?.addEventListener('click', () => { PICK_FOR = b; $('file').click(); });
    // al descargar, de inmediato se pide abrir el archivo (la página no puede abrirlo sola)
    d.querySelectorAll('[data-dl]').forEach(a => a.addEventListener('click', () => askOpenDownloaded(b)));
    d.querySelector('[data-open]')?.addEventListener('click', () => openBookPanel(st, true));
    list.appendChild(d);
  }
  if (GUT.busy) list.insertAdjacentHTML('beforeend', '<p class="busy" style="text-align:center">Buscando…</p>');
  else if (GUT.err) list.insertAdjacentHTML('beforeend', `<div class="fix"><b>No se pudo buscar en Gutenberg.</b><div class="small">${esc(GUT.err)}</div>
    <p style="margin:6px 0">${S.proxy ? 'Revisa que la dirección de tu intermediario (⚙ Ajustes) esté bien.' : 'Los intermediarios gratuitos a veces fallan. Para que funcione siempre, crea tu propio intermediario (gratis, 5 minutos): ⚙ Ajustes → Gutenberg.'}</p>
    <a href="https://www.gutenberg.org/ebooks/search/?query=${encodeURIComponent(GUT.q)}" target="_blank" rel="noopener">Buscar en gutenberg.org</a>: descarga el «EPUB3» y ábrelo con 📂 en la biblioteca.</div>`);
  else if (!GUT.results.length) list.insertAdjacentHTML('beforeend', '<p class="small" style="text-align:center">No se encontraron libros.</p>');
  else if (GUT.next) { list.insertAdjacentHTML('beforeend', '<div class="row" style="justify-content:center"><button class="btn sec" id="gMore">Más resultados</button></div>'); $('gMore').onclick = () => gutSearch(true); }
  const go = () => { GUT.q = $('gQ').value.trim(); gutSearch(); };
  $('gGo').onclick = go;
  $('gQ').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('gLang').onchange = e => { GUT.lang = e.target.value; S.lastGutLang = GUT.lang; saveSet(); gutSearch(); };
}

/* ---------- paneles ---------- */
let PANEL = '', PANEL_BOOK = null;
function openPanel(title, kind){ PANEL = kind; $('ptitle').textContent = title; $('panel').hidden = false; $('pbody').scrollTop = 0; }
function closePanel(){ PANEL = ''; PANEL_BOOK = null; $('panel').hidden = true; if (!BOOK) drawLibrary(); else if (CH?.missing) renderReader(); else { renderHeader(); renderReaderKeep(); } }
$('pclose').onclick = closePanel;
function renderReaderKeep(){ const top = $('view').scrollTop; renderReader(); $('view').scrollTop = top; }

// el libro: nivel estimado, versiones simplificadas
async function openBookPanel(id, fresh = false){
  const b = await dbGet('books', id); if (!b) return;
  PANEL_BOOK = b; openPanel(b.title, 'book'); drawBook(id);
  if (fresh && !b.level && (KEYS[provOf(S.defModel)])) runEstimate(b);
}
let ESTIMATING = null;
async function runEstimate(b){
  ESTIMATING = b.id; drawBook(b.id);
  try { await estimateLevel(b); } catch (e) { toast('No se pudo estimar el nivel: ' + errText(e)); }
  ESTIMATING = null; if (BOOK?.id === b.id) BOOK.level = b.level; drawBook(b.id); if (!BOOK) drawLibrary();
}
async function drawBook(id){
  if (PANEL !== 'book') return;
  const b = await dbGet('books', id); if (!b) return; PANEL_BOOK = b;
  const lang = b.lang, my = myLevel(lang), chars = bookChars(b);
  const words = Math.round(chars / (lang === 'ko' ? 3.3 : CJK(lang) ? 1.6 : 5.7));
  const tgt = S.simpTarget && lvIdx(S.simpTarget) >= 0 ? S.simpTarget : myLevel(S.simpLang && LANGS[S.simpLang] ? S.simpLang : lang);
  const cost = m => { const c = simpCost(chars, lang, m); return c === null ? 'sin precio' : '~' + money(c); };
  const vers = Object.entries(b.versions || {}).sort((x, y) => verName(b, x[0]).localeCompare(verName(b, y[0])));
  const tl = S.simpLang && LANGS[S.simpLang] ? S.simpLang : lang, trn = tl !== lang;
  let h = `<div class="box"><div class="meta small">${esc(b.author || '')} · ${b.chapters.length} capítulos · ~${words.toLocaleString('es')} palabras</div>
    <div class="field"><label>Idioma del libro</label><select id="bLang">${Object.entries(LANGS).map(([k, L]) => `<option value="${k}" ${k === lang ? 'selected' : ''}>${L.native} · ${L.name}</option>`).join('')}</select></div>
    <div class="field"><label>Mi nivel en ${esc(LANGS[lang].name)}</label><select id="bMy">${CEFR.map(c => `<option ${c === my ? 'selected' : ''}>${c}</option>`).join('')}</select>
    <div class="small">Se usa para subrayar las palabras que probablemente no conoces y para simplificar.</div></div>
    <div class="row"><button class="btn" id="bRead">Leer${b.pos?.ver && b.pos.ver !== 'o' && b.versions?.[b.pos.ver] ? ' (' + esc(verName(b, b.pos.ver)) + ')' : ''}</button>${vers.length ? `<button class="btn sec" id="bReadO">Leer el original</button>` : ''}</div></div>`;
  h += `<div class="box"><h3>Nivel del libro</h3>`;
  if (ESTIMATING === id) h += `<div class="busy">Estimando el nivel con ${esc(mname(S.defModel))}…</div>`;
  else if (b.level) {
    const x = b.level, diff = lvIdx(x.cefr) - lvIdx(my);
    h += `<div class="gloss"><span class="badge lv" style="font-size:16px">${esc(lvLabel(lang, x.cefr))}</span> ${esc(x.range)}</div><div>${esc(x.summary)}</div>
      <div class="sec-t">Vocabulario</div><div>${esc(x.vocabulary)}</div><div class="sec-t">Gramática</div><div>${esc(x.grammar)}</div>
      ${x.advice ? `<div class="form">💡 ${esc(x.advice)}</div>` : ''}
      <div class="small">${diff > 0 ? `Está ${diff} nivel${diff > 1 ? 'es' : ''} sobre el tuyo (${my}): conviene simplificarlo.` : diff < 0 ? `Está bajo tu nivel (${my}).` : `Está en tu nivel (${my}).`}</div>
      <div class="row"><button class="btn sec" id="bEst">Volver a estimar</button></div>`;
  } else h += `<div class="small">Se toman tres fragmentos del libro y el modelo de explicaciones (${esc(mname(S.defModel))}) estima su nivel MCER${lang === 'ko' ? ' (y TOPIK)' : ''}.</div><div class="row"><button class="btn" id="bEst">Estimar nivel</button></div>`;
  h += `</div><div class="box"><h3>Versiones simplificadas o traducidas</h3>`;
  for (const [lvl, v] of vers) {
    const d = (v.done || []).filter(Boolean).length, job = SIMP_JOBS.get(`${id}|${lvl}`);
    h += `<div class="prog"><b>${esc(verName(b, lvl))}</b> <span class="small">${verKind(b, lvl)}</span> · ${d}/${b.chapters.length} capítulos · ${esc(mname(v.model))}${job ? ` · <span class="busy">${job.phase === 'nombres' ? 'preparando la lista de nombres…' : `preparando: ${job.doneParts}/${job.totalParts} partes, ${SIMP_PAR()} a la vez${job.fixed ? ` · ${job.fixed} párrafos reescritos por estar sobre el nivel` : ''}…`}</span>` : ''}
      <div class="bar"><i style="width:${job && job.totalParts ? 100 * job.doneParts / job.totalParts : 100 * d / b.chapters.length}%"></i></div>
      <div class="row" style="margin-top:6px"><button class="btn sec" data-readv="${lvl}">Leer</button>${d < b.chapters.length && !job ? `<button class="btn sec" data-cont="${lvl}">Completar</button>` : ''}${!job ? `<button class="btn sec" data-redo="${lvl}">Rehacer</button>` : ''}<button class="btn sec" data-del="${lvl}">Borrar</button></div></div>`;
  }
  h += `<p class="small">Reescribe cada párrafo con vocabulario y gramática del nivel elegido, sin cambiar la historia: en el mismo idioma (simplificar) o en otro (traducir y adaptar). Los párrafos quedan alineados con el original (en la lectura, ¶ muestra el original). Puedes hacerlo con todo el libro o ir capítulo por capítulo mientras lees.</p>
    <div class="field"><label>Idioma</label><select id="bTl">${Object.entries(LANGS).map(([k, L]) => `<option value="${k}" ${k === tl ? 'selected' : ''}>${L.native} · ${L.name}${k === lang ? ' (el del libro)' : ''}</option>`).join('')}</select></div>
    <div class="field"><label>Nivel</label><select id="bTgt">${CEFR.map(c => `<option value="${c}" ${c === tgt ? 'selected' : ''}>${esc(lvLabel(tl, c))}</option>`).join('')}</select></div>
    <div class="field"><label>Modelo para ${trn ? 'traducir' : 'simplificar'}</label><select id="bModel">${SIMP_MODELS.map(([m, l]) => `<option value="${m}" ${m === S.simpModel ? 'selected' : ''}>${esc(l)} · todo el libro ${cost(m)}</option>`).join('')}</select></div>
    ${lvIdx(tgt) <= 1 && S.simpModel === 'claude-haiku-5-5' ? `<div class="form">💡 Para ${esc(lvLabel(tl, tgt))} conviene <b>Claude Sonnet 5.5</b>: bajar tanto el nivel sin perder la historia es difícil, y Haiku tiende a dejar palabras y gramática más altas.</div>` : ''}
    <div class="small">${S.simpCheck === false ? 'Revisión del nivel desactivada (⚙ Ajustes).' : 'Después de cada parte, el modelo barato revisa si quedó algo sobre el nivel y, si es así, esos párrafos se reescriben (hasta 2 vueltas). Antes de empezar se arma una lista de nombres y términos para que no cambien.'}</div>
    <div class="row"><button class="btn" id="bSimpAll">${trn ? 'Traducir' : 'Simplificar'} todo el libro</button><button class="btn sec" id="bSimpRead">${trn ? 'Traducir' : 'Simplificar'} mientras leo</button></div></div>
    <div class="box"><h3>Llevar a otro aparato</h3><p class="small">Un archivo .leamos con el libro, sus versiones simplificadas, las traducciones y explicaciones ya pagadas, tu posición y tu diccionario de ${esc(LANGS[lang].name)}. En el otro aparato: biblioteca → «📥 Importar .leamos».</p>
      <button class="btn sec" id="bExport">📦 Exportar este libro</button></div>
    <div class="box"><button class="btn sec" id="bDelete">🗑 Borrar el libro</button></div>`;
  $('pbody').innerHTML = h;
  $('bLang').onchange = async e => { b.lang = e.target.value; await dbPut('books', b); await dbDelPrefix('ana', b.id + '|'); await dbDelPrefix('expl', b.id + '|'); if (BOOK?.id === id) { BOOK.lang = b.lang; useDict(b.lang); ANA.clear(); } drawBook(id); };
  $('bMy').onchange = e => { S.myLevel[lang] = e.target.value; saveSet(); drawBook(id); };
  $('bRead').onclick = () => { closePanel(); openBook(id); };
  if ($('bReadO')) $('bReadO').onclick = () => { closePanel(); openBook(id, 'o'); };
  if ($('bEst')) $('bEst').onclick = () => runEstimate(b);
  $('bTgt').onchange = e => { S.simpTarget = e.target.value; saveSet(); drawBook(id); };
  $('bTl').onchange = e => { S.simpLang = e.target.value; S.simpTarget = ''; saveSet(); drawBook(id); };
  $('bModel').onchange = e => { S.simpModel = e.target.value; saveSet(); drawBook(id); };
  $('bSimpAll').onclick = () => { if (!KEYS[provOf(S.simpModel)]) { toast('Falta la clave de la API (⚙ Ajustes).'); return; } simplifyBook(b, verKey(b, tl, $('bTgt').value), S.simpModel); };
  $('bSimpRead').onclick = async () => { const lvl = verKey(b, tl, $('bTgt').value); b.versions[lvl] = b.versions[lvl] || { model: S.simpModel, lang: tl, done: [], date: Date.now() }; await dbPut('books', b); closePanel(); await openBook(id, lvl); };
  $('pbody').querySelectorAll('[data-readv]').forEach(x => x.onclick = () => { closePanel(); openBook(id, x.dataset.readv); });
  $('pbody').querySelectorAll('[data-redo]').forEach(x => x.onclick = async () => {
    const v = x.dataset.redo;
    if (!confirm(`¿Rehacer la versión ${verName(b, v)}? Se borra lo hecho (y sus traducciones) y se vuelve a preparar todo el libro con ${mname(S.simpModel)}.`)) return;
    if (BOOK?.id === id && CH?.ver === v) await openChapter('o', CH.ch, CUR.p, 0);
    for (const st of ['simp', 'ana', 'expl']) await dbDelPrefix(st, `${id}|${v}|`);
    b.versions[v] = { model: S.simpModel, lang: verLang(b, v), done: [], date: Date.now() };
    await dbPut('books', b); if (BOOK?.id === id) BOOK.versions = b.versions;
    simplifyBook(b, v, S.simpModel);
  });
  $('pbody').querySelectorAll('[data-cont]').forEach(x => x.onclick = () => simplifyBook(b, x.dataset.cont, b.versions[x.dataset.cont].model || S.simpModel));
  $('pbody').querySelectorAll('[data-del]').forEach(x => x.onclick = async () => {
    if (!confirm(`¿Borrar la versión ${verName(b, x.dataset.del)}?`)) return;
    delete b.versions[x.dataset.del]; await dbPut('books', b); await dbDelPrefix('simp', `${id}|${x.dataset.del}|`); await dbDelPrefix('ana', `${id}|${x.dataset.del}|`); await dbDelPrefix('expl', `${id}|${x.dataset.del}|`);
    if (BOOK?.id === id) { BOOK.versions = b.versions; if (CH.ver === x.dataset.del) await openChapter('o', CH.ch, CUR.p, 0); }
    drawBook(id);
  });
  $('bExport').onclick = () => exportBooks([id], b.title);
  $('bDelete').onclick = async () => {
    if (!confirm(`¿Borrar «${b.title}»? (tus palabras quedan en el diccionario)`)) return;
    if (BOOK?.id === id) closeBook();
    for (const s of ['text', 'simp', 'ana', 'expl']) await dbDelPrefix(s, id + '|');
    await dbDel('books', id); closePanel();
  };
}

// mis palabras (del idioma del libro abierto, o el que se elija)
let WFILTER = 'todas', WQ = '';
function openWords(){ openPanel('Mis palabras', 'words'); drawWords(); }
function drawWords(){
  const lang = DLANG, all = Object.values(DICT).filter(e => e.lemma && !SKIP_POS.has(e.pos));
  const cls = e => (scoreOf(e) >= 100 || (!e.srs && e.status === 'conocida')) ? 'sabidas' : isNewWord(e) ? 'nuevas' : 'aprendiendo';
  const counts = { nuevas: 0, aprendiendo: 0, sabidas: 0 }; all.forEach(e => counts[cls(e)]++);
  let list = all.filter(e => WFILTER === 'todas' || cls(e) === WFILTER);
  if (WQ) { const q = WQ.toLowerCase(); list = list.filter(e => e.lemma.toLowerCase().includes(q) || (e.gloss || '').toLowerCase().includes(q) || Object.keys(e.forms || {}).some(f => f.toLowerCase().includes(q))); }
  list.sort((a, b) => scoreOf(a) - scoreOf(b) || (b.last || b.added || 0) - (a.last || a.added || 0));
  $('pbody').innerHTML = `<div class="field"><label>Idioma</label><select id="wLang">${Object.entries(LANGS).map(([k, L]) => `<option value="${k}" ${k === lang ? 'selected' : ''}>${L.native} · ${L.name}</option>`).join('')}</select>
    ${lang === 'ko' ? '<div class="small">El diccionario de coreano es el mismo de «Hablemos».</div>' : ''}</div>
    <div class="stats"><div><b>${all.length}</b>palabras</div><div><b>${counts.nuevas}</b>nuevas</div><div><b>${counts.aprendiendo}</b>aprendiendo</div><div><b>${counts.sabidas}</b>sabidas · ⭐ ${all.filter(e => scoreOf(e) >= 100).length} al 100 %</div></div>
    <input class="search" id="wQ" placeholder="Buscar…" value="${esc(WQ)}">
    <div class="filters">${['todas', 'nuevas', 'aprendiendo', 'sabidas'].map(f => `<button class="chip ${f === WFILTER ? 'on' : ''}" data-f="${f}">${f}</button>`).join('')}</div>
    <div id="wList"></div>`;
  const wl = $('wList');
  wl.innerHTML = list.slice(0, 400).map((e, i) => `<div class="ent" data-i="${i}"><div class="top"><span class="lem" lang="${lang}">${esc(e.lemma)}</span><span class="g">${esc(e.gloss || '')}</span><span class="small">${scoreOf(e)} %</span></div><div class="bar"><i style="width:${scoreOf(e)}%"></i></div></div>`).join('') + (list.length > 400 ? `<p class="small">… y ${list.length - 400} más (usa el buscador).</p>` : '') + (!list.length ? '<p class="small">Nada por aquí.</p>' : '');
  wl.querySelectorAll('.ent').forEach(el => el.onclick = () => { const e = list[+el.dataset.i]; SHEET = { kind: 'dict', tok: { t: e.lemma, lemma: e.lemma, pos: e.pos, gloss: e.gloss, form: '' } }; showSheet(); refreshSheet(); });
  $('wLang').onchange = e => { if (BOOK && e.target.value !== LANG()) { toast('Mientras lees se muestran las palabras del idioma que estás leyendo.'); e.target.value = DLANG; return; } useDict(e.target.value); drawWords(); };
  $('wQ').oninput = e => { WQ = e.target.value; const pos = e.target.selectionStart; drawWords(); $('wQ').focus(); $('wQ').setSelectionRange(pos, pos); };
  $('pbody').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { WFILTER = b.dataset.f; drawWords(); });
}

// ⭐ hoy: qué palabras se aprendieron o desaprendieron, cuándo, cómo y en qué oración
function openToday(){ openPanel('Hoy ⭐', 'today'); drawToday(); }
function drawToday(){
  if (PANEL !== 'today') return;
  const log = load('lec-log', {})[today()] || [];
  const won = log.filter(x => x.d > 0).length, lost = log.filter(x => x.d < 0).length;
  const hh = t => new Date(t).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  $('pbody').innerHTML = `<div class="stats" style="grid-template-columns:repeat(3,1fr)"><div><b>${todayNet()}</b>hoy (neto)</div><div><b>+${won}</b>aprendidas</div><div><b>−${lost}</b>desaprendidas</div></div>
    <p class="small">Una palabra nueva se da por aprendida cuando la pasas sin pedir su traducción (al avanzar de oración, leyendo en voz alta o, leyendo en silencio, cuando llega a la primera línea de la pantalla, justo antes de desaparecer). Si alguna no la sabías, márcala como nueva.</p>
    ${log.map((x, i) => `<div class="ent" data-i="${i}"><div class="top"><span class="small">${hh(x.t)}</span><span class="lem" lang="${x.lang || ''}" style="font-size:17px">${x.d > 0 ? '⭐' : '−1'} ${esc(x.w)}</span><span class="g">${esc(HOW[x.how] || '')}${x.d < 0 && x.sc !== undefined ? ` · bajó a ${x.sc} %` : ''}</span></div>
      ${x.text ? `<div class="small" lang="${x.lang || ''}" style="margin-top:3px">«${esc(x.text.trim().slice(0, 120))}»</div>` : ''}
      ${x.d > 0 ? `<div class="row" style="margin-top:6px"><button class="chip" data-undo="${i}">No la sabía: marcar como nueva</button></div>` : ''}</div>`).join('') || '<p class="small" style="text-align:center">Todavía nada hoy.</p>'}`;
  $('pbody').querySelectorAll('[data-undo]').forEach(b => b.onclick = () => {
    const x = log[+b.dataset.undo]; if (x.lang && x.lang !== DLANG) useDict(x.lang);
    const e = DICT[x.w]; if (!e) return;
    CREDIT_CTX = { how: 'desmarcada' }; setKnown(e, false); CREDIT_CTX = null; toast(`«${x.w}» vuelve a ser nueva.`);
    drawToday(); updateStars();
  });
}

// gramática: los puntos que fueron apareciendo en las explicaciones
let GLANG = null, GSEL = null, GQ = '';
function openGram(lang, id = null){ GLANG = lang || LANG(); GSEL = id; openPanel('Gramática', 'gram'); drawGram(); }
function drawGram(){
  if (PANEL !== 'gram') return;
  const lang = GLANG, g = loadGram(lang), pb = $('pbody');
  if (GSEL && g[GSEL]) return drawGramPoint(g[GSEL]);
  let list = Object.values(g);
  if (GQ) { const q = GQ.toLowerCase(); list = list.filter(e => (e.pattern + ' ' + e.title + ' ' + e.desc).toLowerCase().includes(q)); }
  list.sort((a, b) => (lvIdx(a.level) - lvIdx(b.level)) || a.pattern.localeCompare(b.pattern));
  const byLevel = {}; for (const e of list) (byLevel[e.level || '—'] ||= []).push(e);
  pb.innerHTML = `<div class="field"><label>Idioma</label><select id="gLangSel">${Object.entries(LANGS).map(([k, L]) => `<option value="${k}" ${k === lang ? 'selected' : ''}>${L.native} · ${L.name} (${Object.keys(loadGram(k)).length})</option>`).join('')}</select></div>
    <p class="small">Los puntos gramaticales se agregan solos cuando pides la explicación de una palabra (tercer toque) o de una frase (seleccionar o 🎓 Explicar). Cada uno lleva a las explicaciones donde apareció; su explicación completa se pide solo si la quieres.</p>
    <input class="search" id="gramQ" placeholder="Buscar…" value="${esc(GQ)}">
    ${list.length ? Object.entries(byLevel).map(([lv, es]) => `<div class="sec-t">${esc(lvLabel(lang, lv === '—' ? '' : lv) || 'Sin nivel')}</div>` + es.map(e => `<div class="ent" data-g="${esc(e.id)}"><div class="top"><span class="lem" lang="${lang}">${esc(e.pattern)}</span><span class="g">${esc(e.title)}</span><span class="small">${e.refs.length}${e.lesson ? ' · 🎓' : ''}</span></div><div class="small" style="margin-top:3px">${esc(e.desc)}</div></div>`).join('')).join('')
      : '<p class="small" style="text-align:center;margin-top:20px">Todavía no hay puntos. Pide el detalle de una palabra o una frase mientras lees.</p>'}`;
  $('gLangSel').onchange = e => { GLANG = e.target.value; GSEL = null; drawGram(); };
  $('gramQ').oninput = e => { GQ = e.target.value; const pos = e.target.selectionStart; drawGram(); $('gramQ').focus(); $('gramQ').setSelectionRange(pos, pos); };
  pb.querySelectorAll('[data-g]').forEach(el => el.onclick = () => { GSEL = el.dataset.g; drawGram(); $('pbody').scrollTop = 0; });
}
function drawGramPoint(e){
  const lang = GLANG, pb = $('pbody');
  $('ptitle').textContent = e.pattern;
  const L = e.lesson;
  pb.innerHTML = `<div class="row" style="margin-top:0"><button class="btn sec" id="gBack">← Toda la gramática</button></div>
    <div class="box"><div class="big" style="font-size:24px;font-weight:600" lang="${lang}">${esc(e.pattern)}</div>
      <div class="gloss">${esc(e.title)} ${e.level ? `<span class="badge lv">${esc(lvLabel(lang, e.level))}</span>` : ''}</div><div>${esc(e.desc)}</div></div>
    <div class="box"><h3>Explicación completa</h3>
      ${L ? `${paras(L.explanation)}${L.formation ? `<div class="sec-t">Cómo se forma</div>${paras(L.formation)}` : ''}
        ${(L.examples || []).length ? `<div class="sec-t">Ejemplos</div>${L.examples.map(x => `<div class="ex"><span lang="${lang}" data-say="${esc(x.text)}" style="cursor:pointer">🔊 ${esc(x.text)}</span><br><span class="small">${esc(x.es)}</span></div>`).join('')}` : ''}
        ${L.mistakes ? `<div class="form">⚠ ${esc(L.mistakes)}</div>` : ''}<div class="row"><button class="btn sec" id="gLesson">Explicar de nuevo</button></div>`
        : GBUSY === e.id ? `<div class="busy">El profesor (${esc(mname(S.defModel))}) está explicando…</div>` : `<p class="small">Todavía sin contenido. Se pide solo si la quieres (modelo de explicaciones).</p><button class="btn" id="gLesson">🎓 Explicar este punto en detalle</button>`}</div>
    <div class="box"><h3>Dónde apareció (${e.refs.length})</h3>
      ${e.refs.map((r, i) => `<div class="ent" data-r="${i}"><div class="small">${r.kind === 'word' ? `🔤 palabra <b lang="${lang}">${esc(r.word)}</b>` : '💬 frase'} · ${esc(r.bookTitle || '')}</div>
        <div lang="${lang}" style="margin:3px 0">${esc(r.text)}</div>${r.es ? `<div class="small">${esc(r.es)}</div>` : ''}
        <div class="row" style="margin-top:6px"><button class="chip" data-open="${i}">Ver la explicación</button><button class="chip" data-go="${i}">📖 Ir a la oración</button></div></div>`).join('') || '<p class="small">—</p>'}</div>`;
  $('gBack').onclick = () => { GSEL = null; $('ptitle').textContent = 'Gramática'; drawGram(); };
  pb.querySelectorAll('[data-say]').forEach(b => b.onclick = () => sayText(b.dataset.say, lang));
  if ($('gLesson')) $('gLesson').onclick = () => gramLesson(e.id);
  pb.querySelectorAll('[data-open]').forEach(b => b.onclick = ev => { ev.stopPropagation(); openRef(e.refs[+b.dataset.open], lang); });
  pb.querySelectorAll('[data-go]').forEach(b => b.onclick = ev => { ev.stopPropagation(); closePanel(); goToRef(e.refs[+b.dataset.go]); });
}
// la explicación completa de un punto (solo cuando se pide; queda guardada)
let GBUSY = null;
async function gramLesson(id){
  const lang = GLANG, e = loadGram(lang)[id]; if (!e) return;
  GBUSY = id; drawGram();
  try {
    const L = LANGS[lang];
    const x = await askRetry(S.defModel, [
      `Eres un profesor experto y cercano de ${L.name} para hispanohablantes. Explica un punto gramatical para un estudiante de nivel ${lvLabel(lang, myLevel(lang))}, en español:`,
      '- explanation: qué expresa, cuándo y para qué se usa, matices y registro, comparado con el español (2 a 4 párrafos cortos separados por una línea en blanco).',
      '- formation: cómo se forma (reglas, variantes y excepciones), con ejemplos cortos.',
      `- examples: 4 a 6 oraciones de ejemplo en ${L.name}, naturales y de dificultad creciente, con su traducción (text, es).`,
      '- mistakes: los errores frecuentes de los hispanohablantes con este punto (o "").'
    ].join('\n'), `PUNTO: ${e.pattern} (${e.title})\nDESCRIPCIÓN: ${e.desc}\n` + (e.refs.length ? `APARECIÓ EN: ${e.refs.slice(0, 4).map(r => '«' + r.text + '»').join(' · ')}` : ''),
      GLESSON_SCHEMA, { effort: 'low', maxTokens: 10000, ms: 150000, kind: 'explain' });
    const cur = loadGram(lang)[id]; if (cur) { cur.lesson = { ...x, date: Date.now(), model: S.defModel }; saveGramEntry(lang, cur); }
  } catch (err) { toast('No se pudo explicar: ' + errText(err)); }
  GBUSY = null; drawGram();
}
// abrir la explicación guardada de una aparición
async function openRef(r, lang){
  const rec = await dbGet('expl', r.key).catch(() => null);
  if (r.kind === 'phrase') {
    SHEET = { kind: 'phrase', text: r.text, x: rec?.x || { translation: r.es || '' }, saved: rec?.date || 0, range: [], ref: r, args: null };
    if (!rec) SHEET.err = 'Esta explicación ya no está guardada (¿se borró el libro?).';
  } else {
    useDict(lang);
    SHEET = { kind: 'dict', tok: { t: r.word, lemma: r.lemma, pos: '', gloss: '', form: '' }, ctx: rec?.ctx || r.ctx || '', points: rec?.points, ref: r };
  }
  showSheet(); refreshSheet();
}
// ir a la oración del libro donde apareció
async function goToRef(r){
  if (!r || !(await dbGet('books', r.bookId))) { toast('Ese libro ya no está en la biblioteca.'); return; }
  if (PANEL) closePanel();
  await openBook(r.bookId, r.ver);
  if (CH?.ver !== r.ver || CH?.ch !== r.ch) await openChapter(r.ver, r.ch, r.p, r.s); else setCursor(r.p, r.s);
}

// ajustes
function openSettings(){
  openPanel('Ajustes', 'settings');
  const lang = LANG(), vs = voicesFor(lang);
  const sel = (id, opts, cur) => `<select id="${id}">${opts.map(([v, l]) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  $('pbody').innerHTML = `
    <div class="box"><h3>Clave de la API</h3><p class="small">Es la misma de «Hablemos» (se guarda solo en este navegador y se envía directo a la API).</p>
      <div class="field"><label>Anthropic</label><input type="password" id="kA" value="${esc(KEYS.anthropic)}" placeholder="sk-ant-…"></div>
      <div class="field"><label>OpenAI (opcional)</label><input type="password" id="kO" value="${esc(KEYS.openai)}" placeholder="sk-…"></div>
      <div class="field"><label>Workspace de Anthropic (solo para claves de organización)</label><input type="text" id="kW" value="${esc(KEYS.workspace)}"></div></div>
    <div class="box"><h3>Modelos</h3>
      <div class="field"><label>Traducir palabras al leer (cada párrafo)</label>${sel('mRead', CHAT_MODELS, S.chatModel)}</div>
      <div class="field"><label>Explicaciones (tercer toque en una palabra, selección, nivel del libro)</label>${sel('mDef', DEF_MODELS, S.defModel)}</div>
      <div class="field"><label>Simplificar y traducir libros</label>${sel('mSimp', SIMP_MODELS, S.simpModel)}<div class="small">También se elige en la ficha de cada libro (ℹ). Se usa también para la lista de nombres y para reescribir lo que quedó sobre el nivel.</div></div>
      <div class="field"><label>Revisar el nivel de la simplificación</label>${sel('mCheck', [...CHAT_MODELS, ...DEF_MODELS.filter(([m]) => !CHAT_MODELS.some(c => c[0] === m))], CHECK_MODEL())}<div class="small">Busca palabras y gramática sobre el nivel en cada parte. Uno barato suele bastar; uno mejor detecta más.</div></div>
      <label class="check"><input type="checkbox" id="cAuto" ${S.autoAnalyze ? 'checked' : ''}><span>Traducir por adelantado los párrafos que vas a leer (la palabra que toques ya estará lista). Si no, se traduce el párrafo al tocar una palabra.</span></label>
      <label class="check"><input type="checkbox" id="cTrAlways" ${S.showTr ? 'checked' : ''}><span>Mostrar siempre la traducción de la oración marcada (si no, 文 la muestra solo para la oración que elijas). Con la traducción a la vista, las palabras de esa oración no suben.</span></label>
      <label class="check"><input type="checkbox" id="cSilent" ${S.silentRead !== false ? 'checked' : ''}><span>Contar la lectura sin voz: al bajar la página, cuentan como leídas las palabras de la primera línea de la pantalla (justo antes de desaparecer), si estuvieron un momento a la vista; las que pasan de largo no. La marca te sigue.</span></label></div>
    <div class="box"><h3>Mi nivel</h3><div class="conj" style="align-items:center">${Object.entries(LANGS).map(([k, L]) => `<span>${L.native}</span>${sel('lv_' + k, CEFR.map(c => [c, lvLabel(k, c)]), myLevel(k))}`).join('')}</div></div>
    <div class="box"><h3>Voz</h3>
      <div class="field"><label>Leer con</label>${sel('vProv', [['', 'La voz del navegador · gratis'], ['edge', 'Microsoft Edge · voz natural gratis (con tu intermediario)'], ['openai', 'OpenAI · voz natural (con tu clave de OpenAI)']], S.ttsProv || '')}
        ${S.ttsProv === 'openai' && !KEYS.openai ? '<div class="fix">Falta la clave de OpenAI (arriba).</div>' : ''}
        ${S.ttsProv === 'edge' && !S.proxy ? '<div class="fix">Hace falta tu intermediario de Cloudflare (más abajo, en «Gutenberg: tu intermediario»): es el mismo, y su código ya incluye la voz.</div>' : ''}</div>
      ${S.ttsProv === 'edge' ? `<div class="field"><label>Voz de Edge para ${esc(LANGS[lang].name)}</label>${sel('vEdge', EDGE_VOICES[lang] || [], edgeVoice(lang))}
        <div class="small">Las mismas voces neuronales de «Leer en voz alta» de Microsoft Edge (como edge-tts). Gratis. Cada oración se genera una vez y queda guardada; la palabra que se dice se resalta exacta. Si ya tenías el intermediario, vuelve a pegar el código nuevo de <a href="gutenberg-proxy.js" target="_blank">gutenberg-proxy.js</a> en tu worker.</div></div>` : ''}
      ${S.ttsProv === 'openai' ? `<div class="field"><label>Modelo</label>${sel('vModel', TTS_MODELS, ttsModel())}</div>
      <div class="field"><label>Voz de OpenAI (sirve para todos los idiomas)</label>${sel('vOai', TTS_VOICES.map(v => [v, v]), ttsVoice())}</div>
      ${ttsModel().startsWith('gpt-') ? `<div class="field"><label>Cómo debe leer</label><input type="text" id="vInstr" value="${esc(S.ttsInstr ?? TTS_DEFAULT_INSTR)}"></div>` : ''}
      <div class="small">Cada oración se genera una vez y queda guardada en este navegador (releer no cuesta). La velocidad se ajusta al reproducir. Del orden de 1,5 centavos de dólar por minuto de audio. Mientras suena una oración se pide la siguiente.</div>` : ''}
      <div class="field"><label>Voz del navegador (${esc(LANGS[lang].name)})</label>${vs.length ? sel('vVoice', [['', 'La primera disponible'], ...[...vs].sort((a, b) => /natural|online|neural/i.test(b.name) - /natural|online|neural/i.test(a.name)).map(v => [v.name, (/natural|online|neural/i.test(v.name) ? '★ ' : '') + v.name + ' · ' + v.lang])], S.voices[lang] || '') + (vs.some(v => /natural|online/i.test(v.name)) ? '<div class="small">★ = voz natural (en Microsoft Edge, las «Online (Natural)» son las mismas de edge-tts, gratis).</div>' : '<div class="small">En <b>Microsoft Edge</b> el navegador trae voces naturales gratis («Online (Natural)»): abre Leamos en Edge y elígelas aquí.</div>') : '<div class="small">No hay voces de este idioma en el sistema; se usará la voz por defecto.</div>'}</div>
      <div class="field"><label>Velocidad: <b id="rateV">${S.rate}</b></label><input type="range" id="rRate" min="0.5" max="1.4" step="0.05" value="${S.rate}" style="width:100%"></div>
      <label class="check"><input type="checkbox" id="cSay" ${S.autoSpeakWord ? 'checked' : ''}><span>Decir la palabra al tocarla (si no está leyendo)</span></label>
      <button class="btn sec" id="vTest">🔊 Probar</button></div>
    <div class="box"><h3>Simplificar</h3>
      <div class="field"><label>Pedidos simultáneos a la API</label><select id="sPar">${[5, 10, 20, 50, 100].map(n => `<option value="${n}" ${n === SIMP_PAR() ? 'selected' : ''}>${n}${n === 50 ? ' (por defecto)' : ''}</option>`).join('')}</select>
      <label class="check"><input type="checkbox" id="cCheck" ${S.simpCheck !== false ? 'checked' : ''}><span>Revisar el nivel: después de cada parte, el modelo barato busca palabras o gramática sobre el nivel y esos párrafos se reescriben (más fiel al nivel; cuesta ~35 % más).</span></label>
      <div class="small">Más pedidos a la vez = el libro se simplifica antes. Si tu cuenta tiene un límite bajo de pedidos por minuto, la API rechaza algunos y la app los reintenta (más lento); si ves fallas, baja este número.</div></div></div>
    <div class="box"><h3>Gutenberg y voz de Edge: tu intermediario (opcional)</h3>
      <p class="small">El navegador no deja que una página descargue libros de otro sitio si ese sitio no lo autoriza, y los intermediarios gratuitos a veces fallan. Con uno propio funciona siempre: es gratis y toma unos 5 minutos.</p>
      <ol class="small" style="padding-left:18px;margin:6px 0">
        <li>Crea una cuenta gratis en <a href="https://dash.cloudflare.com/sign-up" target="_blank" rel="noopener">Cloudflare</a>.</li>
        <li>En <b>Workers &amp; Pages</b> → <b>Create</b> → <b>Create Worker</b> (el «Hello World»), ponle un nombre y aprieta <b>Deploy</b>.</li>
        <li><b>Edit code</b>: borra lo que hay, pega el código de <a href="gutenberg-proxy.js" target="_blank">gutenberg-proxy.js</a> y aprieta <b>Deploy</b>.</li>
        <li>Copia la dirección del worker (algo como https://leamos.tu-nombre.workers.dev) y pégala aquí.</li>
      </ol>
      <div class="field"><label>Dirección del intermediario</label><input type="text" id="gProxy" value="${esc(S.proxy || '')}" placeholder="https://….workers.dev"></div>
      <div class="small">Solo deja pasar gutenberg.org y gutendex.com, y también da la voz gratuita de Microsoft Edge (⚙ Voz → Microsoft Edge). Por él pasan las direcciones de los libros y los textos a leer, nunca tu clave.</div></div>
    <div class="box"><h3>Lectura</h3>
      <div class="field"><label>Tamaño de la letra: <b id="fsV">${S.fs}</b> px</label><input type="range" id="rFs" min="15" max="30" step="1" value="${S.fs}" style="width:100%"></div>
      <div class="field"><label>Tema</label>${sel('sTheme', [['', 'Automático'], ['light', 'Claro'], ['dark', 'Oscuro']], S.theme)}</div></div>
    <div class="box"><h3>Cómo suben y bajan las palabras</h3><ul class="small" style="padding-left:18px;margin:4px 0">
      <li>Una palabra <b>nueva</b> (subrayada) que pasas sin pedir su traducción queda <b>sabida: 100 %</b>. «Pasar» es avanzar de oración (▶ o ⏭) o, leyendo en silencio, que llegue a la primera línea de la pantalla, justo antes de desaparecer (su párrafo tiene que haber estado un momento a la vista).</li>
      <li>Una palabra que ya habías consultado alguna vez y pasas sin pedir traducción <b>sube 10 puntos</b> (como mucho una vez por minuto).</li>
      <li>Pedir la traducción de una palabra: si es nueva, queda en <b>0</b>; si no, <b>baja 30 puntos</b>.</li>
      <li>Pedir la traducción (文) o la explicación de una frase: sus palabras <b>ni suben ni bajan</b>.</li>
      <li>Las <b>nuevas</b> se subrayan en verde; las que estás <b>aprendiendo</b> (ya las consultaste) tienen fondo azul, más claro cuanto más las sabes; las <b>sabidas</b> (100 %) no tienen marca. Al llegar a 100 %: 🎉.</li></ul></div>
    <div class="box"><h3>Gasto (estimado)</h3>${usageHTML()}</div>
    <p class="small" style="text-align:center">Leamos · versión ${APP_VERSION}</p>`;
  const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };
  on('kA', 'change', e => { KEYS.anthropic = e.target.value.trim(); saveKeys(); });
  on('kO', 'change', e => { KEYS.openai = e.target.value.trim(); saveKeys(); CLOUD_OFF = false; });
  on('kW', 'change', e => { KEYS.workspace = e.target.value.trim(); saveKeys(); });
  on('mRead', 'change', e => { S.chatModel = e.target.value; saveSet(); });
  on('mDef', 'change', e => { S.defModel = e.target.value; saveSet(); });
  on('mSimp', 'change', e => { S.simpModel = e.target.value; saveSet(); });
  on('mCheck', 'change', e => { S.checkModel = e.target.value; saveSet(); });
  on('cAuto', 'change', e => { S.autoAnalyze = e.target.checked; saveSet(); });
  on('cSilent', 'change', e => { S.silentRead = e.target.checked; saveSet(); });
  on('cTrAlways', 'change', e => { S.showTr = e.target.checked; saveSet(); });
  on('sPar', 'change', e => { S.simpPar = +e.target.value; saveSet(); });
  on('cCheck', 'change', e => { S.simpCheck = e.target.checked; saveSet(); });
  for (const k of Object.keys(LANGS)) on('lv_' + k, 'change', e => { S.myLevel[k] = e.target.value; saveSet(); });
  on('vVoice', 'change', e => { S.voices[lang] = e.target.value; saveSet(); });
  on('vProv', 'change', e => { S.ttsProv = e.target.value; saveSet(); stop(); openSettings(); });
  on('vModel', 'change', e => { S.ttsModel = e.target.value; saveSet(); openSettings(); });
  on('vOai', 'change', e => { S.ttsVoice = e.target.value; saveSet(); });
  on('vEdge', 'change', e => { S.edgeVoices = { ...(S.edgeVoices || {}), [lang]: e.target.value }; saveSet(); AUDIO_URLS.clear(); });
  on('vInstr', 'change', e => { S.ttsInstr = e.target.value.trim(); saveSet(); });
  on('rRate', 'input', e => { S.rate = +e.target.value; $('rateV').textContent = S.rate; saveSet(); });
  on('cSay', 'change', e => { S.autoSpeakWord = e.target.checked; saveSet(); });
  on('vTest', 'click', () => sayText(lang === 'ko' ? '안녕하세요. 오늘은 무슨 책을 읽을까요?' : lang === 'en' ? 'Hello! What shall we read today?' : LANGS[lang].native, lang));
  on('rFs', 'input', e => { S.fs = +e.target.value; $('fsV').textContent = S.fs; applyLook(); saveSet(); });
  on('sTheme', 'change', e => { S.theme = e.target.value; applyLook(); saveSet(); });
  on('gProxy', 'change', e => { let v = e.target.value.trim(); if (v && !/^https?:\/\//.test(v)) v = 'https://' + v; S.proxy = v; e.target.value = v; saveSet(); CLOUD_OFF = false; });
}

/* ---------- botones y teclado ---------- */
$('pPlay').onclick = () => PLAY ? stop() : play();
$('starBadge').onclick = openToday;
$('pNext').onclick = () => { const was = PLAY; stop(); next(true).then(() => { if (was) play(); }); };
$('pPrev').onclick = () => { const was = PLAY; stop(); prev(); if (was) play(); };
const RATES = [0.6, 0.75, 0.9, 1, 1.15];
$('pRate').onclick = () => { const i = RATES.findIndex(r => r >= S.rate - 0.001); S.rate = RATES[(i + 1) % RATES.length]; saveSet(); updateInfo(); if (PLAY) { if (UTT?.cloud) AUDIO.playbackRate = S.rate; else { stop(); play(); } } };
$('pTr').onclick = () => {
  if (S.showTr) { S.showTr = false; saveSet(); TR_ONCE = null; showTr(); return; }   // (apaga el modo «siempre»)
  const on = TR_ONCE && TR_ONCE.p === CUR.p && TR_ONCE.s === CUR.s && TR_ONCE.ch === CH?.ch;
  TR_ONCE = on ? null : { p: CUR.p, s: CUR.s, ch: CH?.ch };
  showTr();
};
$('pOrig').onclick = () => { SHOW_ORIG = !SHOW_ORIG; updateInfo(); showTr(); };
document.addEventListener('keydown', e => {
  if (!BOOK || PANEL || SHEET || /input|textarea|select/i.test(e.target.tagName)) { if (e.key === 'Escape') { if (SHEET) closeSheet(); else if (PANEL) closePanel(); } return; }
  if (e.key === ' ') { e.preventDefault(); $('pPlay').click(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); $('pNext').click(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); $('pPrev').click(); }
  else if (e.key === 't') $('pTr').click();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { savePosNow(); flushDict(); return; }
  // al volver: se retoman las traducciones pendientes y, si estaba leyendo, la voz
  if (BOOK && CH && !CH.missing) { prefetch(); prefetchVisible(); }
  if (PLAY) { navigator.wakeLock?.request('screen').then(w => WAKE = w).catch(() => {}); try { speechSynthesis.resume(); } catch (e) {} }
});
// un error inesperado se muestra (para poder contarlo) en vez de dejar la página a medias
const benign = m => /AbortError|ResizeObserver|aborted|cancel|interrupted/i.test(m || '');
addEventListener('error', e => { if (!benign(e.message)) toast('Error: ' + e.message + ' (versión ' + APP_VERSION + ')'); });
addEventListener('unhandledrejection', e => { const m = e.reason?.message || String(e.reason || ''); if (!benign(m) && !netCut(e.reason)) toast('Error: ' + m + ' (versión ' + APP_VERSION + ')'); });

drawLibrary();
</script>
</body>
</html>
